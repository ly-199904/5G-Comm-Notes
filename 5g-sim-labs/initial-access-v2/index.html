<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>5G NR · 全流程交互仿真学习台</title>
<link rel="stylesheet" href="design-system.css">
<style>
  .hub-wrap {
    width:100%; max-width:1600px; height:calc(100vh - 24px);
    background:var(--surface); border:1px solid var(--border);
    border-radius:18px; overflow:hidden; box-shadow:var(--shadow-lg);
  }
  .hub-sidebar-footer {
    margin-top:auto; padding-top:12px; border-top:1px solid var(--border);
    font-size:10px; color:var(--text-mut); font-family:var(--font-mono); line-height:1.7;
  }
  .hub-section-label {
    font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-mut);
    font-family:var(--font-mono); font-weight:700; padding:10px 4px 5px; margin-top:4px;
  }
  .hub-divider { height:1px; background:var(--border-2); margin:6px 0; }
</style>
</head>
<body>
<div class="hub-wrap">
  <div class="hub-layout">

    <div class="hub-sidebar">
      <div class="hub-sidebar-title">
        5G NR 初始接入<br>
        <span style="font-size:10px;color:var(--text-mut);font-weight:400;">全流程交互式仿真学习台</span>
      </div>

      <div class="hub-section-label">· 射频同步阶段</div>
      <button class="hub-stage-btn active" onclick="loadStage(0)" id="nav-0">
        <span class="hub-stage-num">⓪</span>UE 开机初始化
        <span class="hub-stage-badge done">完成</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(1)" id="nav-1">
        <span class="hub-stage-num">①</span>gNB SSB 广播
        <span class="hub-stage-badge done">完成</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(2)" id="nav-2">
        <span class="hub-stage-num">②</span>PSS 相关检测
        <span class="hub-stage-badge done">完成</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(3)" id="nav-3">
        <span class="hub-stage-num">③</span>SSS 帧同步
        <span class="hub-stage-badge wip">开发中</span>
      </button>

      <div class="hub-section-label">· 信息解析阶段</div>
      <button class="hub-stage-btn" onclick="loadStage(4)" id="nav-4">
        <span class="hub-stage-num">④</span>PBCH / MIB 解码
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(5)" id="nav-5">
        <span class="hub-stage-num">⑤</span>CORESET#0 盲检
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(6)" id="nav-6">
        <span class="hub-stage-num">⑥</span>SIB1 解析
        <span class="hub-stage-badge todo">待开发</span>
      </button>

      <div class="hub-section-label">· 接入控制阶段</div>
      <button class="hub-stage-btn" onclick="loadStage(7)" id="nav-7">
        <span class="hub-stage-num">⑦</span>PRACH 随机接入
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(8)" id="nav-8">
        <span class="hub-stage-num">⑧</span>RRC 建立 + 安全
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <div class="hub-sidebar-footer">
        3GPP Rel-15/16/17 &nbsp;·&nbsp; TS 38.211/212/213/321/331<br>
        Stage HTML 可独立运行
      </div>
    </div>

    <iframe class="hub-frame" id="stageFrame" src="stage-0-boot.html"></iframe>
  </div>
</div>

<script>
  var FILES = [
    'stage-0-boot.html','stage-1-gnb-ssb.html','stage-2-pss.html',
    'stage-3-sss.html','stage-4-pbch.html','stage-5-coreset.html',
    'stage-6-sib1.html','stage-7-prach.html','stage-8-rrc.html',
  ];
  var cur = 0;
  function loadStage(idx) {
    document.querySelectorAll('.hub-stage-btn').forEach(function(b,i){
      b.classList.toggle('active', i===idx);
    });
    cur = idx;
    document.getElementById('stageFrame').src = FILES[idx];
  }
</script>
</body>
</html>

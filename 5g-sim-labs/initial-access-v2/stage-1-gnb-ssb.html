/* ─── Sub 1: SSB Burst 时域（Case 切换）───────────────────── */
var _curCase = 'C';
var _animBeam = 0, _animPlaying = true, _animTid = null, _animPause = 0;
/* ── Case 辅助函数 ─────────────────────────────────────── */
function _cLmax(c){ return (c==='D'||c==='E')?64:(c==='A'||c==='B')?4:8; }
function _cCol(c){ return {A:'#6366f1',B:'#0891b2',C:'#2563eb',D:'#059669',E:'#f97316'}[c]||'#2563eb'; }
function _cScs(c){ return {A:'15kHz',B:'30kHz',C:'30kHz',D:'120kHz',E:'240kHz'}[c]; }
function _cFr(c){ return (c==='D'||c==='E')?'FR2':'FR1'; }

function _computeSSBPos(c) {
  if(c==='A') return [[0,2,0],[0,8,1],[1,2,0],[1,8,1]];   // L_max=4
  if(c==='B') return [[0,4,0],[0,8,1],[1,2,0],[1,6,1]];   // L_max=4
  if(c==='C') return [[0,2,0],[0,8,1],[1,2,0],[1,8,1],[2,2,0],[2,8,1],[3,2,0],[3,8,1]]; // L_max=8
  // D: {4,8,16,20}+28n n=0..15 | E: {8,12,16,20}+28n n=0..15
  var base=c==='D'?[4,8,16,20]:[8,12,16,20], pos=[];
  for(var n=0;n<16;n++){
    base.forEach(function(s,k){
      var sym=s+28*n;
      pos.push([Math.floor(sym/14), sym%14, k<2?0:1]);
    });
  }
  return pos;
}

function _ssbCenterX(idx) {
  var nS={A:5,B:10,C:10,D:40,E:80}[_curCase]||40;
  var sW=664/nS, syW=sW/14, bW=Math.max(2,4*syW);
  var p=_computeSSBPos(_curCase)[idx];
  return 28+p[0]*sW+p[1]*syW+bW/2;
}

/* ── 动画核心 ──────────────────────────────────────────── */
function _doAnimStep(){
  var lMax=_cLmax(_curCase), col=_cCol(_curCase);
  var ct=document.getElementById('cycleTimer');

  // ── 暂停倒计时阶段（模拟 15ms 数据区）──
  if(_animPause > 0){
    _animPause--;
    var totalPause = lMax>8?30:8;  // 30×200ms=6s(FR2) / 8×750ms=6s(FR1)
    var hand = document.getElementById('cycleHand');
    // 指针从 3 点(90°) 顺时针 270° 到 12 点(360°)
    var angle = 90 + 270 * (totalPause - _animPause) / totalPause;
    if(hand) hand.setAttribute('transform','rotate('+angle.toFixed(1)+' 625 290)');
    if(_animPause === 0){
      if(ct) ct.setAttribute('opacity','0');
      _animBeam = 0; _animPlaying = false;
      var lbl=document.getElementById('playLbl');
      if(lbl) lbl.textContent='播放';
    }
    return;
  }

  var cur=_animBeam, dimOp=lMax>8?'0.1':'0.22';
  for(var i=0;i<lMax;i++){
    var sb=document.getElementById('ssb-'+i);
    var bm=document.getElementById('bm-'+i);
    var bl=document.getElementById('bl-'+i);
    if(sb) sb.setAttribute('opacity',dimOp);
    if(bm){ bm.setAttribute('opacity','0.14'); bm.setAttribute('stroke-width','1'); }
    if(bl) bl.setAttribute('fill','#b0bec5');
  }
  var sb=document.getElementById('ssb-'+cur);
  var bm=document.getElementById('bm-'+cur);
  var bl=document.getElementById('bl-'+cur);
  if(sb) sb.setAttribute('opacity','1');
  if(bm){ bm.setAttribute('opacity','1'); bm.setAttribute('stroke-width',lMax>8?'2':'2.5'); }
  if(bl) bl.setAttribute('fill',col);
  if(lMax<=8){
    var _nS={A:5,B:10,C:10,D:40,E:80}[_curCase]||10;
    var _sW=664/_nS, _syW=_sW/14, _bW=Math.max(2,4*_syW);
    var _pos=_computeSSBPos(_curCase);
    var bx=(_pos[cur]?28+_pos[cur][0]*_sW+_pos[cur][1]*_syW+_bW/2:360).toFixed(1);
    var cl=document.getElementById('cline');
    if(cl) cl.setAttribute('d','M '+bx+' 154 C '+bx+' 182 360 200 360 214');
  }
  var st=document.getElementById('animSt');
  if(st) st.textContent='B'+cur+'  /  L_max='+lMax;
  var dn=document.getElementById('dynNote');
  if(dn) dn.textContent='当前激活：SSB #'+cur+' / B'+cur+
    ' · 若 UE 处于此方向 → 将在 PRACH 资源组 #'+cur+' 上发起随机接入';

  // ── 最后一个波束发完，进入暂停 ──
  _animBeam++;
  if(_animBeam >= lMax){
    _animBeam = 0;
    var totalPause = lMax>8?30:8;  // 与时钟指针分母一致
    _animPause = totalPause;
    if(ct) ct.setAttribute('opacity','1');
    var hand = document.getElementById('cycleHand');
    if(hand) hand.setAttribute('transform','rotate(90 625 290)');
  }
}

function _startAnim(){
  if(_animTid) clearInterval(_animTid);
  var speed=_cLmax(_curCase)>8?200:750;
  _animTid=Engine.addTimer(setInterval(function(){ if(_animPlaying) _doAnimStep(); }, speed));
  _doAnimStep();
}

function toggleAnim(){
  _animPlaying=!_animPlaying;
  var lbl=document.getElementById('playLbl');
  if(lbl) lbl.textContent=_animPlaying?'暂停':'播放';
  if(_animPlaying){ _doAnimStep(); }
}

function resetAnim(){
  _animBeam=0; _animPlaying=true;
  var lbl=document.getElementById('playLbl');
  if(lbl) lbl.textContent='暂停';
  _doAnimStep();
}

function updateFreq(g, k) {
  _gscn = g; _kssb = k;
  /* 直接写 NR_CTX（避免 3×ctxSet → 3×_renderViz 废渲染），再 1 次显式重绘 */
  window.NR_CTX.gscn=g; window.NR_CTX.arfcn=calcArfcn(parseFloat(calcFcMhz(g))); window.NR_CTX.kssb=k;
  Engine.syncTags();
  var vc = document.getElementById('vizContainer');
  if (vc) vc.innerHTML = renderFreqCoord();
}

/* ─── Sub 3: SSB 时频网格（PCI 联动 DMRS）────────────────── */
var _nid1 = 112, _nid2 = 1;

var _GX=28,_GY=29,_GW=370,_SYMW=92.5,_GH=224,_SCRH=224/240;
var _ZPX=412,_ZPY=29,_ZPSW=66,_ZPSH=19;

var _mibStep = 0;
var _mibScan = false;
function _classRE(sym,sc){
  if(sym===0) return (sc>=56&&sc<=182)?'pss':'empty';
  if(sym===2){
    if(sc>=48&&sc<=55)   return 'guard';
    if(sc>=56&&sc<=182)  return 'sss';
    if(sc>=183&&sc<=191) return 'guard';
  }
  return 'pbch';
}

function setPciStep(step){
  _pciStep=step;
  var svg=document.getElementById('ssbSvg');
  if(!svg) return;
  var cls=svg.getAttribute('class').replace(/\bstep\d\b/g,'').trim()+' step'+step;
  svg.setAttribute('class',cls);
  for(var i=0;i<4;i++){
    var bg=document.getElementById('sBg'+i);
    var bd=document.getElementById('sBd'+i);
    if(bg) bg.setAttribute('opacity',i===step?'1':'0');
    if(bd) bd.setAttribute('stroke-width',i===step?'2.5':'1.2');
  }
}

function _runAutoSteps(){
  if(_autoStepTid){ clearInterval(_autoStepTid); _autoStepTid=null; }
  var s=0; setPciStep(0);
  _autoStepTid=Engine.addTimer(setInterval(function(){
    s++; if(s<=3){ setPciStep(s); } else { clearInterval(_autoStepTid); _autoStepTid=null; }
  },1200));
}

      '<div class="nr-slider-wrap" style="margin-left:10px;">'+
        '<span style="color:var(--text-mut);font-size:11px;">N_ID&#178;</span>'+
        '<input id="n2r" class="nr-slider" type="range" min="0" max="2" value="'+_nid2+'" step="1"'+
        ' oninput="updateGrid(+document.getElementById(\'n1r\').value,+this.value)">'+
        '<input id="n2inp" type="number" min="0" max="2" value="'+_nid2+'"'+
        ' style="width:38px;padding:2px 4px;border:1.5px solid var(--border);border-radius:5px;'+
        'font-family:var(--font-mono);font-size:11px;text-align:center;color:var(--brand);font-weight:700;"'+
        ' oninput="updateGrid(+document.getElementById(\'n1r\').value,Math.min(2,Math.max(0,+this.value)))">'+
      '</div>'+
    '</div>'+
    '<svg id="ssbSvg" class="step'+_pciStep+' v'+v+'"'+
    ' viewBox="0 -67 720 '+SVG_H+'"'+
    ' width="100%" height="100%" style="display:block;flex:1;min-height:0;" xmlns="http://www.w3.org/2000/svg">'+
    css+'<g transform="translate(0,-30)">'+cells+lines+axLabels+prb0Box+'</g>'+topBars+'<g transform="translate(0,-20)">'+zoomPanel+leg+cards+'</g>'+
    '</svg></div>';
}

function updateGrid(n1,n2){
  n1=Math.min(335,Math.max(0,n1||0));
  n2=Math.min(2,Math.max(0,n2||0));
  _nid1=n1; _nid2=n2;
  var pci=3*n1+n2, v=pci%4;
  // Sync all inputs
  var r1=document.getElementById('n1r'); if(r1) r1.value=n1;
  var i1=document.getElementById('n1inp'); if(i1) i1.value=n1;
  var r2=document.getElementById('n2r'); if(r2) r2.value=n2;
  var i2=document.getElementById('n2inp'); if(i2) i2.value=n2;
  // Text updates
  function u(id,val){var e=document.getElementById(id);if(e)e.textContent=val;}
  u('pciEq','3×'+n1+'+'+n2);
  u('pciV','= '+pci);
  u('vV',v);
  u('dmrsFml',v);
  var dm2=document.getElementById('dmrsFml');
  if(dm2) dm2.nextSibling; // handled above
  // update "k mod 4 = v" text node next to dmrsFml
  var knode=document.getElementById('dmrsKtxt');
  if(knode) knode.textContent=' (k mod 4 = '+v+' 的子载波)';
  // Card 3 dynamic lines
  u('sCardD2','PCI = 3×'+n1+'+'+n2+' = '+pci);
  u('sCardD3','v = '+pci+' mod 4 = '+v+' · 144 RE');
  // CSS class — no DOM re-render
  var svg=document.getElementById('ssbSvg');
  if(svg){
    var cls=svg.getAttribute('class').replace(/\bv\d\b/,'v'+v);
    svg.setAttribute('class',cls);
  }
  /* PCI/nid1/nid2/dmrs_v 仅本地 DOM 更新，不写 NR_CTX：
     Stage 1 是 gNB 发送侧，UE 此刻还一无所知，顶栏 PCI 应保持未知状态 */
}

/* ─── Sub 4: MIB 比特打包 & Polar 编码链路 ─────────────────── */
function renderMIBPolar(){
  var cur=_mibStep, scanning=_mibScan;

  /* ══ 第一层：SSB / PBCH / MIB 容器关系 (y=-52~42) ══ */
  var layer1=
    '<rect x="28" y="-52" width="664" height="90" rx="10" fill="#f8fafc" stroke="#c8d6e8" stroke-width="1.5"/>'+
    '<rect x="36" y="-45" width="648" height="76" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>'+
    '<text x="44" y="-32" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="9" fill="#1e40af" font-weight="700">SSB &nbsp; 时频容器 · 4 Symbol × 20 PRB = 960 RE</text>'+
    '<rect x="48" y="-26" width="578" height="48" rx="5" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.2"/>'+
    '<text x="56" y="-14" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="9" fill="#065f46" font-weight="700">PBCH &nbsp; 信道 · Symbol 1/2/3 中 576 RE &nbsp;—&nbsp; 去除 DM-RS(144) 得 <tspan font-weight="900" fill="#1d4ed8">432 RE 有效载体</tspan></text>'+
    '<rect x="62" y="-8" width="380" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>'+
    '<text x="70" y="3" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="9" fill="#92400e" font-weight="700">MIB &nbsp; 货物 · 23 bit &nbsp;→&nbsp; Polar 链路膨胀 &nbsp;→&nbsp; 864 bit 装甲注入</text>'+
    '<text x="692" y="-60" text-anchor="end" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#dc2626" font-weight="900">432 RE × QPSK = 864 bit</text>';

  /* ══ 装配线阶段定义 ══ */
  var STAGES=[
    {bits:32,  short:'载荷组装', col:'#1d4ed8', label:'PBCH 载荷组装', sub:'24bit RRC 高层 + 8bit PHY 物理层 = 32bit'},
    {bits:56,  short:'+ CRC',    col:'#0891b2', label:'+ CRC-24C',   sub:'附加 24bit 校验码 → 共 56bit 进编码器'},
    {bits:512, short:'Polar',    col:'#059669', label:'Polar 编码',   sub:'56个有效比特占据高可靠信道 + 456个冻结比特置 0'},
    {bits:864, short:'速率匹配+扰码', col:'#d97706', label:'速率匹配 + PCI 扰码', sub:'圆形缓冲区循环读出 864bit · Gold序列XOR 小区染色'},
  ];
  var maxBits=864, BX=28, BY=140, BH=32, BW=664;

  /* ── 进度点 ── */
  var dots='', N=STAGES.length, gap=BW/(N-1), halfStep=BW/(2*(N-1));
  for(var d=0;d<N;d++){
    var dpx=(BX+d*gap+halfStep).toFixed(1);
    var dact=d<=cur;
    dots+='<circle cx="'+dpx+'" cy="'+(BY-22)+'" r="'+(d===cur?7:4)+'"'+
      ' fill="'+(dact?STAGES[d].col:'#d4dce8')+'"'+
      ' stroke="'+(d===cur?'white':'none')+'" stroke-width="2"'+
      ' style="cursor:pointer" onclick="advMib('+d+')"/>'+
      '<text x="'+dpx+'" y="'+(BY-38)+'" text-anchor="middle" dominant-baseline="central"'+
      ' font-family="SF Mono,Consolas,monospace" font-size="8" fill="'+(dact?STAGES[d].col:'#c8d6e8')+'">'+
      STAGES[d].bits+'bit</text>';
    if(d<N-1){
      var lx1=(parseFloat(dpx)+9).toFixed(1), lx2=(parseFloat(dpx)+gap-11).toFixed(1);
      dots+='<line x1="'+lx1+'" y1="'+(BY-22)+'" x2="'+lx2+'" y2="'+(BY-22)+'"'+
        ' stroke="'+(d<cur?STAGES[d].col:'#d4dce8')+'" stroke-width="1.2"/>';
    }
  }

  /* ── 进度条主体：每阶段只画当前段，宽度=bits/864 ── */
  var bars='<rect x="'+BX+'" y="'+BY+'" width="'+BW+'" height="'+BH+'" rx="4" fill="#f1f5f9" stroke="#d4dce8" stroke-width="1"/>';
  var sw=(STAGES[cur].bits/maxBits*BW);

  if(cur===0){
    /* 32bit = 24bit RRC(蓝) + 8bit PHY(紫) */
    var rrcW=(24/32)*sw, phyW=(8/32)*sw;
    bars+=
      '<rect x="'+BX.toFixed(1)+'" y="'+BY+'" width="'+rrcW.toFixed(1)+'" height="'+BH+'" fill="#1d4ed8" opacity="0.75"/>'+
      '<rect x="'+(BX+rrcW).toFixed(1)+'" y="'+BY+'" width="'+phyW.toFixed(1)+'" height="'+BH+'" fill="#7c3aed" opacity="0.85"/>';
  } else if(cur===1){
    /* 56bit 纯青（CRC-24C 附加后） */
    bars+='<rect x="'+BX.toFixed(1)+'" y="'+BY+'" width="'+sw.toFixed(1)+'" height="'+BH+'" fill="#0891b2" opacity="0.85"/>';
  } else if(cur===2){
    /* 512bit = 浅灰底 + 56个极窄金色竖条（Polar有效位，右密左疏） */
    bars+='<rect x="'+BX.toFixed(1)+'" y="'+BY+'" width="'+sw.toFixed(1)+'" height="'+BH+'" fill="#94a3b8" opacity="0.7"/>';
    var nGold=56;
    for(var i=0;i<nGold;i++){
      var norm=Math.pow(i/(nGold-1), 0.35);
      var gx=BX+norm*sw-0.5;
      bars+='<rect x="'+gx.toFixed(1)+'" y="'+(BY+4)+'" width="1" height="'+(BH-8)+'" fill="#f59e0b" opacity="0.92" filter="url(#glow2)"/>';
    }
  } else if(cur===3){
    /* 864bit = 满条 + 扰码纹理 */
    bars+=
      '<defs>'+
      '<pattern id="scr" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">'+
      '<rect width="6" height="6" fill="#d97706" opacity="0.82"/>'+
      '<rect width="3" height="3" fill="#b45309" opacity="0.35"/>'+
      '<rect x="3" y="3" width="3" height="3" fill="#b45309" opacity="0.35"/>'+
      '</pattern></defs>'+
      '<rect x="'+BX.toFixed(1)+'" y="'+BY+'" width="'+sw.toFixed(1)+'" height="'+BH+'" fill="url(#scr)"/>'+
      '<text x="'+(BX+sw-16).toFixed(1)+'" y="'+(BY+BH+14)+'" text-anchor="end" dominant-baseline="central"'+
      ' font-family="SF Mono,Consolas,monospace" font-size="10" fill="#d97706" font-weight="700">'+
      '864÷2 = 432 PBCH RE &#8593;</text>';
  }

  /* 当前阶段 bit 数居中显示 */
  bars+='<text x="'+(BX+sw/2).toFixed(1)+'" y="'+(BY+BH/2)+'" text-anchor="middle" dominant-baseline="central"'+
    ' font-family="SF Mono,Consolas,monospace" font-size="11" fill="white" font-weight="900">'+
    STAGES[cur].bits+'</text>';

  /* ── 当前阶段说明 ── */
  var NOTE_Y=BY+BH+19;
  bars+=
    '<text x="'+BX+'" y="'+(NOTE_Y+2)+'" dominant-baseline="central"'+
    ' font-family="SF Mono,Consolas,monospace" font-size="10" fill="'+STAGES[cur].col+'" font-weight="700">'+
    STAGES[cur].label+'</text>'+
    '<text x="'+BX+'" y="'+(NOTE_Y+18)+'" dominant-baseline="central"'+
    ' font-family="SF Mono,Consolas,monospace" font-size="9" fill="#64748b">'+STAGES[cur].sub+'</text>';

  // 特殊阶段附加说明
  var extraNote='';
  if(cur===2){
    extraNote=
      '<text x="'+BX+'" y="'+(NOTE_Y+34)+'" dominant-baseline="central"'+
      ' font-family="SF Mono,Consolas,monospace" font-size="9.5" fill="#334155">'+
      '金色 56bit = 有效数据 · 灰色 456bit = 冻结比特（置0）· 极化码让噪声只攻击冻结位，保护有效比特</text>';
  }
  if(cur===3){
    extraNote=
      '<text x="'+BX+'" y="'+(NOTE_Y+34)+'" dominant-baseline="central"'+
      ' font-family="SF Mono,Consolas,monospace" font-size="9.5" fill="#334155">'+
      '扰码序列由 PCI 决定 → 不同小区 PBCH 扰码不同 → 防止 UE 误将邻区 PBCH 当作本小区解读（"小区染色"）</text>';
  }

  /* ── 导航按钮 ── */
  var BTN_Y=BY+BH+37;
  var navBtns=
    '<g onclick="advMib('+Math.max(0,cur-1)+')" style="cursor:pointer;'+(cur===0?'opacity:0.3':'')+'" >'+
    '<rect x="508" y="'+BTN_Y+'" width="84" height="20" rx="5" fill="white" stroke="#c8d6e8" stroke-width="1.2"/>'+
    '<text x="550" y="'+(BTN_Y+10)+'" text-anchor="middle" dominant-baseline="central"'+
    ' font-family="SF Mono,Consolas,monospace" font-size="10" fill="#64748b">&#9665; 上一步</text>'+
    '</g>'+
    '<g onclick="advMib('+Math.min(3,cur+1)+')" style="cursor:pointer;'+(cur===3?'opacity:0.3':'')+'" >'+
    '<rect x="600" y="'+BTN_Y+'" width="84" height="20" rx="5" fill="'+STAGES[Math.min(cur+1,3)].col+'" stroke="none"/>'+
    '<text x="642" y="'+(BTN_Y+10)+'" text-anchor="middle" dominant-baseline="central"'+
    ' font-family="SF Mono,Consolas,monospace" font-size="10" fill="white" font-weight="700">下一步 &#9655;</text>'+
    '</g>';

  /* ══ 第三层：23bit MIB 字段位图 ══ */
  var MIB_FIELDS=[
    {name:'SFN[9:4]', bits:6, col:'#3b82f6', val:'000101', note:'系统帧号高6位'},
    {name:'SCS',      bits:1, col:'#7c3aed', val:'1',      note:'1=30kHz'},
    {name:'',         bits:1, col:'#6366f1', val:'0',      note:'DMRS TypeA位置'},
    {name:'k_SSB',    bits:4, col:'#d97706', val:'0010',   note:'SSB↔CRB子载波偏移', key:true},
    {name:'CORS#0',   bits:8, col:'#059669', val:'00000101', note:'CORESET#0时频资源', key:true},
    {name:'',         bits:1, col:'#dc2626', val:'0',      note:'小区禁入标志'},
    {name:'',         bits:1, col:'#8b5cf6', val:'0',      note:'同频重选允许'},
    {name:'',         bits:1, col:'#94a3b8', val:'0',      note:'前向兼容预留'},
  ];
  var MX=28, MW=664, MBH=28;
  var MAP_Y=BY+BH+68+50+15;

  /* bit ruler axis */
  var ruler='<line x1="'+MX+'" y1="'+(MAP_Y-14)+'" x2="'+(MX+MW)+'" y2="'+(MAP_Y-14)+'" stroke="#94a3b8" stroke-width="1"/>';
  for(var bi=0;bi<=23;bi++){
    var rx2=(MX+bi*MW/23).toFixed(1);
    var isM=(bi%4===0);
    ruler+='<line x1="'+rx2+'" y1="'+(MAP_Y-14)+'" x2="'+rx2+'" y2="'+(MAP_Y-(isM?20:17))+'" stroke="#64748b" stroke-width="'+(isM?1.2:0.6)+'"/>';
    if(isM||bi===23){
      ruler+='<text x="'+rx2+'" y="'+(MAP_Y-24)+'" text-anchor="middle" dominant-baseline="central"'+
        ' font-family="SF Mono,Consolas,monospace" font-size="9.5" fill="#64748b">'+bi+'</text>';
    }
  }
  ruler+='<text x="'+MX+'" y="'+(MAP_Y-32)+'" dominant-baseline="central"'+
    ' font-family="SF Mono,Consolas,monospace" font-size="10" fill="#64748b">bit →</text>';

  /* field bars */
  var mibBits='', off3=0, noteStagger=0;
  MIB_FIELDS.forEach(function(f){
    var fw=f.bits*MW/23, fx=MX+off3*MW/23;
    var isKey=!!f.key;
    var isNarrow=fw<35; // 1-bit blocks need staggered notes
    if(isNarrow) noteStagger^=1; // toggle 0↔1 for consecutive narrow blocks
    var noteOffY=isNarrow&&noteStagger?14:0; // alternate: normal / +14px
    var op=scanning?(isKey?'0.95':'0.12'):'0.82';
    mibBits+=
      '<rect x="'+fx.toFixed(1)+'" y="'+MAP_Y+'" width="'+(fw-1).toFixed(1)+'" height="'+MBH+'"'+
      ' rx="3" fill="'+f.col+'" opacity="'+op+'"'+
      (scanning&&isKey?' filter="url(#glow2)"':'')+
      '/>'+
      '<text x="'+(fx+fw/2).toFixed(1)+'" y="'+(MAP_Y+MBH/2)+'"'+
      ' text-anchor="middle" dominant-baseline="central"'+
      ' font-family="SF Mono,Consolas,monospace" font-size="'+(fw>50?9:fw>25?7.5:6)+'"'+
      ' fill="white" font-weight="'+(isKey?'800':'600')+'" opacity="'+op+'">'+
      (fw>18?f.name:'')+'</text>'+
      // value below
      '<text x="'+(fx+fw/2).toFixed(1)+'" y="'+(MAP_Y+MBH+9)+'" text-anchor="middle" dominant-baseline="central"'+
      ' font-family="SF Mono,Consolas,monospace" font-size="9.5"'+
      ' fill="'+(scanning&&!isKey?'#cbd5e1':f.col)+'" opacity="'+(scanning&&!isKey?'0.25':'0.75')+'">'+
      f.val+'</text>'+
      // note below val (staggered for adjacent narrow blocks)
      '<text x="'+(fx+fw/2).toFixed(1)+'" y="'+(MAP_Y+MBH+20+noteOffY)+'" text-anchor="middle" dominant-baseline="central"'+
      ' font-family="SF Mono,Consolas,monospace" font-size="9"'+
      ' fill="'+(scanning&&!isKey?'#cbd5e1':'#64748b')+'" opacity="'+(scanning&&!isKey?'0.2':'0.7')+'">'+
      f.note+'</text>';

    // Key callouts when scanning
    if(scanning && isKey){
      var kcx=(fx+fw/2).toFixed(1);
      var isKssb=f.name==='k_SSB';
      var kLabel=isKssb?'ssb-SubcarrierOffset（4bit）= RE 级频域精对齐':'pdcch-ConfigSIB1（8bit）= CORESET#0 索引 → Stage 5 唯一入口 🔑';
      var kW=isKssb?180:240;
      var kOffY=isKssb?0:28;
      mibBits+=
        '<line x1="'+kcx+'" y1="'+(MAP_Y+MBH)+'" x2="'+kcx+'" y2="'+(MAP_Y+MBH+38+kOffY)+'"'+
        ' stroke="'+f.col+'" stroke-width="1.5" stroke-dasharray="3 2"/>'+
        '<rect x="'+(parseFloat(kcx)-kW/2).toFixed(1)+'" y="'+(MAP_Y+MBH+38+kOffY)+'"'+
        ' width="'+kW+'" height="18" rx="5"'+
        ' fill="'+f.col+'" opacity="0.14" stroke="'+f.col+'" stroke-width="1.5"/>'+
        '<text x="'+kcx+'" y="'+(MAP_Y+MBH+47+kOffY)+'" text-anchor="middle" dominant-baseline="central"'+
        ' font-family="SF Mono,Consolas,monospace" font-size="8.5" fill="'+f.col+'" font-weight="700">'+
        kLabel+'</text>';
    }
    off3+=f.bits;
  });

  // Scan button
  var SCAN_Y=MAP_Y-44;
  var scanBtn=
    '<g onclick="toggleMibScan()" style="cursor:pointer;">'+
    '<rect x="556" y="'+(SCAN_Y-10)+'" width="130" height="20" rx="5"'+
    ' fill="'+(scanning?'#1d4ed8':'white')+'" stroke="#1d4ed8" stroke-width="1.5"/>'+
    '<text x="621" y="'+SCAN_Y+'" text-anchor="middle" dominant-baseline="central"'+
    ' font-family="SF Mono,Consolas,monospace" font-size="9.5"'+
    ' fill="'+(scanning?'white':'#1d4ed8')+'" font-weight="700">'+
    (scanning?'▣ X光 ON · 点击关闭':'▢ X光扫描 k_SSB / CORS#0')+'</text>'+
    '</g>';

  var SVG_H=MAP_Y+MBH+68;
  return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;">'+
    '<svg id="mibSvg" viewBox="0 -35 720 '+SVG_H+'"'+
    ' width="100%" height="100%" style="display:block;flex:1;min-height:0;" xmlns="http://www.w3.org/2000/svg">'+
    '<defs>'+
    '<filter id="glow2"><feGaussianBlur stdDeviation="2.5" result="blur"/>'+
    '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
    '</defs>'+
    layer1+dots+bars+extraNote+navBtns+ruler+scanBtn+mibBits+
    '</svg></div>';
}

function advMib(step){
  if(step<0||step>3) return;
  _mibStep=step;
  var vc=document.getElementById('vizContainer'); if(vc) vc.innerHTML=renderMIBPolar();
}
function toggleMibScan(){
  _mibScan=!_mibScan;
  var vc=document.getElementById('vizContainer'); if(vc) vc.innerHTML=renderMIBPolar();
}
function _runMibAuto(){
  _mibStep=0; _mibScan=false;
  var vc=document.getElementById('vizContainer');
  if(vc) vc.innerHTML=renderMIBPolar();
  var tid=Engine.addTimer(setInterval(function(){
    if(_mibStep<3){ _mibStep++; }
    else { _mibScan=true; clearInterval(tid); }
    var vc2=document.getElementById('vizContainer');
    if(vc2) vc2.innerHTML=renderMIBPolar();
  }, 1100));
}

/* ─── Viz Router ────────────────────────────────────────────── */
Engine.renderVizSVG = function(subIdx) {
  if (subIdx === 0) return renderS1Discuss();
  if (subIdx === 1) return renderSSBBurst();
  if (subIdx === 2) return renderFreqCoord();
  if (subIdx === 3) return renderSSBGrid();
  if (subIdx === 4) return renderMIBPolar();
  return renderS1Discuss();
};

Engine.onAfterRender = function(subIdx) {
  if(subIdx===1){ _animBeam=0; _animPlaying=true; _startAnim(); }
  if(subIdx===3){ setTimeout(_runAutoSteps, 300); }
  if(subIdx===4){ setTimeout(_runMibAuto, 400); }
};

Engine.onStageExit = function() {
  if(_animTid){ clearInterval(_animTid); _animTid=null; }
  if(_autoStepTid){ clearInterval(_autoStepTid); _autoStepTid=null; }
};

Engine.boot({ stageIdx: 1 });
</script>

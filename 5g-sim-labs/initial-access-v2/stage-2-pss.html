  <text x="44" y="402" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="15" font-weight="700" fill="#1e293b">d_PSS(n) = 1 &#8722; 2&#183;x(m),&#160;&#160;&#160; m = (n + 43&#183;N_ID&#178;) mod 127</text>

/* ─── Sub 1: m-序列发生器（环形隐喻）─────────────────────── */
/* m-序列生成 TS 38.211 §7.4.2.2.1 */
function _msGen(){
  var x=[0,1,1,0,1,1,1];
  for(var i=0;i<120;i++) x.push((x[i+4]+x[i])%2);
  return x.slice(0,127);
}
var MS_X = _msGen();                 // x(0..126)
var _msPhase = 'gen';                // 'gen' | 'ring' | 'strip'
var _msNid2  = 0;
var _msClk   = 0;                    // 已吐出珠数 0..127
var _msPlaying = true;
var _msTid   = null;
var _msShiftTid = null;

var MS_CX=360, MS_CY=246, MS_R=110;   // 上移 + 缩半径，给底部图例条让位
function _beadXY(j){ var a=(-90 + j*360/127)*Math.PI/180; return [MS_CX+MS_R*Math.cos(a), MS_CY+MS_R*Math.sin(a)]; }
function _stripXY(n){ return [46 + n*(628/126), MS_CY]; }
function _theta(k){ return -(43*k)*360/127; }   // 把珠 43k 转到 12 点
var MS_AMBER='#d97706', MS_ON='#d97706', MS_OFF='#ffffff';

function _bead(j){
  var bit = MS_X[j];
  var revealed = (_msPhase!=='gen') || (j < _msClk);
  var px, py;
  if(_msPhase==='strip'){ var n=((j-43*_msNid2)%127+127)%127; var p=_stripXY(n); px=p[0]; py=p[1]; }
  else { var c=_beadXY(j); px=c[0]; py=c[1]; }
  var fill   = !revealed ? '#eef2f7' : (bit? MS_ON : MS_OFF);
  var stroke = !revealed ? '#e2e8f0' : (bit? '#b45309' : '#cbd5e1');
  var r = (_msPhase==='strip') ? 2.4 : 3.0;
  return '<g class="msb" id="msb'+j+'" transform="translate('+px.toFixed(2)+','+py.toFixed(2)+')">'+
         '<circle r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1"/></g>';
}

function _lfsrInner(){
  var startX=223, y=58, bw=34, bh=30, step=40;
  var s='';
  s+='<text x="360" y="14" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="11" font-weight="700" fill="#b45309">7 级 LFSR · g(x)=x&#8311;+x&#8308;+1 · 抽头 D&#8327;&#8853;D&#8308; &#8594; 反馈</text>';
  for(var p=0;p<7;p++){
    var cx=startX+p*step;
    var idx=((_msClk-7+p)%127+127)%127;
    var bit = (_msPhase==='gen' && _msClk<7 && p< (7-_msClk)) ? '' : MS_X[idx];
    var isTap=(p===0||p===3);
    s+='<rect x="'+cx+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+(isTap?'#fff7ed':'#f8fafc')+'" stroke="'+(isTap?MS_AMBER:'#cbd5e1')+'" stroke-width="'+(isTap?'1.8':'1.2')+'"/>';
    s+='<text x="'+(cx+bw/2)+'" y="'+(y+bh/2)+'" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="13" font-weight="700" fill="#1e293b">'+bit+'</text>';
    s+='<text x="'+(cx+bw/2)+'" y="'+(y+bh+9)+'" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="7.5" fill="#94a3b8">z&#8315;'+(7-p)+'</text>';
  }
  s+='<circle cx="360" cy="34" r="8" fill="#fff7ed" stroke="'+MS_AMBER+'" stroke-width="1.4"/>';
  s+='<text x="360" y="34" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="11" fill="'+MS_AMBER+'">&#8853;</text>';
  s+='<path d="M'+(startX+0*step+bw/2)+' '+y+' L'+(startX+0*step+bw/2)+' 34 L352 34" fill="none" stroke="'+MS_AMBER+'" stroke-width="1.2" opacity=".7"/>';
  s+='<path d="M'+(startX+3*step+bw/2)+' '+y+' L'+(startX+3*step+bw/2)+' 34 L368 34" fill="none" stroke="'+MS_AMBER+'" stroke-width="1.2" opacity=".7"/>';
  s+='<path d="M'+(startX+6*step+bw)+' '+(y+bh/2)+' q40 0 40 40" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>';
  s+='<text x="'+(startX+6*step+bw+30)+'" y="'+(y+bh+4)+'" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="8" fill="#94a3b8">out &#8594;</text>';
  return s;
}

function _readout(){
  var vals=[];
  for(var n=0;n<8;n++){ var j=(n+43*_msNid2)%127; vals.push(1-2*MS_X[j]); }
  var txt = vals.map(function(v){return v>0?'+1':'-1';}).join('  ');
  return '<text x="360" y="386" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="11" fill="#475569">d_PSS(0..7) = '+txt+'  &#183;&#183;&#183;</text>';
}

function _legendSVG(){
  var y=410;
  var s='<rect x="14" y="'+(y-14)+'" width="692" height="42" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>';
  s+='<circle cx="40" cy="'+(y+7)+'" r="5" fill="#d97706" stroke="#b45309"/>';
  s+='<text x="52" y="'+(y+7)+'" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#475569">比特 1</text>';
  s+='<circle cx="120" cy="'+(y+7)+'" r="5" fill="#fff" stroke="#cbd5e1"/>';
  s+='<text x="132" y="'+(y+7)+'" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#475569">比特 0</text>';
  s+='<path d="M210 '+(y+2)+' L205 '+(y+11)+' L215 '+(y+11)+' Z" fill="#d97706"/>';
  s+='<text x="222" y="'+(y+7)+'" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#475569">读取指针 n=0（固定不动）</text>';
  s+='<line x1="412" y1="'+(y-6)+'" x2="412" y2="'+(y+20)+'" stroke="#cbd5e1"/>';
  var n=43*_msNid2;
  s+='<text id="msLegendNum" x="428" y="'+(y+7)+'" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="11" font-weight="700" fill="#d97706">'+n+'</text>';
  s+='<text x="450" y="'+(y+7)+'" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#475569">= 已转过的格数 43&#183;'+_msNid2+'</text>';
  return s;
}

function _pointerSVG(){
  var ty=MS_CY-MS_R, op=(_msPhase==='strip')?'0':'1';
  return '<g id="msPtr" opacity="'+op+'"><path d="M360 '+(ty-14)+' L353 '+(ty-2)+' L367 '+(ty-2)+' Z" fill="'+MS_AMBER+'"/>'+
         '<text x="360" y="'+(ty-20)+'" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="9" font-weight="700" fill="'+MS_AMBER+'">读取 n=0</text></g>';
}
function _stripSVG(){
  var op=(_msPhase==='strip')?'1':'0';
  return '<line id="msStripBase" x1="46" y1="'+(MS_CY+16)+'" x2="676" y2="'+(MS_CY+16)+'" stroke="#cbd5e1" stroke-width="1" opacity="'+op+'"/>'+
    '<text id="msStripLabel" x="46" y="'+(MS_CY-14)+'" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10" font-weight="700" fill="#b45309" opacity="'+op+'">N_ID&#178;='+_msNid2+' 发送序列（127 长，→ S2.2 BPSK/IFFT）</text>';
}
function _odoSVG(){
  var show = (_msPhase==='ring' && _msNid2>0);
  var num  = 43*_msNid2;
  return '<text id="msOdoCap" x="360" y="'+(MS_CY-22)+'" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="11" font-weight="700" fill="'+MS_AMBER+'" opacity="'+(show?'0.9':'0')+'">循环频域推移</text>'+
         '<text id="msOdo" x="360" y="'+(MS_CY+8)+'" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="46" font-weight="800" fill="'+MS_AMBER+'" opacity="'+(show?'0.85':'0')+'">'+num+'</text>'+
         '<text id="msOdoSub" x="360" y="'+(MS_CY+34)+'" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#94a3b8" opacity="'+(show?'0.8':'0')+'">m = (n + 43&#183;'+_msNid2+') mod 127</text>';
}

function renderMSeq(){
  var theta = (_msPhase==='strip') ? 0 : _theta(_msNid2);
  var beads='';
  for(var j=0;j<127;j++) beads+=_bead(j);
  var svg='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;flex:1;min-height:0;" xmlns="http://www.w3.org/2000/svg">'+
    '<style>.msb{transition:transform .85s cubic-bezier(.22,1,.36,1);} #msRing{transition:none;}</style>'+
    '<g id="msLfsr">'+_lfsrInner()+'</g>'+
    '<g id="msRing" transform="rotate('+theta.toFixed(3)+','+MS_CX+','+MS_CY+')">'+beads+'</g>'+
    _pointerSVG()+_odoSVG()+_stripSVG()+_readout()+_legendSVG()+'</svg>';
  var btn=function(k){ return '<button class="case-btn'+(_msNid2===k?' on':'')+'" onclick="msPick('+k+')">N_ID&#178;='+k+'</button>'; };
  var ctrl='<div class="ctrl-bar">'+btn(0)+btn(1)+btn(2)+
      '<span style="width:1px;height:18px;background:var(--border);"></span>'+
      '<button class="case-btn" onclick="msToggle()" id="msPlayBtn">'+(_msPlaying?'⏸ 暂停':'▶ 播放')+'</button>'+
      '<button class="case-btn" onclick="msStepBack()">⏮ 后退</button>'+
      '<button class="case-btn" onclick="msStep()">单步 ⏭</button>'+
      '<button class="case-btn" onclick="msStraighten()">✂ 剪断拉直</button>'+
      '<button class="case-btn" onclick="msReset()">↺ 复位</button></div>';
  return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:20px;">'+
    ctrl+svg+'</div>';
}

/* ─── S2.1 处理函数与动画 ──────────────────────────────── */
function _msVC(){ return document.getElementById('vizContainer'); }
function _msRerender(){ var vc=_msVC(); if(vc) vc.innerHTML=renderMSeq(); }
function _msRevealBead(c){
  var g=document.getElementById('msb'+c); if(!g) return;
  var bit=MS_X[c], ci=g.firstChild;
  ci.setAttribute('fill', bit?MS_ON:MS_OFF);
  ci.setAttribute('stroke', bit?'#b45309':'#cbd5e1');
}
function _msHideBead(c){
  var g=document.getElementById('msb'+c); if(!g) return;
  var ci=g.firstChild;
  ci.setAttribute('fill','#eef2f7');
  ci.setAttribute('stroke','#e2e8f0');
}
function _msRefreshLfsr(){ var g=document.getElementById('msLfsr'); if(g) g.innerHTML=_lfsrInner(); }

/* 自动播放：前慢后快，~2s 落完 127 颗 */
function _msPlayGen(){
  if(!_msPlaying || _msPhase!=='gen') return;
  if(_msClk>=127){ _msPhase='ring'; _msPlaying=false; _msRerender(); return; }
  var c=_msClk; _msRevealBead(c); _msClk=c+1; _msRefreshLfsr();
  var d=Math.max(8, Math.round(78*Math.exp(-c/15))+8);
  _msTid=setTimeout(_msPlayGen, d); Engine.addTimer(_msTid);
}
function msToggle(){
  if(_msPhase!=='gen'){ msReset(); return; }
  _msPlaying=!_msPlaying;
  var b=document.getElementById('msPlayBtn'); if(b) b.textContent=_msPlaying?'⏸ 暂停':'▶ 播放';
  if(_msPlaying) _msPlayGen(); else if(_msTid) clearTimeout(_msTid);
}
function msStep(){
  if(_msPhase!=='gen'){ return; }
  _msPlaying=false; if(_msTid) clearTimeout(_msTid);
  if(_msClk<127){ _msRevealBead(_msClk); _msClk++; _msRefreshLfsr(); }
  if(_msClk>=127){ _msPhase='ring'; _msRerender(); }
  else { var b=document.getElementById('msPlayBtn'); if(b) b.textContent='▶ 播放'; }
}
function msStepBack(){
  if(_msPhase==='strip'){ return; }                               // 拉直后不能后退，需复位
  if(_msPhase==='ring' && _msClk>=127){ _msPhase='gen'; _msClk=126; }  // 从环态退回生成态
  if(_msPhase!=='gen') return;
  _msPlaying=false; if(_msTid) clearTimeout(_msTid);
  if(_msClk>0){ _msClk--; _msHideBead(_msClk); _msRefreshLfsr(); }
  var b=document.getElementById('msPlayBtn'); if(b) b.textContent='▶ 播放';
}
/* 选择 N_ID²：从 0 步进到 43k，跑马灯同步计数 */
function msPick(k){
  if(_msShiftTid) clearInterval(_msShiftTid);
  _msNid2=k; _msPhase='ring'; _msClk=127; _msRerender();
  var ring=document.getElementById('msRing'), odo=document.getElementById('msOdo');
  if(k===0){ return; }
  ring.setAttribute('transform','rotate(0,'+MS_CX+','+MS_CY+')');
  if(odo) odo.textContent='0';
  var target=43*k, s=0;
  _msShiftTid=setInterval(function(){
    s++; var th=-(s)*360/127;
    ring.setAttribute('transform','rotate('+th.toFixed(3)+','+MS_CX+','+MS_CY+')');

function msStraighten(){
  if(_msPhase==='strip') return;
  if(_msPhase==='gen'){ _msClk=127; }
  var k=_msNid2, th=_theta(k)*Math.PI/180, c=Math.cos(th), s=Math.sin(th);

  for(var j=0;j<127;j++){

    var b=_beadXY(j), dx=b[0]-MS_CX, dy=b[1]-MS_CY;

    g.style.transition='none';
    g.setAttribute('transform','translate('+rx.toFixed(2)+','+ry.toFixed(2)+')');

  for(var j2=0;j2<127;j2++){

  var lbl=document.getElementById('msStripLabel'), base=document.getElementById('msStripBase');
  if(lbl){ lbl.setAttribute('opacity','1'); lbl.textContent='N_ID²='+k+' 发送序列（127 长，→ S2.2 BPSK/IFFT）'; }
  if(base) base.setAttribute('opacity','1');
}

var CS_COL=['#64748b','#d97706','#a8a29e'];   // N_ID2=0/1/2（冷灰/琥珀/暖石灰）

function _csXc(i){ return CS_RX0+(i/(CS_NC-1))*(CS_RX1-CS_RX0); }
function _csXr(i){ return CS_RX0+(i/(CS_NRX-1))*(CS_RX1-CS_RX0); }

function _csRxPath(){
  var rx=CS_DATA[_csSnr].rx, mx=0;
  for(var i=0;i<rx.length;i++) mx=Math.max(mx,Math.abs(rx[i]));
  var p='';
  for(var j=0;j<rx.length;j++){ var y=95 - rx[j]/mx*32; p+=(j===0?'M':'L')+_csXr(j).toFixed(1)+' '+y.toFixed(1); }
  return p;
}
function _csCorrPaths(upto){
  var D=CS_DATA[_csSnr], cmax=0, k, i;
  for(k=0;k<3;k++){ var c=D['c'+k]; for(i=0;i<c.length;i++) cmax=Math.max(cmax,Math.abs(c[i])); }
  var CYb=400, CY0=210;
  var cy=function(v){ return CYb - v/cmax*(CYb-CY0); };
  var out=[];
  for(k=0;k<3;k++){
    var arr=D['c'+k], p='', lim=Math.min(upto,arr.length);
    for(i=0;i<lim;i++) p+=(i===0?'M':'L')+_csXc(i).toFixed(1)+' '+cy(arr[i]).toFixed(1);
    out.push(p);
  }
  return {paths:out, cy:cy, cmax:cmax};
}

function renderCorrSearch(){
  var D=CS_DATA[_csSnr];
  var rxp=_csRxPath();
  var cc=_csCorrPaths(_csScan);
  var scanX=_csXc(Math.min(_csScan,CS_NC-1));
  var det=D.det, detlag=D.detlag;
  var lockSVG='';
  if(_csLocked){
    var px=_csXc(detlag), py=cc.cy(D['c'+det][detlag]);
    lockSVG='<line x1="'+px.toFixed(1)+'" y1="'+py.toFixed(1)+'" x2="'+px.toFixed(1)+'" y2="400" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>'+
      '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="5.5" fill="none" stroke="#dc2626" stroke-width="2"/>'+
      '<text x="'+px.toFixed(1)+'" y="'+(py-13).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10.5" font-weight="700" fill="#dc2626">N_ID²='+det+' 锁定 @lag'+detlag+'</text>';
  }
  var detCol=_csLocked?'#059669':CS_COL[1];  // 锁定后正确路切绿色（答案色）
  var lockBg=_csLocked?'#f0fdf4':'#f8fafc';
  var svg='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;flex:1;min-height:0;" xmlns="http://www.w3.org/2000/svg">'+
    '<rect x="14" y="14" width="692" height="467" rx="14" fill="'+lockBg+'" stroke="#d4dce8" stroke-width="1.5"/>'+
    '<text x="360" y="32" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="12" font-weight="700" fill="#b45309">时域盲相关检测：三路模板滑过含噪接收信号，谁先冒尖谁就是 N_ID²</text>'+
    '<text x="40" y="52" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10" font-weight="700" fill="#1e293b">① 接收信号 r[n]（PSS 埋在噪声里，肉眼看不出）</text>'+
    '<line x1="'+CS_RX0+'" y1="95" x2="'+CS_RX1+'" y2="95" stroke="#e2e8f0" stroke-width="1"/>'+
    '<path d="'+rxp+'" fill="none" stroke="#64748b" stroke-width="0.8" opacity="0.8"/>'+
    '<text x="40" y="148" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="10" font-weight="700" fill="#1e293b">② 三路相关器输出（滑动互相关，取最大峰判决）</text>'+
    '<rect x="'+CS_RX0+'" y="156" width="'+(CS_RX1-CS_RX0)+'" height="244" rx="5" fill="#f1f5f9" opacity="0.6"/>'+
    '<line x1="'+CS_RX0+'" y1="400" x2="'+CS_RX1+'" y2="400" stroke="#cbd5e1" stroke-width="1"/>'+
    '<path d="'+cc.paths[0]+'" fill="none" stroke="'+CS_COL[0]+'" stroke-width="1" opacity="0.55"/>'+
    '<path d="'+cc.paths[2]+'" fill="none" stroke="'+CS_COL[2]+'" stroke-width="1" opacity="0.55"/>'+
    '<path d="'+cc.paths[1]+'" fill="none" stroke="'+detCol+'" stroke-width="1.8"/>'+
    (_csScan<CS_NC?'<line x1="'+scanX.toFixed(1)+'" y1="150" x2="'+scanX.toFixed(1)+'" y2="400" stroke="#dc2626" stroke-width="1" opacity="0.5"/>':'')+
    lockSVG+
    '<text x="50" y="418" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="9" fill="'+detCol+'">— N_ID²=1（正确）</text>'+
    '<text x="240" y="418" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="9" fill="'+CS_COL[0]+'">— N_ID²=0</text>'+
    '<text x="380" y="418" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="9" fill="'+CS_COL[2]+'">— N_ID²=2</text>'+
    '<text x="680" y="418" text-anchor="end" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="9" fill="#475569">SNR='+D.snr+'dB</text>'+
    '</svg>';
  var sbtn=function(s,lbl){ return '<button class="case-btn'+(_csSnr===s?' on':'')+'" onclick="csSnr(\''+s+'\')">'+lbl+'</button>'; };
  var ctrl='<div class="ctrl-bar">'+sbtn('high','SNR 高')+sbtn('mid','SNR 中')+sbtn('low','SNR 低')+
    '<span style="width:1px;height:18px;background:var(--border);"></span>'+
    '<button class="case-btn" onclick="csScan()">▶ 开始扫描</button>'+
    '<button class="case-btn" onclick="csReset()">↺ 复位</button></div>';
  return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:20px;">'+
    ctrl+svg+'</div>';
}
/* ─── 事件 + 动画 hooks ─── */
function _csVC(){ return document.getElementById('vizContainer'); }
function _csRerender(){ var vc=_csVC(); if(vc) vc.innerHTML=renderCorrSearch(); }

function csSnr(s){
  if(_csTid){ clearInterval(_csTid); _csTid=null; }
  _csSnr=s; _csScan=0; _csLocked=false; _csRerender();
}
function csScan(){
  if(_csTid){ clearInterval(_csTid); _csTid=null; }
  _csScan=0; _csLocked=false; _csRerender();
  var det=CS_DATA[_csSnr].det, detlag=CS_DATA[_csSnr].detlag;
  _csTid=setInterval(function(){
    _csScan+=3;
    if(_csScan>=CS_NC){
      _csScan=CS_NC; _csLocked=true;
      clearInterval(_csTid); _csTid=null;
      _csRerender();
      Engine.ctxSet('nid2', det);                       // 判决写总线
      Engine.LogEngine.inject('[PHY] ✓ 找到符号边界！锁定 N_ID²='+det+' @lag'+detlag+'。');
      Engine.LogEngine.inject('[PHY] 写入 NR_CTX.nid2='+det+'，PCI = 3·N_ID¹ + '+det+'（N_ID¹ 待 SSS）。');
    } else {
      _csRerender();
    }
  },24);
  Engine.addTimer(_csTid);
}
function csReset(){
  if(_csTid){ clearInterval(_csTid); _csTid=null; }
  _csScan=0; _csLocked=false; _csRerender();
}


/* ─── 兜底 stub（不会触发，安全保留）───────────────────────── */
function _s2Stub(n){
  var t='施工中';
  return `<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">
    <rect x="14" y="14" width="692" height="467" rx="14" fill="#f8fafc" stroke="#d4dce8" stroke-width="1.5"/>
    <rect x="214" y="200" width="292" height="52" rx="10" fill="#d97706" opacity=".1" stroke="#d97706" stroke-width="1.5"/>
    <text x="360" y="226" text-anchor="middle" dominant-baseline="central" font-family="SF Mono,Consolas,monospace" font-size="13" font-weight="700" fill="#b45309">&#128295; S2.${n} · ${t} · 建设中</text>
  </svg>`;
}

/* ─── Viz Router ─────────────────────────────────────────── */
Engine.renderVizSVG = function(subIdx){
  if(subIdx===0) return renderS2Discuss();
  if(subIdx===1) return renderMSeq();
  if(subIdx===2) return renderFreq2Time();
  if(subIdx===3) return renderCorrSearch();
  return _s2Stub(subIdx);
};

Engine.onAfterRender = function(subIdx){
  if(subIdx===1){ msReset(); }
  if(subIdx===3){ csReset(); csScan(); }
};

Engine.onStageExit = function(){
  if(_msTid){ clearTimeout(_msTid); _msTid=null; }
  if(_msShiftTid){ clearInterval(_msShiftTid); _msShiftTid=null; }
  if(_csTid){ clearInterval(_csTid); _csTid=null; }
};

Engine.boot({ stageIdx: 2 });
</script>

/* ═══════════════════════════════════════════════════════════
   S4.1 · DMRS 信道估计 → 相干解调（甜甜圈 → 4 QPSK 簇）
   ═══════════════════════════════════════════════════════════ */
var _ceApplied=false, _cePhase=0, _ceTid=null, _ceInterp=false;
function renderChEst(){
  var s=_svgOpen('cebg','#eff6ff','#e0ecff');
  s=s.replace('<svg','<svg id="ceSvg"');
  s+=_t(360,34,'用 PCI 重建 DMRS → LS 信道估计 → 相干均衡',{a:'middle',s:12.5,w:700,f:C_MAIND});

  /* ── 左上：SSB 时频网格（4 符号 × 子载波，DMRS 梳状 v=1）── */
  var GX=44, GY=66, GW=296, symW=GW/4, GH=150, rows=12;   // 12 行示意子载波
  s+='<rect x="'+GX+'" y="'+GY+'" width="'+GW+'" height="'+GH+'" rx="5" fill="#fff" stroke="#c8d6e8" stroke-width="1"/>';
  var symLbl=['Sym0','Sym1','Sym2','Sym3'], symKind=['PSS','PBCH','SSS+PBCH','PBCH'];
  for(var c=0;c<4;c++){
    s+=_t(GX+(c+0.5)*symW,GY-9,symLbl[c],{a:'middle',s:9,f:C_SEC});
    if(c>0) s+='<line x1="'+(GX+c*symW)+'" y1="'+GY+'" x2="'+(GX+c*symW)+'" y2="'+(GY+GH)+'" stroke="#e2e8f0" stroke-width="0.8"/>';
  }
  /* 插值渐变：从琥珀导频向蓝数据 RE 过渡 */
  s+='<defs><linearGradient id="ceItp" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0" stop-color="'+C_DMRS+'"/><stop offset="1" stop-color="'+C_MAIN+'"/></linearGradient></defs>';
  var rh=GH/rows;
  for(var c=0;c<4;c++){ for(var r=0;r<rows;r++){
    var cx=GX+c*symW, cy=GY+r*rh, fill='#f8fafc', stroke='#eef2f7', op=0.9;
    var mid=(r>=4&&r<8);
    var isD=((r%4)===V_DMRS);
    if(c===0){ fill=mid?'#cbd5e1':'#f1f5f9'; }                 // PSS 中段
    else if(c===2){ // SSS+PBCH：中段 SSS，上下 PBCH/DMRS
      if(mid){ fill='#c7d2fe'; }
      else { fill=isD?C_DMRS:(_ceInterp?'url(#ceItp)':C_MAIN); if(_ceInterp&&!isD) op=0.55; }
    } else { // Sym1/Sym3：全 PBCH，DMRS 梳状
      fill=isD?C_DMRS:(_ceInterp?'url(#ceItp)':C_MAIN); if(_ceInterp&&!isD) op=0.55;
    }
    s+='<rect x="'+(cx+0.8)+'" y="'+(cy+0.6)+'" width="'+(symW-1.6)+'" height="'+(rh-1.2)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="0.4" opacity="'+op+'"/>';
  }}
  s+=_t(GX+0.5*symW,GY+GH*0.5,'PSS',{a:'middle',s:8.5,w:700,f:'#475569'});
  s+=_t(GX+2.5*symW,GY+GH*0.5,'SSS',{a:'middle',s:8,w:700,f:C_MAIND});
  /* 插值箭头提示（导频 → 相邻数据）*/
  if(_ceInterp){
    var arX=GX+1.5*symW;
    s+='<defs><marker id="itpA" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+C_DMRS+'"/></marker></defs>';
  }
  /* 网格图例 */
  var lgY=GY+GH+18;
  s+='<rect x="'+GX+'" y="'+lgY+'" width="14" height="11" fill="'+C_DMRS+'"/>';
  s+=_t(GX+20,lgY+5.5,'DMRS 导频 144',{s:9,w:700,f:'#b45309'});
  s+='<rect x="'+(GX+118)+'" y="'+lgY+'" width="14" height="11" fill="'+(_ceInterp?'url(#ceItp)':C_MAIN)+'"/>';
  s+=_t(GX+138,lgY+5.5,_ceInterp?'数据 RE（插值得 Ĥ）':'数据 RE 432',{s:9,w:700,f:C_MAIN});
  if(!_ceInterp){
    s+=_t(GX+2,lgY+24,'DMRS 落在 k mod 4 = v = 1（PCI 的频域指纹）',{s:9,st:1,f:C_SEC});
    s+=_t(GX+2,lgY+40,'LS 只估出 144 导频点 → 数据 RE 还没有 Ĥ',{s:9,w:700,f:C_HI});
  } else {
    s+=_t(GX+2,lgY+24,'频域线性插值：Ĥ 从梳齿铺满整排',{s:9,w:700,f:C_ANS});
    s+=_t(GX+2,lgY+40,'权重 0.75/0.25 → 0.5/0.5 → 0.25/0.75（ΔN=4）',{s:9,st:1,f:C_SEC});
  }

  /* ── 右：IQ 星座（接收甜甜圈 ↔ 均衡 4 簇）── */
  var cx0=540, cy0=170, R=98;

    s+='<rect x="'+(P_X0+230)+'" y="'+(P_Y+P_BARH+12)+'" width="13" height="11" fill="'+C_MAIN+'"/>';
    s+=_t(P_X0+249,P_Y+P_BARH+17.5,'信息位 56（放最可靠子信道）',{s:9,w:700,f:C_MAIN});
    s+=_t(P_X0+P_W,P_Y+P_BARH+17.5,'β-展开排序',{a:'end',s:8.5,st:1,f:C_MUT});
  }

  /* ── 速率解匹配小标 ── */
  s+='<rect x="'+P_X0+'" y="194" width="620" height="26" rx="6" fill="#fff" stroke="#bfdbfe" stroke-width="1"/>';
  s+=_t(360,207,'进译码器前：速率解匹配  864 LLR → 512 母码（E>N 发端重复，收端把重复位 LLR 相加得增益）',{a:'middle',s:9.5,w:700,f:C_MAIND});

  /* ── SCL 路径树 ── */
  if(_pPhase>=2){
    s+=_t(360,242,'SCL 列表译码：每个信息位同时留 0/1 假设，裁到 L=8 条最优路径',{a:'middle',s:10.5,w:700,f:C_MAIND});
    var locked=(_pPhase>=3);
    var survSet={}; TREE.survivor.forEach(function(si,L){ survSet[L+'-'+si]=true; });
    /* 连线 */
    for(var L2=0;L2<TREE.levels.length-1;L2++){
      var n0=TREE.levels[L2], n1=TREE.levels[L2+1];
      for(var a=0;a<n0;a++){ for(var b=0;b<n1;b++){
        /* 简化：每个父节点向两个子节点分叉（b 在 [2a,2a+1] 内）或全连(裁剪后) */
        var connect = (n1>=n0)?(Math.floor(b/Math.max(1,n1/n0))===a):(a%Math.max(1,n0/n1)===0 && Math.floor(a/Math.max(1,n0/n1))===b);
        if(n1>n0) connect=(Math.floor(b/2)===a);
        else connect=(a===b);
        if(!connect) continue;
        var p0=_pNode(L2,a), p1=_pNode(L2+1,b);
        if(!p0||!p1) continue;
        var onSurv=locked && survSet[L2+'-'+a] && survSet[(L2+1)+'-'+b];
        s+='<line x1="'+p0.x+'" y1="'+p0.y+'" x2="'+p1.x+'" y2="'+p1.y+'" stroke="'+(onSurv?C_ANS:(locked?'#e2e8f0':C_GREY))+'" stroke-width="'+(onSurv?2.4:1)+'" opacity="'+(onSurv?1:(locked?0.4:0.55))+'"/>';
      }}
    }
    /* 节点 */
    TREE.nodes.forEach(function(nd){
      var onSurv=locked && survSet[nd.L+'-'+nd.i];
      var col=onSurv?C_ANS:(locked?'#cbd5e1':C_MAIN);
      s+='<circle cx="'+nd.x+'" cy="'+nd.y+'" r="'+(onSurv?5.5:4)+'" fill="'+col+'" opacity="'+(onSurv?1:(locked?0.5:0.8))+'"/>';
    });
    /* PM 劣汰标签：锁定时，被剪枝（非幸存）的末两层节点旁闪红字 */
    if(locked){
      var pruneTag=[[3,3],[3,6],[4,0],[4,7]];   // 选几个被剪的代表节点
      pruneTag.forEach(function(pt,k){
        var nd=_pNode(pt[0],pt[1]);
        if(nd){
          s+='<g opacity="0"><animate attributeName="opacity" values="0;1;1;0.7" dur="0.9s" begin="'+(0.15*k)+'s" fill="freeze"/>';
          s+='<rect x="'+(nd.x+8)+'" y="'+(nd.y-8)+'" width="46" height="15" rx="4" fill="#fef2f2" stroke="'+C_HI+'" stroke-width="0.8"/>';
          s+=_t(nd.x+31,nd.y-0.5,'PM 劣汰',{a:'middle',s:8,w:800,f:C_HI});
          s+='</g>';
        }
      });
    }
    s+=_t(TREE.lx0,400,'起点',{a:'middle',s:9,f:C_SEC});
    s+=_t(TREE.lx0+TREE.lw,400,'L=8 幸存',{a:'middle',s:9,f:C_SEC});

    /* CRC 裁判框 */
    var crcX=600, crcY=276, crcW=92, crcH=86;
    s+='<rect x="'+crcX+'" y="'+crcY+'" width="'+crcW+'" height="'+crcH+'" rx="9" fill="'+(locked?C_ANSL:'#fff')+'" stroke="'+(locked?C_ANS:C_MUT)+'" stroke-width="'+(locked?2.5:1.4)+'"/>';
    s+=_t(crcX+crcW/2,crcY+18,'CRC24',{a:'middle',s:11,w:800,f:locked?C_ANS:C_MAIND});
    s+=_t(crcX+crcW/2,crcY+36,'裁判',{a:'middle',s:9,f:C_SEC});
    if(locked){
      s+=_t(crcX+crcW/2,crcY+56,'✓ 通过',{a:'middle',s:12,w:800,f:C_ANS});
      s+=_t(crcX+crcW/2,crcY+72,'唯一正确路',{a:'middle',s:8.5,f:'#047857'});
      /* 红高光环（锁定那一刻，全屏唯一红）*/
      var win=_pNode(4,TREE.survivor[4]);
      if(win) s+='<circle cx="'+win.x+'" cy="'+win.y+'" r="11" fill="none" stroke="'+C_HI+'" stroke-width="2"/>';
    } else {
      s+=_t(crcX+crcW/2,crcY+58,'8 选 1',{a:'middle',s:9.5,w:700,f:C_SEC});
    }
    /* 幸存路 → CRC 连线 */
    var wnode=_pNode(4,TREE.survivor[4]);
    if(wnode){
      s+='<line x1="'+(wnode.x+6)+'" y1="'+wnode.y+'" x2="'+crcX+'" y2="'+(crcY+crcH/2)+'" stroke="'+(locked?C_ANS:C_MUT)+'" stroke-width="'+(locked?2:1)+'" stroke-dasharray="'+(locked?'0':'3 2')+'" opacity="0.8"/>';
    }
  }

  /* ── 底：结果带 ── */
  if(_pPhase>=3){
    s+='<rect x="150" y="414" width="420" height="48" rx="10" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="2"/>';
    s+=_t(360,430,'CRC 通过 → 56 bit 译出',{a:'middle',s:12,w:800,f:C_ANS});
    s+=_t(360,449,'拆为 32 bit 载荷 + 24 bit CRC → 交给 S4.3 解析',{a:'middle',s:10,w:700,f:C_MAIND});
  } else if(_pPhase>=1){
    s+=_t(360,438,'每条路径维护累积路径度量(PM)：候选超 L=8 即剪掉 PM 最差路；CRC 在 8 条幸存里选唯一通过路',{a:'middle',s:9.5,st:1,f:C_SEC});
  }
  s+='</svg>';

  var ctrl='<div class="ctrl-bar">'+
    '<button class="case-btn on" onclick="pRun()">▶ 译码</button>'+
    '<button class="case-btn" onclick="pReset()">↺ 复位</button>'+
    '<span style="width:1px;height:18px;background:var(--border);"></span>'+
    '<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-mut);">K=56 · N=512 · E=864 · L=8</span>'+
    '</div>';
  return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:14px;">'+ctrl+s+'</div>';
}
var _pScan=0;
function _pVC(){ return document.getElementById('vizContainer'); }
function _pRe(){ var v=_pVC(); if(v) v.innerHTML=renderPolar(); }
function _pStop(){ if(_pTid){ clearInterval(_pTid); _pTid=null; } }
function pReset(){ _pStop(); _pPhase=0; _pScan=0; _pRe(); }
function pRun(){
  _pStop(); _pPhase=1; _pScan=0; _pRe();
  var _pWait=0;   // phase 2 等待计数器，给用户时间观察 SCL 全树
  _pTid=setInterval(function(){
    if(_pPhase===1){
      _pScan+=11;
      if(_pScan>=128){ _pPhase=2; _pRe(); _pWait=0;
        Engine.LogEngine.inject('[PHY] 极化完成：456 冻结位 / 56 信息位，SCL 列表译码展开 L=8 路径。'); }
      else _pRe();
    } else if(_pPhase===2){
      _pWait++;
      if(_pWait>=18){   // 停留 ~3s（18×170ms），让用户看清全树结构
        _pPhase=3; _pStop(); _pRe();
        Engine.LogEngine.inject('[PHY] ✓ CRC24 辅助选路成功：8 条幸存路径中唯一通过校验，56 bit 译出。');
      }
    }
  },170);
  Engine.addTimer(_pTid);
}

/* ═══════════════════════════════════════════════════════════
   S4.3 · MIB 解析 + SFN 拼接
   ═══════════════════════════════════════════════════════════ */
var _mibLocked=false, _mibPhase=0, _mibTid=null;
/* 32-bit 字段（逻辑顺序，解交织后）：[名, 位数, 比特串, 颜色组] grp: m=MIB蓝, t=时间位琥珀 */
var MIB_FIELDS=[
  ['choice',1,'0','m'],
  ['SFN[9:4]',6, (SFN_MSB6).toString(2).padStart(6,'0'),'sfnH'],
  ['SCS',1,'1','m'],
  ['k_SSB[3:0]',4,(KSSB&0xF).toString(2).padStart(4,'0'),'m'],
  ['dmrsTypeA',1,'0','m'],
  ['pdcch-CfgSIB1',8,'00010000','m'],
  ['barred',1,'1','m'],
  ['intraFreq',1,'0','m'],
  ['spare',1,'0','m'],
  ['SFN[3:0]',4,(SFN_LSB4).toString(2).padStart(4,'0'),'sfnL'],
  ['HRF',1,'0','t'],
  ['k_SSB[4]',1,((KSSB>>4)&1).toString(),'t'],
  ['rsv',2,'00','t']
];
function _grpColor(g){ return g==='sfnH'?C_MAIN:(g==='sfnL'?C_DMRS:(g==='t'?C_DMRS:C_MAIN)); }
function renderMIB(){
  var s=_svgOpen('mbg','#eff6ff','#e0ecff');
  s+=_t(360,32,'CRC 通过 → 拆 32 bit → 解析 MIB + 拼接 SFN',{a:'middle',s:12.5,w:700,f:C_MAIND});

  /* ── 上：32-bit 比特带（按字段分段染色）── */
  var BX=40, BW=640, BY=58, BH=40, totBits=32, bw=BW/totBits;
  s+=_t(BX,BY-12,'32-bit PBCH 载荷',{s:9.5,w:700,f:C_MAIND});
  s+=_t(BX+BW,BY-12,'24 bit BCH/MIB ┊ 8 bit 时间位',{a:'end',s:9,f:C_SEC});
  var pos=0;
  MIB_FIELDS.forEach(function(f){
    var g=f[3], col=_grpColor(g), isT=(g==='t'||g==='sfnL');
    var fx=BX+pos*bw, fwid=f[1]*bw;
    s+='<rect x="'+fx.toFixed(1)+'" y="'+BY+'" width="'+(fwid-0.8).toFixed(1)+'" height="'+BH+'" rx="2" fill="'+col+'" opacity="'+(isT?0.85:0.16)+'" stroke="'+col+'" stroke-width="1"/>';
    /* 比特 */
    for(var b=0;b<f[1];b++){
      s+=_t(fx+(b+0.5)*bw,BY+BH/2,f[2][b],{a:'middle',s:9,w:700,f:isT?'#fff':C_MAIND});
    }
    /* 字段名（小，旋转省略：直接放下方）*/
    var nm=f[0];
    if(f[1]>=2) s+=_t(fx+fwid/2,BY+BH+9,nm,{a:'middle',s:7.5,f:isT?'#b45309':C_SEC});
    pos+=f[1];
  });
  /* 24/8 分隔 */
  var splitX=BX+24*bw;
  s+='<line x1="'+splitX+'" y1="'+(BY-4)+'" x2="'+splitX+'" y2="'+(BY+BH+14)+'" stroke="'+C_HI+'" stroke-width="1.5" stroke-dasharray="3 2"/>';

  /* ── 中：SFN 拼接（高6位 + 低4位 → 10-bit 寄存器）── */
  var asmY=170;
  s+=_t(360,asmY-26,'★ SFN 拼接：高 6 位(藏 MIB) + 低 4 位(藏时间位) → 完整 10 bit',{a:'middle',s:11,w:800,f:C_MAIND});
  /* 高6位块 */
  var hX=120, hW=150, blkH=40;
  s+='<rect x="'+hX+'" y="'+asmY+'" width="'+hW+'" height="'+blkH+'" rx="7" fill="'+C_MAIN+'" opacity="0.16" stroke="'+C_MAIN+'" stroke-width="2"/>';
  s+=_t(hX+hW/2,asmY+14,'SFN[9:4] = '+SFN_MSB6.toString(2).padStart(6,'0'),{a:'middle',s:11,w:800,f:C_MAIND});
  s+=_t(hX+hW/2,asmY+30,'高 6 位 · 来自 MIB ('+SFN_MSB6+')',{a:'middle',s:8.5,f:C_SEC});
  /* + */
  s+=_t(hX+hW+24,asmY+blkH/2,'+',{a:'middle',s:22,w:800,f:C_SEC});
  /* 低4位块（琥珀）*/
  var lX=hX+hW+48, lW=118;
  s+='<rect x="'+lX+'" y="'+asmY+'" width="'+lW+'" height="'+blkH+'" rx="7" fill="'+C_DMRSL+'" stroke="'+C_DMRS+'" stroke-width="2"/>';
  s+=_t(lX+lW/2,asmY+14,'SFN[3:0] = '+SFN_LSB4.toString(2).padStart(4,'0'),{a:'middle',s:11,w:800,f:'#b45309'});
  s+=_t(lX+lW/2,asmY+30,'低 4 位 · 时间位 ('+SFN_LSB4+')',{a:'middle',s:8.5,f:'#92600c'});
  /* = */
  s+=_t(lX+lW+22,asmY+blkH/2,'=',{a:'middle',s:22,w:800,f:C_SEC});
  /* 10-bit 寄存器（锁定后高光）*/
  var rX=lX+lW+44, rW=190;
  var regFill=_mibLocked?C_ANSL:'#fff', regStroke=_mibLocked?C_ANS:'#bfdbfe';
  s+='<rect x="'+rX+'" y="'+(asmY-4)+'" width="'+rW+'" height="'+(blkH+8)+'" rx="8" fill="'+regFill+'" stroke="'+regStroke+'" stroke-width="'+(_mibLocked?2.5:1.5)+'"/>';
  var full=SFN.toString(2).padStart(10,'0');
  for(var bi=0;bi<10;bi++){
    var cellX=rX+10+bi*((rW-20)/10);
    var isHigh=bi<6;
    s+=_t(cellX+((rW-20)/10)/2,asmY+10,full[bi],{a:'middle',s:11,w:800,f:isHigh?C_MAIND:'#b45309'});
  }
  s+=_t(rX+rW/2,asmY+30,'SFN = '+(_mibLocked?(SFN+'（十进制）'):'?'),{a:'middle',s:10.5,w:800,f:_mibLocked?C_ANS:C_SEC});
  if(_mibLocked){
    s+='<rect x="'+rX+'" y="'+(asmY-4)+'" width="'+rW+'" height="'+(blkH+8)+'" rx="8" fill="none" stroke="'+C_HI+'" stroke-width="1.5" opacity="0.0"><animate attributeName="opacity" values="1;0" dur="0.7s" begin="0s"/></rect>';
  }
  s+=_t(360,asmY+58,'(38 &lt;&lt; 4) | 6 = 608 + 6 = '+(_mibLocked?'614 ✓':'…'),{a:'middle',s:10,w:700,f:_mibLocked?C_ANS:C_MUT});

  /* ── 底：MIB 字段解析卡 ── */
  var pY=258;
  s+=_t(360,pY-6,'MIB 字段解析（绿 = 已写入 NR_CTX）',{a:'middle',s:10.5,w:700,f:C_MAIND});
  var rows=[
    ['systemFrameNumber','SFN = 614', true],
    ['half frame','前半帧 (HRF=0)', true],
    ['subCarrierSpacingCommon','30 kHz', false],
    ['ssb-SubcarrierOffset','k_SSB = 6', true],
    ['dmrs-TypeA-Position','pos2', false],
    ['pdcch-ConfigSIB1','0x10 → Stage 5', false],
    ['cellBarred','notBarred（允许）', false],
    ['intraFreqReselection','allowed', false]
  ];
  var colW=312, rowH=26, c0x=44, c1x=364, ry=pY+8;
  for(var ri=0;ri<rows.length;ri++){
    var rr=rows[ri], colIdx=ri%2, rowIdx=Math.floor(ri/2);
    var rxp=(colIdx===0)?c0x:c1x, ryp=ry+rowIdx*(rowH+5);
    var hl=rr[2]&&_mibLocked;
    s+='<rect x="'+rxp+'" y="'+ryp+'" width="'+colW+'" height="'+rowH+'" rx="6" fill="'+(hl?C_ANSL:'#fff')+'" stroke="'+(hl?C_ANS:'#dbe4f0')+'" stroke-width="'+(hl?1.6:1)+'"/>';
    s+=_t(rxp+12,ryp+rowH/2,rr[0],{s:9.5,f:C_SEC});
    s+=_t(rxp+colW-12,ryp+rowH/2,rr[1],{a:'end',s:10,w:700,f:hl?C_ANS:C_MAIND});
  }
  /* ── 协议彩蛋：FR1/FR2 比特复用 ── */
  var gtY=ry+4*(rowH+5)+6;   // 解析卡下方
  s+='<rect x="44" y="'+gtY+'" width="632" height="56" rx="9" fill="#fffbeb" stroke="'+C_DMRS+'" stroke-width="1.4"/>';
  s+='<rect x="44" y="'+gtY+'" width="92" height="56" rx="9" fill="'+C_DMRS+'" opacity="0.14"/>';
  s+=_t(90,gtY+22,'⚡ 协议',{a:'middle',s:10,w:800,f:'#b45309'});
  s+=_t(90,gtY+38,'彩蛋',{a:'middle',s:10,w:800,f:'#b45309'});
  s+=_t(148,gtY+18,'同样这 8 个时间位里的 k_SSB[4]+2 保留位，FR1 / FR2 用途不同：',{s:9.5,w:800,f:C_SCRD});
  s+=_t(148,gtY+34,'• FR1（Lmax=4/8，波束≤8）：DMRS 3 位已够标识 SSB index → 此处承载 k_SSB 第 5 位',{s:9,f:C_SEC});
  s+=_t(148,gtY+49,'• FR2（Lmax=64，波束达64）：k_SSB 仅需 4 位 → 此处改征用，拼 SSB index 高 3 位！',{s:9,w:700,f:'#b45309'});
  s+='</svg>';

  var ctrl='<div class="ctrl-bar">'+
    '<button class="case-btn on" onclick="mibRun()">▶ 演示 SFN 拼接 + 写入</button>'+
    '<button class="case-btn" onclick="mibReset()">↺ 复位</button>'+
    '</div>';
  return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px;">'+ctrl+s+'</div>';
}
function _mibVC(){ return document.getElementById('vizContainer'); }
function _mibRe(){ var v=_mibVC(); if(v) v.innerHTML=renderMIB(); }
function mibReset(){ if(_mibTid){clearTimeout(_mibTid);_mibTid=null;} _mibLocked=false; _mibRe(); }
function mibRun(){
  if(_mibTid){clearTimeout(_mibTid);_mibTid=null;}
  _mibLocked=false; _mibRe();
  Engine.LogEngine.inject('[DATA] 拆分 32 bit：24 bit MIB + 8 bit 时间位，开始解析…');
  _mibTid=setTimeout(function(){
    _mibLocked=true;
    /* 先写非顶栏字段，最后 ctxSet(kssb) 触发单次重绘+顶栏同步 */
    if(window.NR_CTX){
      window.NR_CTX.sfn_offset=SFN; window.NR_CTX.hrf=HRF; window.NR_CTX.ssb_index=SSB_IDX;
      window.NR_CTX.mib={ sfn:SFN, scsCommon:30, kssb:KSSB, dmrsTypeA:'pos2',
                          pdcchConfigSib1:16, cellBarred:'notBarred', intraFreq:'allowed' };
    }
    Engine.LogEngine.inject('[DATA] SFN 拼接：高6位('+SFN_MSB6+') ⊕ 低4位('+SFN_LSB4+') → SFN = '+SFN+'。');
    Engine.LogEngine.inject('[DATA] 解析 MIB：SCS=30kHz, k_SSB='+KSSB+', cellBarred=notBarred(允许驻留)。');
    Engine.ctxSet('kssb', KSSB);
    Engine.LogEngine.inject('[SUCCESS] MIB 解码完成，SFN/半帧/k_SSB/配置写入 NR_CTX → 通往 Stage 5。');
    _mibRe();
  },1100);
  Engine.addTimer(_mibTid);
}

/* ─── Viz Router ─────────────────────────────────────────── */
Engine.renderVizSVG = function(subIdx){
  if(subIdx===0) return renderS4Discuss();
  if(subIdx===1) return renderChEstFull();
  if(subIdx===2) return renderDescramble();
  if(subIdx===3) return renderPolar();
  if(subIdx===4) return renderMIB();
  return renderS4Discuss();
};
Engine.onAfterRender = function(subIdx){
  if(subIdx===1){ _ceApplied=false; _ceInterp=false; _ceRot(); }
  if(subIdx===2){ dsReset(); dsRun(); }
  if(subIdx===3){ pReset(); pRun(); }
  if(subIdx===4){ mibReset(); mibRun(); }
};
Engine.onStageExit = function(){
  if(_ceTid){ clearInterval(_ceTid); _ceTid=null; }
  if(_dsTid){ clearInterval(_dsTid); _dsTid=null; }
  if(_pTid){ clearInterval(_pTid); _pTid=null; }
  if(_mibTid){ clearTimeout(_mibTid); _mibTid=null; }
};

Engine.boot({ stageIdx: 4 });
</script>

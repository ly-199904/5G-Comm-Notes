<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   Stage 6 · SIB1 解析 · 5 sub-steps (0..4)
   配色：天蓝 #0284c7(主) / 深蓝 #075985 / 浅蓝 #e0f2fe
        答案绿 #059669 / 钥匙琥珀 #d97706 / 高光红 #dc2626 / 对照灰 #94a3b8
        码字对照：Polar 紫 #7c3aed / LDPC 蓝绿 #0d9488
   ═══════════════════════════════════════════════════════════ */
var C_MAIN='#0284c7', C_MAIND='#075985', C_MAINL='#e0f2fe',
    C_KEY='#d97706',  C_KEYL='#fff7ed',
    C_ANS='#059669',  C_ANSL='#d1fae5',
    C_HI='#dc2626',   C_GREY='#94a3b8',
    C_SEC='#475569',  C_MUT='#94a3b8',
    C_POLAR='#7c3aed',C_LDPC='#0d9488', C_SSB='#0891b2';

/* ── 文本助手（与 Stage 5 一致）── */
function _t(x,y,t,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" '+(o.a?'text-anchor="'+o.a+'" ':'')+
    'dominant-baseline="central" font-family="SF Mono,Consolas,monospace" '+
    'font-size="'+(o.s||10)+'" '+(o.w?'font-weight="'+o.w+'" ':'')+
    'fill="'+(o.f||'#1e293b')+'"'+(o.st?' font-style="italic"':'')+
    (o.id?' id="'+o.id+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'>'+t+'</text>';
}
function _bg(id){ return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient></defs>'; }
function _frame(id){ return '<rect x="14" y="14" width="692" height="467" rx="14" fill="url(#'+id+')" stroke="#bae6fd" stroke-width="1.5"/>'; }
function _wrap(s,pt){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:'+(pt||6)+'px;">'+s+'</div>'; }
function _wrapC(ctrl,s){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:10px;">'+ctrl+s+'</div>'; }
function _vc6(){ return document.getElementById('vizContainer'); }

/* ── 上游 NR_CTX（带兜底，便于独立打开本页）── */
function _ctx(k,d){ return (window.NR_CTX&&window.NR_CTX[k]!=null)?window.NR_CTX[k]:d; }
var CFG_PCI = _ctx('pci',337);
var CFG_KSSB= _ctx('kssb',6);
var CFG_BWP = _ctx('initial_bwp_rb',24);

/* 预计算常量（已 Python 验证）*/
var TBS_BITS=2472, TBS_BYTES=309;
var SSB_FC=3550.08, SSB_SC0=3546.48, OFF_PA=84, F_POINTA=3531.27;

/* ═══════════════════════════════════════════════════════════
   S6.0 · 理论黑板（SIB1 三重身份 + 驻网终点）
   ═══════════════════════════════════════════════════════════ */
function renderS6Discuss(){
  var s='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">';
  s+=_bg('s6bg');
  s+='<defs><marker id="s6ar" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+C_KEY+'"/></marker></defs>';
  s+=_frame('s6bg');
  s+='<rect x="14" y="14" width="692" height="44" rx="14" fill="'+C_MAIN+'" opacity="0.10"/>';
  s+=_t(360,36,'SIB1：小区的「说明书」——读完它，UE 完成驻网（camping）',{a:'middle',s:13,w:700,f:C_MAIND});

  /* 三张职责卡 */
  var cards=[
    {x:38,  c:C_ANS,  cl:C_ANSL, t:'① 驻留判决依据', l1:'q-RxLevMin / PLMN 列表', l2:'cellBarred 标志', l3:'→ S6.4 三关校验'},
    {x:262, c:C_KEY,  cl:C_KEYL, t:'② 闭合 Point A', l1:'offsetToPointA（粗）', l2:'+ k_SSB（细，Stage4）', l3:'→ 全局 CRB 坐标'},
    {x:486, c:C_LDPC, cl:'#ccfbf1', t:'③ RACH 配置', l1:'prach-Cfg / 根序列', l2:'ZCZ / RAR 窗 …', l3:'→ Stage 7 弹药'}
  ];
  for(var i=0;i<3;i++){ var c=cards[i];
    s+='<rect x="'+c.x+'" y="74" width="196" height="120" rx="10" fill="#fff" stroke="'+c.c+'" stroke-width="2"/>';
    s+='<rect x="'+c.x+'" y="74" width="196" height="30" rx="10" fill="'+c.cl+'"/>';
    s+=_t(c.x+98,90,c.t,{a:'middle',s:11.5,w:800,f:c.c});
    s+=_t(c.x+98,124,c.l1,{a:'middle',s:9.5,f:C_SEC});
    s+=_t(c.x+98,144,c.l2,{a:'middle',s:9.5,f:C_SEC});
    s+='<rect x="'+(c.x+14)+'" y="160" width="168" height="24" rx="6" fill="'+c.cl+'"/>';
    s+=_t(c.x+98,172,c.l3,{a:'middle',s:9.5,w:700,f:c.c});
  }

  /* 闭环回指条：Stage 1 / 5 欠账 → SIB1 还账 */
  s+='<rect x="38" y="208" width="644" height="62" rx="10" fill="#fff" stroke="'+C_KEY+'" stroke-width="1.5"/>';
  s+=_t(360,226,'贯穿全程的「鸡生蛋」此刻闭合',{a:'middle',s:11,w:800,f:'#b45309'});
  s+='<rect x="54" y="238" width="250" height="24" rx="6" fill="'+C_KEYL+'"/>';
  s+=_t(179,250,'Stage 1 / Stage 5：「等读完 SIB1 再算」',{a:'middle',s:9,f:'#92400e'});
  s+='<line x1="312" y1="250" x2="408" y2="250" stroke="'+C_KEY+'" stroke-width="2" marker-end="url(#s6ar)"/>';
  s+=_t(360,240,'offsetToPointA',{a:'middle',s:8,st:1,f:'#b45309'});
  s+='<rect x="416" y="238" width="250" height="24" rx="6" fill="'+C_ANSL+'"/>';
  s+=_t(541,250,'本 SIB1 给出 → Point A 闭环 ✓',{a:'middle',s:9,w:700,f:C_ANS});

  /* 终点旗 + 诚实条（camped ≠ connected） */
  s+='<rect x="38" y="284" width="644" height="186" rx="10" fill="#fff" stroke="#bae6fd" stroke-width="1.2"/>';
  s+=_t(360,304,'🚩 终点线：SIB1 读完 = 严格意义的「驻网」完成',{a:'middle',s:12,w:800,f:C_MAIND});
  /* 状态对照两卡 */
  s+='<rect x="56" y="322" width="296" height="92" rx="9" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="1.5"/>';
  s+=_t(204,340,'已驻网 (camped · 仍 RRC_IDLE)',{a:'middle',s:10.5,w:800,f:C_ANS});
  s+=_t(204,362,'✓ 可监听寻呼 / 收系统信息',{a:'middle',s:9.5,f:'#047857'});
  s+=_t(204,380,'✓ 可发起随机接入',{a:'middle',s:9.5,f:'#047857'});
  s+=_t(204,400,'本项目「同步 + 解析」主线终点',{a:'middle',s:9.5,w:700,st:1,f:C_ANS});
  s+='<rect x="368" y="322" width="296" height="92" rx="9" fill="#f8fafc" stroke="'+C_GREY+'" stroke-width="1.2"/>';
  s+=_t(516,340,'已连接 (CONNECTED) —— 还没到',{a:'middle',s:10.5,w:800,f:C_SEC});
  s+=_t(516,362,'✗ 无 C-RNTI / 无专属承载',{a:'middle',s:9.5,f:C_MUT});
  s+=_t(516,380,'需 Stage 7 (PRACH) + Stage 8 (RRC)',{a:'middle',s:9.5,f:C_MUT});
  s+=_t(516,400,'PDU 会话(NAS) 更在其后',{a:'middle',s:9.5,st:1,f:C_MUT});
  /* 底注：MIB→SIB1 */
  s+='<rect x="56" y="424" width="608" height="34" rx="8" fill="'+C_MAINL+'"/>';
  s+=_t(360,435,'MIB(23 bit) 只引导「去哪找 SIB1」；SIB1 才是正式说明书（PDSCH + LDPC + ASN.1 树）',{a:'middle',s:9.5,w:700,f:C_MAIND});
  s+=_t(360,450,'编码对照：PBCH/PDCCH = Polar；数据信道 PDSCH = LDPC + CRC16',{a:'middle',s:9,f:C_SEC});

  s+='</svg>';
  return _wrap(s,6);
}

/* ═══════════════════════════════════════════════════════════
   S6.1 · PDSCH 解调 & LDPC 译码（按提货单取传输块）
   ═══════════════════════════════════════════════════════════ */
var PD_STAGES=[
  {nm:'PDSCH RE',     sub:'RB0~23 × 符号2~13', col:C_MAIN},
  {nm:'DMRS 信道估计', sub:'橙点锚 → 均衡',      col:C_KEY},
  {nm:'QPSK 解调',     sub:'→ LLR 软比特',       col:C_MAIN},
  {nm:'LDPC 译码',     sub:'Base Graph 2 迭代',  col:C_LDPC},
  {nm:'CRC16 校验',    sub:'通过 → 无误码',      col:C_ANS},
  {nm:'传输块 TB',     sub:'2472 bit (309 B)',   col:C_ANS}
];
var _pdPhase=0, _pdTid=null;
function renderPdsch(){
  var ph=_pdPhase;
  var s='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">';
  s+=_bg('pdbg');
  s+='<defs><marker id="pdar" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+C_SEC+'"/></marker></defs>';
  s+=_frame('pdbg');
  s+=_t(360,32,'PDSCH 解调 &amp; LDPC 译码：按 DCI 提货单取出 SIB1 传输块',{a:'middle',s:12.5,w:700,f:C_MAIND});
  s+=_t(360,50,'链路同 PBCH，唯末端换零件：码 = LDPC（≠Polar），校验 = CRC16（≠CRC24）',{a:'middle',s:9.5,f:C_SEC});

  /* 左上：时频源块（RB0~23 × 符号2~13）*/
  var GX=46, GY=78, GW=260, GH=150;
  var nSym=14, nRB=8;            // 网格示意：横 14 符号，纵 8 行代表 24RB（压缩）
  var cw=GW/nSym, rh=GH/nRB;
  s+=_t(GX+GW/2,GY-8,'初始 BWP 时频网格（DCI 指来）',{a:'middle',s:9.5,w:700,f:C_MAIND});
  for(var r=0;r<=nRB;r++){ var y=GY+r*rh; s+='<line x1="'+GX+'" y1="'+y+'" x2="'+(GX+GW)+'" y2="'+y+'" stroke="#e2e8f0" stroke-width="0.5"/>'; }
  for(var cc=0;cc<=nSym;cc++){ var x=GX+cc*cw; s+='<line x1="'+x+'" y1="'+GY+'" x2="'+x+'" y2="'+(GY+GH)+'" stroke="#e2e8f0" stroke-width="0.5"/>'; }
  /* SIB1 PDSCH 占位：符号 2~13（全行），点亮（ph>=0 始终框出）*/
  var psX=GX+2*cw, psW=12*cw;
  s+='<rect x="'+psX+'" y="'+GY+'" width="'+psW+'" height="'+GH+'" rx="2" fill="'+C_MAIN+'" opacity="0.16" stroke="'+C_MAIN+'" stroke-width="2"/>';
  s+=_t(psX+psW/2,GY+GH/2-8,'SIB1 PDSCH',{a:'middle',s:11,w:800,f:C_MAIND});
  s+=_t(psX+psW/2,GY+GH/2+8,'24 RB × 12 sym',{a:'middle',s:8.5,f:C_MAIND});
  /* DMRS 锚点：第 3 个符号一整列橙点（ph>=1 高亮）*/
  var dmX=GX+2*cw+cw*0.5;
  for(var dr=0;dr<nRB;dr++){
    s+='<circle cx="'+dmX+'" cy="'+(GY+dr*rh+rh/2)+'" r="2.6" fill="'+C_KEY+'" opacity="'+(ph>=1?1:0.35)+'"/>';
  }
  s+=_t(dmX,GY+GH+12,'DMRS',{a:'middle',s:8,f:ph>=1?C_KEY:C_MUT});
  s+=_t(GX-6,GY+GH-2,'RB0',{a:'end',s:8,f:C_MUT});
  s+=_t(GX-6,GY+6,'RB23',{a:'end',s:8,f:C_MUT});

  /* 右上：码字对照三卡 */
  var KX=336, KY=78, KW=344;
  s+=_t(KX+KW/2,KY-8,'信道编码选择：同工具箱，不同零件',{a:'middle',s:9.5,w:700,f:C_MAIND});
  var codecs=[
    {nm:'PBCH',  code:'Polar', crc:'CRC24C', col:C_POLAR, why:'块极小·要极低误码'},
    {nm:'PDCCH', code:'Polar', crc:'CRC24C', col:C_POLAR, why:'控制信令·短块'},
    {nm:'PDSCH', code:'LDPC',  crc:'CRC16',  col:C_LDPC,  why:'大块·高吞吐·HARQ'}
  ];
  for(var ci=0;ci<3;ci++){ var cd=codecs[ci]; var cy=KY+ci*46;
    var hot=(cd.nm==='PDSCH');
    s+='<rect x="'+KX+'" y="'+cy+'" width="'+KW+'" height="40" rx="8" fill="'+(hot?'#ccfbf1':'#fff')+'" stroke="'+cd.col+'" stroke-width="'+(hot?2:1.2)+'"/>';
    s+='<rect x="'+(KX+10)+'" y="'+(cy+8)+'" width="64" height="24" rx="5" fill="'+cd.col+'" opacity="'+(hot?1:0.55)+'"/>';
    s+=_t(KX+42,cy+20,cd.nm,{a:'middle',s:10.5,w:800,f:'#fff'});
    s+=_t(KX+86,cy+14,cd.code+' · '+cd.crc,{s:10,w:700,f:cd.col});
    s+=_t(KX+86,cy+30,cd.why,{s:8.5,f:C_SEC});
  }
  s+=_t(KX+KW/2,KY+3*46+8,'数据信道挑 LDPC：长码逼近容量 · 可并行 · 天然 HARQ-IR',{a:'middle',s:8.5,st:1,f:C_LDPC});

  /* 底部：解码流水线（6 节点横向，按 ph 点亮）*/
  var FX=40, FY=270, FW=640, n=PD_STAGES.length, bw=92, gap=(FW-n*bw)/(n-1);
  s+=_t(FX,FY-10,'解码流水线（点 ▶ 逐级推进）：',{s:10,w:700,f:C_SEC});
  for(var k=0;k<n;k++){ var st=PD_STAGES[k];
    var bx=FX+k*(bw+gap);
    var lit=(ph>=k);
    s+='<rect x="'+bx+'" y="'+FY+'" width="'+bw+'" height="56" rx="8" fill="'+(lit?'#fff':'#f8fafc')+'" stroke="'+(lit?st.col:'#e2e8f0')+'" stroke-width="'+(lit?2:1)+'"/>';
    s+='<rect x="'+bx+'" y="'+FY+'" width="'+bw+'" height="3" rx="1.5" fill="'+st.col+'" opacity="'+(lit?1:0.3)+'"/>';
    s+=_t(bx+bw/2,FY+20,st.nm,{a:'middle',s:9.5,w:800,f:lit?st.col:C_MUT});
    s+=_t(bx+bw/2,FY+38,st.sub,{a:'middle',s:7.5,f:lit?C_SEC:C_MUT});
    if(k<n-1){ var ax=bx+bw+gap/2; s+='<line x1="'+(bx+bw+2)+'" y1="'+(FY+28)+'" x2="'+(bx+bw+gap-2)+'" y2="'+(FY+28)+'" stroke="'+(ph>k?C_SEC:'#cbd5e1')+'" stroke-width="1.5" marker-end="url(#pdar)"/>'; }
  }

  /* 比特数变化条 */
  s+='<rect x="40" y="346" width="640" height="46" rx="9" fill="'+C_MAINL+'" stroke="#bae6fd" stroke-width="1"/>';
  s+=_t(360,361,'比特账：3312 RE × 2(QPSK) = 6624 软比特 → LDPC(R≈0.37) 译码 → 2472 bit 传输块',{a:'middle',s:9.5,w:700,f:C_MAIND});
  s+=_t(360,379,'gNB 故意铺满 24 RB 求频率分集 → TB 偏大；MAC 用 Padding 字节填满，喂足 LDPC',{a:'middle',s:8.5,st:1,f:C_SEC});

  /* 选图诚实条 */
  s+='<rect x="40" y="398" width="640" height="40" rx="9" fill="#ccfbf1" stroke="'+C_LDPC+'" stroke-width="1"/>';
  s+=_t(360,412,'BG 选择：A≤292 或 R≤0.25 或 (A≤3824 且 R≤0.67) → BG2，否则 BG1',{a:'middle',s:9.5,w:700,f:'#0f766e'});
  s+=_t(360,427,'本例 A=2472, R=0.37 → Base Graph 2（小块/中低码率分支）',{a:'middle',s:9,f:C_SEC});

  /* 完成态 */
  if(ph>=n-1){
    s+='<rect x="40" y="444" width="640" height="30" rx="8" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="1.5"/>';
    s+=_t(360,459,'✓ CRC16 通过 → 干净的 SIB1 字节流（UPER 编码）→ 交给 S6.2 解析器',{a:'middle',s:10,w:800,f:C_ANS});
  } else {
    s+=_t(360,459,'流水线推进中…',{a:'middle',s:10,st:1,f:C_MUT});
  }

  s+='</svg>';
  var ctrl='<div class="ctrl-bar">'+
    '<button class="case-btn'+(ph>0?' on':'')+'" onclick="pdRun()">▶ 解码</button>'+
    '<button class="case-btn" onclick="pdReset()">↺ 复位</button>'+
    '<span style="font-size:11px;color:var(--text-mut);font-family:var(--font-mono);">'+Math.min(ph,PD_STAGES.length-1)+'/'+(PD_STAGES.length-1)+' 级</span></div>';
  return _wrapC(ctrl,s);
}
function _pdRe(){ var v=_vc6(); if(v) v.innerHTML=renderPdsch(); }
function pdRun(){
  if(_pdTid){ clearTimeout(_pdTid); _pdTid=null; }
  _pdPhase=0; _pdRe();
  var logs=['[PHY] 框定 SIB1 PDSCH：RB0~23 × 符号2~13。','[DSP] DMRS 信道估计 + 均衡完成。',
            '[DSP] QPSK 软解调 → 6624 个 LLR。','[DSP] LDPC（BG2）分层迭代译码收敛。',
            '[OK] CRC16 校验通过，无误码。','[DATA] 传输块 2472 bit 解出 → SIB1 字节流就绪。'];
  function step(){
    if(_pdPhase>=PD_STAGES.length-1){ return; }
    _pdPhase++; _pdRe();
    if(logs[_pdPhase]) Engine.LogEngine.inject(logs[_pdPhase]);
    _pdTid=setTimeout(step,820); Engine.addTimer(_pdTid);
  }
  Engine.LogEngine.inject(logs[0]);
  step();
}
function pdReset(){ if(_pdTid){ clearTimeout(_pdTid); _pdTid=null; } _pdPhase=0; _pdRe(); }

/* ═══════════════════════════════════════════════════════════
   S6.2 · ASN.1 / UPER 解码（比特流 → 结构树）
   ═══════════════════════════════════════════════════════════ */
var ASN_NODES=[
  {nm:'cellSelectionInfo',     bits:'7b',  col:C_ANS,  dn:'→ S6.4 S 准则'},
  {nm:'cellAccessRelatedInfo', bits:'52b', col:C_ANS,  dn:'PLMN/TAC/barred'},
  {nm:'si-SchedulingInfo',     bits:'30b', col:C_SEC,  dn:'其他 SIB 调度'},
  {nm:'servingCellConfigCommon',bits:'…',  col:C_KEY,  dn:'★ 含两宝藏'},
  {nm:'ue-TimersAndConstants', bits:'12b', col:C_SEC,  dn:'→ Stage 8'}
];
var _asnStep=0, _asnTid=null;   // 0 idle; 1 位图; 2..6 五节点; 7 展开宝藏
function renderAsn1(){
  var st=_asnStep;
  var s='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">';
  s+=_bg('anbg');
  s+='<defs><marker id="anar" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+C_MAIN+'"/></marker></defs>';
  s+=_frame('anbg');
  s+=_t(360,30,'ASN.1 / UPER 解码：把没有分隔的比特流还原成结构树',{a:'middle',s:12.5,w:700,f:C_MAIND});
  s+=_t(360,48,'UPER 无字段名 · 无标签 · 不字节对齐——全靠收发共享同一份 ASN.1 语法字典',{a:'middle',s:9.5,f:C_SEC});

  /* 顶部比特流：[0]=扩展位(红) | gap | [1..6]=OPTIONAL 位图(橙) | 数据区 */

  s+=_bg('cpbg');
  s+=_frame('cpbg');
  s+=_t(360,30,'小区驻留判决：三关全过 → 驻网成功（但仍是 RRC_IDLE）',{a:'middle',s:12.5,w:700,f:C_MAIND});
  s+=_t(360,48,'PLMN 匹配 → cellBarred → S 准则，逐关亮灯，全绿才放行',{a:'middle',s:9.5,f:C_SEC});

  /* 三道闸门 */
  var gates=[
    {t:'关① PLMN 匹配', l1:'USIM = 46001', l2:'∈ 小区 PLMN 列表', ok:'✓ 是我的网'},
    {t:'关② cellBarred', l1:'cellBarred =', l2:'notBarred', ok:'✓ 允许驻留'},
    {t:'关③ S 准则',     l1:'Srxlev = +35 dB', l2:'> 0', ok:'✓ 信号够强'}
  ];
  var GW=200, GX0=40, gp=20, GY=70, GH=132;
  for(var i=0;i<3;i++){ var ga=gates[i];
    var gx=GX0+i*(GW+gp);
    var passed=(g>i)||(_cpDone&&g>=3);
    var isCur=(g===i)&&!passed;
    var col=passed?C_ANS:(isCur?C_MAIN:C_GREY);
    var fill=passed?C_ANSL:(isCur?C_MAINL:'#f8fafc');
    s+='<rect x="'+gx+'" y="'+GY+'" width="'+GW+'" height="'+GH+'" rx="11" fill="'+fill+'" stroke="'+col+'" stroke-width="'+(passed||isCur?2.2:1)+'"/>';
    s+='<rect x="'+gx+'" y="'+GY+'" width="'+GW+'" height="30" rx="11" fill="'+col+'" opacity="0.16"/>';
    s+=_t(gx+GW/2,GY+15,ga.t,{a:'middle',s:11,w:800,f:col});
    s+=_t(gx+GW/2,GY+58,ga.l1,{a:'middle',s:10,w:700,f:passed?'#047857':C_SEC});
    s+=_t(gx+GW/2,GY+78,ga.l2,{a:'middle',s:10,w:700,f:passed?'#047857':C_SEC});
    /* 灯 */
    s+='<circle cx="'+(gx+GW/2)+'" cy="'+(GY+108)+'" r="11" fill="'+(passed?C_ANS:'#e2e8f0')+'" stroke="'+(passed?C_ANS:C_GREY)+'" stroke-width="1.5"/>';
    if(passed) s+=_t(gx+GW/2,GY+108,'✓',{a:'middle',s:13,w:800,f:'#fff'});
    if(passed) s+=_t(gx+GW/2,GY+GH+13,ga.ok,{a:'middle',s:9,w:700,f:C_ANS});
    /* 闸门间箭头 */
    if(i<2){ s+='<text x="'+(gx+GW+gp/2)+'" y="'+(GY+GH/2)+'" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="800" fill="'+(g>i?C_ANS:'#cbd5e1')+'">›</text>'; }
  }

  /* S 准则天平（关③ 详解，仅当 g>=3 或正在判第三关时显示）*/
  var scY=242;
  s+='<rect x="40" y="'+scY+'" width="640" height="76" rx="10" fill="#fff" stroke="'+C_MAIN+'" stroke-width="1.2"/>';
  s+=_t(360,scY+14,'关③ 展开 · S 准则：你的信号比「死亡线」高出多少？',{a:'middle',s:10,w:800,f:C_MAIND});
  /* 数轴：-120 .. -60 dBm */
  var nbX=120, nbW=440, nbY=scY+44, lo=-120, hi=-60;
  function _px(v){ return nbX+(v-lo)/(hi-lo)*nbW; }
  s+='<line x1="'+nbX+'" y1="'+nbY+'" x2="'+(nbX+nbW)+'" y2="'+nbY+'" stroke="'+C_GREY+'" stroke-width="1.5"/>';
  s+=_t(nbX+nbW+8,nbY,'强→',{s:8,w:700,f:C_GREY});
  var xMin=_px(-110), xMeas=_px(-75);
  /* 死亡线（q-RxLevMin）*/
  s+='<line x1="'+xMin+'" y1="'+(nbY-7)+'" x2="'+xMin+'" y2="'+(nbY+7)+'" stroke="'+C_HI+'" stroke-width="2.5"/>';
  s+=_t(xMin,nbY-16,'死亡线 q-RxLevMin',{a:'middle',s:8,w:700,f:C_HI});
  s+=_t(xMin,nbY+17,'−110 dBm',{a:'middle',s:8,w:700,f:C_HI});
  var sLit=(g>=3);
  /* 你的信号（实测 RSRP）*/
  s+='<circle cx="'+xMeas+'" cy="'+nbY+'" r="5.5" fill="'+(sLit?C_ANS:'#cbd5e1')+'"/>';
  s+=_t(xMeas,nbY-16,'你的信号 RSRP',{a:'middle',s:8,w:700,f:sLit?C_ANS:C_MUT});
  s+=_t(xMeas,nbY+17,'−75 dBm',{a:'middle',s:8,w:700,f:sLit?C_ANS:C_MUT});
  if(sLit){
    s+='<defs><marker id="cpms" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+C_ANS+'"/></marker></defs>';
    /* 醒目绿色双向箭头：死亡线 → 你的信号 */
    s+='<line x1="'+(xMin+2)+'" y1="'+nbY+'" x2="'+(xMeas-2)+'" y2="'+nbY+'" stroke="'+C_ANS+'" stroke-width="4" marker-start="url(#cpms)" marker-end="url(#cpms)" opacity="0.85"/>';
    /* 安全缓冲垫绿底标签，骑在箭头上方 */
    var bufX=(xMin+xMeas)/2;
    s+='<rect x="'+(bufX-66)+'" y="'+(nbY-9)+'" width="132" height="18" rx="9" fill="'+C_ANS+'"/>';
    s+=_t(bufX,nbY,'🛡 安全缓冲垫 +35 dB',{a:'middle',s:9,w:800,f:'#fff'});
    /* 负数减法直觉（卡片右下）*/
    s+=_t(564,nbY,'= −75 −(−110)',{a:'start',s:8.5,w:700,f:C_ANS});
  } else {
    s+=_t(360,nbY+30,'Srxlev = Q_rxlevmeas − (q-RxLevMin + offset) − P_comp',{a:'middle',s:9,w:700,f:C_SEC});
  }

  /* 终点旗 / 进行中 */
  if(_cpDone){
    s+='<rect x="40" y="328" width="640" height="78" rx="12" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="2.2"/>';
    s+=_t(360,352,'🚩 驻网（camping）完成 —— 本项目「同步 + 解析」主线终点',{a:'middle',s:14,w:800,f:C_ANS});
    s+=_t(360,378,'三关全过：PLMN ✓ · cellBarred ✓ · Srxlev +35dB ✓ → 驻留在合适小区',{a:'middle',s:10,w:700,f:'#047857'});
    s+=_t(360,395,'已写入 NR_CTX：Point A · rach_config · 初始 BWP；rrc_state 仍 = IDLE',{a:'middle',s:9,f:'#047857'});
  } else {
    s+='<rect x="40" y="328" width="640" height="78" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>';
    s+=_t(360,367,'三关逐一校验中…全部通过即驻网成功',{a:'middle',s:12,st:1,f:C_MUT});
  }

  /* 诚实条：camped ≠ connected */
  s+='<rect x="40" y="414" width="640" height="56" rx="10" fill="#fff" stroke="'+C_GREY+'" stroke-width="1.2"/>';
  s+=_t(360,430,'诚实点：驻网成功 = 拿到「能上网的资格」，不是「已上网」',{a:'middle',s:10,w:800,f:C_MAIND});
  s+=_t(360,449,'无 C-RNTI / 无专属承载 → 需 Stage 7（PRACH 拿临时身份+TA）+ Stage 8（RRC 建立+安全）',{a:'middle',s:9,f:C_SEC});
  s+=_t(360,463,'NAS 层 PDU 会话更在其后（已越过 L1/L2 接入边界，属后续独立项目）',{a:'middle',s:8.5,st:1,f:C_MUT});

  s+='</svg>';
  var ctrl='<div class="ctrl-bar">'+
    '<button class="case-btn'+(g>0?' on':'')+'" onclick="cpRun()">▶ 判决</button>'+
    '<button class="case-btn" onclick="cpReset()">↺ 复位</button>'+
    '<span style="font-size:11px;color:var(--text-mut);font-family:var(--font-mono);">'+(_cpDone?'✓ 驻网成功':Math.min(g,3)+'/3 关')+'</span></div>';
  return _wrapC(ctrl,s);
}
function _cpRe(){ var v=_vc6(); if(v) v.innerHTML=renderCamp(); }
function cpRun(){
  if(_cpTid){ clearTimeout(_cpTid); _cpTid=null; }
  _cpGate=0; _cpDone=false; _cpWritten=false; _cpRe();
  var logs=['[RRC] 关① PLMN：USIM=46001 ∈ 小区 PLMN 列表 → 匹配。',
            '[RRC] 关② cellBarred = notBarred → 允许驻留。',
            '[RRC] 关③ S 准则：Srxlev = −75 −(−110) = +35 dB > 0 → 小区合适。'];
  function step(){
    if(_cpGate>=3){ _cpDone=true; _cpRe(); _cpWriteCtx(); return; }
    Engine.LogEngine.inject(logs[_cpGate]);
    _cpGate++; _cpRe();
    _cpTid=setTimeout(step,1000); Engine.addTimer(_cpTid);
  }
  step();
}
function _cpWriteCtx(){
  if(_cpWritten) return; _cpWritten=true;
  if(window.NR_CTX){ window.NR_CTX.camped=true; }
  Engine.ctxSet('rrc_state','IDLE');   /* 驻网但未连接：状态仍 IDLE（camped 子态）*/
  Engine.LogEngine.inject('[SUCCESS] 🚩 驻网（camping）完成。RRC 保持 IDLE，待 Stage 7 发起接入。');
}
function cpReset(){ if(_cpTid){ clearTimeout(_cpTid); _cpTid=null; } _cpGate=0; _cpDone=false; _cpWritten=false; _cpRe(); }

/* ─── Viz Router ─────────────────────────────────────────── */
Engine.renderVizSVG = function(subIdx){
  if(subIdx===0) return renderS6Discuss();
  if(subIdx===1) return renderPdsch();
  if(subIdx===2) return renderAsn1();
  if(subIdx===3) return renderKeyIE();
  if(subIdx===4) return renderCamp();
  return renderS6Discuss();
};
Engine.onAfterRender = function(subIdx){
  if(subIdx===1){ pdReset(); pdRun(); }
  if(subIdx===2){ asnReset(); asnRun(); }
  if(subIdx===3){ kiReset(); kiRun(); }
  if(subIdx===4){ cpReset(); cpRun(); }
};
Engine.onStageExit = function(){
  if(_pdTid){ clearTimeout(_pdTid); _pdTid=null; }
  if(_asnTid){ clearTimeout(_asnTid); _asnTid=null; }
  if(_kiTid){ clearTimeout(_kiTid); _kiTid=null; }
  if(_cpTid){ clearTimeout(_cpTid); _cpTid=null; }
};

Engine.boot({ stageIdx: 6 });
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Stage 7 · PRACH 随机接入</title>
<link rel="stylesheet" href="design-system.css">
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'], ['\\(','\\)']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
.case-btn { padding:4px 10px;border-radius:5px;font-size:11px;font-family:var(--font-mono);
            font-weight:700;cursor:pointer;border:1.5px solid var(--border);
            background:var(--surface);color:var(--text-sec);transition:all .15s; }
.case-btn.on { background:#dc2626;border-color:#dc2626;color:white; }
.ctrl-bar { display:flex;align-items:center;gap:12px;background:var(--surface);
            border:1px solid var(--border);border-radius:8px;padding:7px 14px;flex-wrap:wrap; }
</style>
</head>
<body>
<div id="app"></div>
<script src="stage-data.js"></script>
<script src="engine.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   Stage 7 · PRACH 随机接入 · 5 sub-steps (0..4)
   配色：红 #dc2626(主·上行) / 深红 #991b1b(锁定高光) / 浅红 #fee2e2
        下行青 #0891b2(Msg2 RAR 方向) / 钥匙琥珀 #d97706(RA-RNTI/TA)
        答案绿 #059669 / 对照灰 #94a3b8
   ═══════════════════════════════════════════════════════════ */
var C_MAIN='#dc2626', C_MAIND='#991b1b', C_MAINL='#fee2e2',
    C_DL='#0891b2',   C_DLL='#cffafe',
    C_KEY='#d97706',  C_KEYL='#fff7ed',
    C_ANS='#059669',  C_ANSL='#d1fae5',
    C_GREY='#94a3b8', C_SEC='#475569', C_MUT='#94a3b8';

/* ── 文本助手（与 Stage 5/6 一致）── */
function _t(x,y,t,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" '+(o.a?'text-anchor="'+o.a+'" ':'')+
    'dominant-baseline="central" font-family="SF Mono,Consolas,monospace" '+
    'font-size="'+(o.s||10)+'" '+(o.w?'font-weight="'+o.w+'" ':'')+
    'fill="'+(o.f||'#1e293b')+'"'+(o.st?' font-style="italic"':'')+
    (o.id?' id="'+o.id+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'>'+t+'</text>';
}
function _mk(id,c){ return '<marker id="'+id+'" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+c+'"/></marker>'; }
function _bg(id){ return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="#fff5f5"/><stop offset="1" stop-color="#fee2e2"/></linearGradient>'+
  '<pattern id="hatch7" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
  '<rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="'+C_GREY+'" stroke-width="2"/></pattern></defs>'; }
function _frame(id){ return '<rect x="14" y="14" width="692" height="467" rx="14" fill="url(#'+id+')" stroke="#fecaca" stroke-width="1.5"/>'; }
function _wrap(s,pt){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:'+(pt||6)+'px;">'+s+'</div>'; }
function _wrapC(ctrl,s){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:10px;">'+ctrl+s+'</div>'; }
function _vc7(){ return document.getElementById('vizContainer'); }

/* ── 上游 NR_CTX（带兜底，便于独立打开本页）── */
function _ctx(k,d){ return (window.NR_CTX&&window.NR_CTX[k]!=null)?window.NR_CTX[k]:d; }
var RC = _ctx('rach_config',{}) || {};
var CFG_ROOT = (RC.rootSequenceIndex!=null)?RC.rootSequenceIndex:1;
var CFG_ZCZ  = (RC.zeroCorrelationZoneConfig!=null)?RC.zeroCorrelationZoneConfig:8;
var CFG_CFGIDX = (RC.prachConfigIndex!=null)?RC.prachConfigIndex:16;

/* 预计算常量（已 Python 验证）*/
var L_RA=839, N_CS=46, PER_ROOT=18, ROOTS=4, N_PREAMBLE=64;
var PICK=27;                       // UE 随机选中的 preamble
var RA_RNTI=57;                    // = 1 + s_id(0) + 14*t_id(4)
var T_A=50, N_TA=25600, TA_NS=13021, TA_US='13.02';  // μ=1: N_TA=T_A*512
var TC_RNTI='0x4601';
var CP_US=103, SEQ_US=800, GT_US=97, CELL_KM='14.5';

/* ═══════════════════════════════════════════════════════════
   S7.0 · 理论黑板（随机接入要解决什么 + 4 步 CBRA）
   ═══════════════════════════════════════════════════════════ */
function renderS7Discuss(){
  var s='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">';
  s+=_bg('s7bg');
  s+='<defs>'+_mk('arR',C_MAIN)+_mk('arC',C_DL)+_mk('arG',C_GREY)+'</defs>';
  s+=_frame('s7bg');
  s+='<rect x="14" y="14" width="692" height="42" rx="14" fill="'+C_MAIN+'" opacity="0.10"/>';
  s+=_t(360,35,'PRACH 随机接入：UE 第一次「开口」——拿上行定时 TA + 临时身份',{a:'middle',s:13,w:700,f:C_MAIND});

  /* 两张「非解决不可」卡 */
  var cards=[
    {x:40, c:C_MAIN, t:'① gNB 不知道你存在', l1:'下行是广播，人人能听；', l2:'但 gNB 没给你分配过上行资源', f:'→ 发上行「举手」→ 换临时身份'},
    {x:372,c:C_KEY,  t:'② 上行不同步',       l1:'远近 UE 时延不同，各按各的', l2:'下行定时发 → 到 gNB 错位打架', f:'→ gNB 下发 TA，你提前发对齐'}
  ];
  for(var i=0;i<2;i++){ var c=cards[i];
    s+='<rect x="'+c.x+'" y="64" width="308" height="94" rx="10" fill="#fff" stroke="'+c.c+'" stroke-width="1.8"/>';
    s+='<rect x="'+c.x+'" y="64" width="308" height="28" rx="10" fill="'+c.c+'" opacity="0.14"/>';
    s+=_t(c.x+154,78,c.t,{a:'middle',s:11.5,w:800,f:c.c});
    s+=_t(c.x+154,108,c.l1,{a:'middle',s:9.5,f:C_SEC});
    s+=_t(c.x+154,124,c.l2,{a:'middle',s:9.5,f:C_SEC});
    s+='<rect x="'+(c.x+12)+'" y="138" width="284" height="22" rx="6" fill="'+(i===0?C_ANSL:C_KEYL)+'"/>';
    s+=_t(c.x+154,149,c.f,{a:'middle',s:9.5,w:700,f:(i===0?C_ANS:'#b45309')});
  }

  /* CBRA 阶梯 */
  s+=_t(360,176,'4 步竞争式接入（CBRA）· 一来一回的对话',{a:'middle',s:11,w:800,f:C_MAIND});
  /* 分组底 */
  s+='<rect x="40" y="198" width="640" height="72" rx="10" fill="'+C_MAINL+'" opacity="0.5"/>';
  s+='<rect x="40" y="276" width="640" height="70" rx="10" fill="#f1f5f9"/>';
  s+='<rect x="48" y="202" width="86" height="18" rx="5" fill="'+C_MAIN+'"/>';
  s+=_t(91,211,'Stage 7（本）',{a:'middle',s:8.5,w:800,f:'#fff'});
  s+='<rect x="48" y="280" width="64" height="18" rx="5" fill="'+C_GREY+'"/>';
  s+=_t(80,289,'Stage 8',{a:'middle',s:8.5,w:800,f:'#fff'});
  /* 生命线 */
  var UEx=150, GNx=570;
  s+='<line x1="'+UEx+'" y1="198" x2="'+UEx+'" y2="346" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 3"/>';
  s+='<line x1="'+GNx+'" y1="198" x2="'+GNx+'" y2="346" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 3"/>';
  s+='<rect x="'+(UEx-26)+'" y="186" width="52" height="20" rx="6" fill="'+C_MAIN+'"/>'; s+=_t(UEx,196,'UE',{a:'middle',s:10,w:800,f:'#fff'});
  s+='<rect x="'+(GNx-30)+'" y="186" width="60" height="20" rx="6" fill="'+C_DL+'"/>'; s+=_t(GNx,196,'gNB',{a:'middle',s:10,w:800,f:'#fff'});
  /* 四条消息 */
  function msgArrow(y,fromUE,col,mk,dashed){
    var x1=fromUE?(UEx+8):(GNx-8), x2=fromUE?(GNx-8):(UEx+8);
    return '<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+col+'" stroke-width="'+(dashed?1.8:2.4)+'"'+(dashed?' stroke-dasharray="6 4"':'')+' marker-end="url(#'+mk+')"/>';
  }
  s+=_t(360,215,'Msg1 · Preamble（64 选 1 · 随机）',{a:'middle',s:9.5,w:700,f:C_MAIN});
  s+=msgArrow(226,true,C_MAIN,'arR',false);
  s+=_t(360,247,'Msg2 · RAR：TA 命令 + TC-RNTI + UL Grant',{a:'middle',s:9.5,w:700,f:C_DL});
  s+=msgArrow(258,false,C_DL,'arC',false);
  s+=_t(360,289,'Msg3 · RRCSetupRequest（PUSCH）',{a:'middle',s:9,w:700,f:C_GREY});
  s+=msgArrow(300,true,C_GREY,'arG',true);
  s+=_t(360,321,'Msg4 · 竞争解决 + RRCSetup',{a:'middle',s:9,w:700,f:C_GREY});
  s+=msgArrow(332,false,C_GREY,'arG',true);

  /* 底部：鸡生蛋 + 方向色例 */
  s+='<rect x="40" y="356" width="404" height="118" rx="10" fill="#fff" stroke="'+C_MAIN+'" stroke-width="1.5"/>';
  s+='<rect x="40" y="356" width="404" height="26" rx="10" fill="'+C_MAINL+'"/>';
  s+=_t(242,369,'🥚 鸡生蛋：为什么会「竞争」',{a:'middle',s:10.5,w:800,f:C_MAIND});
  s+=_t(58,397,'• UE 接入前没有唯一身份 → 从 64 个 preamble 随机抓 1 个当签名',{s:9,f:C_SEC});
  s+=_t(58,417,'• 两个 UE 抓到同一个 → 收到同一个 RAR → Msg3 撞车',{s:9,f:C_SEC});
  s+=_t(58,437,'• 竞争解决（Stage 8 · Msg4）裁决临时身份到底归谁',{s:9,f:C_SEC});
  s+='<rect x="58" y="450" width="368" height="18" rx="5" fill="'+C_ANSL+'"/>';
  s+=_t(242,459,'这就是「竞争式 Contention-Based」名字的由来',{a:'middle',s:9,w:700,st:1,f:C_ANS});

  s+='<rect x="456" y="356" width="224" height="118" rx="10" fill="#fff" stroke="#fecaca" stroke-width="1.2"/>';
  s+=_t(568,370,'方向色例 &amp; 接入类型',{a:'middle',s:10,w:800,f:C_MAIND});
  s+='<line x1="472" y1="392" x2="512" y2="392" stroke="'+C_MAIN+'" stroke-width="3" marker-end="url(#arR)"/>';
  s+=_t(520,392,'上行：UE → gNB（发）',{s:9,w:700,f:C_MAIN});
  s+='<line x1="472" y1="412" x2="512" y2="412" stroke="'+C_DL+'" stroke-width="3" marker-end="url(#arC)"/>';
  s+=_t(520,412,'下行：gNB → UE（收）',{s:9,w:700,f:C_DL});
  s+='<line x1="468" y1="434" x2="668" y2="434" stroke="#e2e8f0" stroke-width="1"/>';
  s+=_t(472,448,'CBRA：随机选 preamble（本例）',{s:8.5,f:C_SEC});
  s+=_t(472,463,'CFRA：gNB 指定（切换用，无竞争）',{s:8.5,f:C_MUT});

  s+='</svg>';
  return _wrap(s,6);
}

/* ═══════════════════════════════════════════════════════════
   S7.1 · Preamble 生成（ZC 根序列 → 循环移位 → 64 签名）
   ═══════════════════════════════════════════════════════════ */
var _pmPhase=0, _pmTid=null;
function renderPreamble(){
  var ph=_pmPhase;
  var s='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">';
  s+=_bg('pmbg');
  s+=_frame('pmbg');
  s+=_t(360,30,'Preamble 生成：1 根 ZC 序列 → 循环移位 → 64 个签名',{a:'middle',s:12.5,w:700,f:C_MAIND});
  s+=_t(360,48,'小区只广播「生成配方」，UE 按配方造出 64 个，再随机抓 1 个',{a:'middle',s:9.5,f:C_SEC});

  /* 左：ZC 根序列圆环（恒包络） */
  var cx=160, cy=190, R=86;
  s+=_t(cx,80,'① 根序列 ZC（恒包络）',{a:'middle',s:10,w:800,f:C_MAIN});
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+C_MAIN+'" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.5"/>';
  var ND=28;
  for(var k=0;k<ND;k++){
    var ph2=2*Math.PI*((k*(k+1)/2)%ND)/ND;   // 二次相位爬升示意
    var ang=2*Math.PI*k/ND;
    var px=cx+R*Math.cos(ang-Math.PI/2), py=cy+R*Math.sin(ang-Math.PI/2);
    s+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.4" fill="'+C_MAIN+'" opacity="'+(0.55+0.45*Math.abs(Math.cos(ph2)))+'"/>';
  }
  s+=_t(cx,cy-8,'L_RA = 839',{a:'middle',s:10,w:800,f:C_MAIND});
  s+=_t(cx,cy+10,'每点等幅',{a:'middle',s:8.5,f:C_SEC});
  /* 自相关尖峰小图 */
  var axX=78, axY=314, axW=164, axH=46;
  s+='<rect x="'+axX+'" y="'+axY+'" width="'+axW+'" height="'+axH+'" rx="6" fill="#fff" stroke="#fecaca" stroke-width="1"/>';
  s+='<line x1="'+(axX+8)+'" y1="'+(axY+axH-10)+'" x2="'+(axX+axW-8)+'" y2="'+(axY+axH-10)+'" stroke="'+C_GREY+'" stroke-width="1"/>';
  var pkx=axX+axW/2;
  s+='<line x1="'+pkx+'" y1="'+(axY+axH-10)+'" x2="'+pkx+'" y2="'+(axY+8)+'" stroke="'+C_ANS+'" stroke-width="2.4"/>';
  s+=_t(pkx,axY+4,'尖峰',{a:'middle',s:7.5,w:700,f:C_ANS});
  s+=_t(axX+axW/2,axY+axH+9,'自相关：一根尖峰 → 既检测又测时延',{a:'middle',s:8,f:C_SEC});

  /* 右：64 preamble 网格（8×8），按根分 4 个不透明度带 */
  var GX=372, GY=86, cw=38, chh=30, cols=8;
  s+=_t(GX+cols*cw/2,72,'② 循环移位 (N_CS) → ③ 凑够 64',{a:'middle',s:10,w:800,f:C_MAIN});
  var bandOp=[0.88,0.70,0.54,0.42];
  for(var idx=0;idx<64;idx++){
    var r=Math.floor(idx/cols), cc=idx%cols;
    var gx=GX+cc*cw, gy=GY+r*chh;
    var grp=Math.floor(idx/PER_ROOT);
    var shown = (ph>=2) || (ph===1 && grp===0);
    var sel = (idx===PICK && ph>=3);
    var fill = sel?C_ANS:(shown?C_MAIN:'#f1f5f9');
    var op = sel?1:(shown?bandOp[grp]:1);
    s+='<rect x="'+(gx+1)+'" y="'+(gy+1)+'" width="'+(cw-3)+'" height="'+(chh-3)+'" rx="3" fill="'+fill+'" opacity="'+op+'" stroke="'+(sel?C_ANS:(shown?'#fff':'#e2e8f0'))+'" stroke-width="'+(sel?2.4:0.8)+'"/>';
    s+=_t(gx+cw/2-1,gy+chh/2,idx,{a:'middle',s:8,w:(sel?800:600),f:(shown||sel)?'#fff':C_MUT});
  }
  /* 根分隔标注 */
  for(var g=0;g<4;g++){
    var ry=GY+(g*PER_ROOT/cols)*chh;
    if(ph>=2||(ph===1&&g===0))
      s+=_t(GX-6,ry+8,'根'+(g+1),{a:'end',s:8,w:700,f:C_MAIN});
  }
  /* 选中标注 */
  if(ph>=3){
    var sr=Math.floor(PICK/cols), sc=PICK%cols;
    var sx=GX+sc*cw+cw/2, sy=GY+sr*chh;
    s+=_t(GX+cols*cw/2,GY+8*chh+14,'UE 随机选中 preamble #'+PICK+' = 第 2 根 × 第 9 个循环移位',{a:'middle',s:9.5,w:800,f:C_ANS});
  }

  /* 底部参数条 */
  s+='<rect x="40" y="386" width="640" height="42" rx="9" fill="'+C_KEYL+'" stroke="#fed7aa" stroke-width="1"/>';
  s+=_t(360,400,'配方：rootSequenceIndex='+CFG_ROOT+'　zeroCorrelationZoneConfig='+CFG_ZCZ+' → N_CS=46',{a:'middle',s:9.5,w:700,f:'#b45309'});
  s+=_t(360,416,'每根 ⌊839/46⌋ = 18 个 → 连取 4 根 → 4×18 = 72 → 取前 64 个',{a:'middle',s:9.5,f:C_SEC});

  /* 诚实条 */
  s+='<rect x="40" y="434" width="640" height="40" rx="9" fill="#fff" stroke="#fecaca" stroke-width="1.2"/>';
  s+=_t(360,448,'为什么选 ZC：恒包络（功放满推、覆盖大）+ 理想自相关（一次相关同时完成检测与测时延）',{a:'middle',s:9,w:700,f:C_MAIND});
  s+=_t(360,463,'诚实点：圆环上 28 点是示意；真实 839 点恒幅、相位按二次曲线爬升',{a:'middle',s:8.5,st:1,f:C_MUT});

  s+='</svg>';
  var ctrl='<div class="ctrl-bar">'+
    '<button class="case-btn'+(ph>0?' on':'')+'" onclick="pmRun()">▶ 生成</button>'+
    '<button class="case-btn" onclick="pmReset()">↺ 复位</button>'+
    '<span style="font-size:11px;color:var(--text-mut);font-family:var(--font-mono);">'+(ph>=3?'✓ 已选 #'+PICK:Math.min(ph,3)+'/3')+'</span></div>';
  return _wrapC(ctrl,s);
}
function _pmRe(){ var v=_vc7(); if(v) v.innerHTML=renderPreamble(); }
function pmRun(){
  if(_pmTid){ clearTimeout(_pmTid); _pmTid=null; }
  _pmPhase=0; _pmRe();
  var logs=['','[PHY] 取 ZC 根序列 rootSequenceIndex='+CFG_ROOT+'（恒包络 / 理想自相关）。',
            '[DSP] 连取 4 根 × 18 循环移位 = 72 → 构成 64 个 preamble。',
            '[MAC] UE 随机选中 preamble #'+PICK+'（第 2 根 · 循环移位 9）。'];
  function step(){
    if(_pmPhase>=3){ return; }
    _pmPhase++; _pmRe();
    if(logs[_pmPhase]) Engine.LogEngine.inject(logs[_pmPhase]);
    _pmTid=setTimeout(step,900); Engine.addTimer(_pmTid);
  }
  step();
}
function pmReset(){ if(_pmTid){ clearTimeout(_pmTid); _pmTid=null; } _pmPhase=0; _pmRe(); }

/* ═══════════════════════════════════════════════════════════
   S7.2 · Msg1 发射（长 CP/GT + RA-RNTI）
   ═══════════════════════════════════════════════════════════ */
var _m1Phase=0, _m1Tid=null;
function renderMsg1(){
  var ph=_m1Phase;
  var s='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">';
  s+=_bg('m1bg');
  s+='<defs>'+_mk('m1ar',C_MAIN)+'</defs>';
  s+=_frame('m1bg');
  s+=_t(360,30,'Msg1 · 发射 Preamble：长 CP 吸收「还不知道的」往返时延',{a:'middle',s:12.5,w:700,f:C_MAIND});
  s+=_t(360,48,'此刻还没有 TA，UE 只能盲发——靠超长 CP/GT 把往返时延整个吞进去',{a:'middle',s:9.5,f:C_SEC});

  /* 左上：PRACH 时机（RO）时频块 */
  var GX=44, GY=78, GW=246, GH=132;
  s+=_t(GX+GW/2,GY-8,'PRACH 时机 (RO)：在哪发',{a:'middle',s:9.5,w:700,f:C_MAIND});
  var nC=8, nR=6, cwd=GW/nC, rhd=GH/nR;
  for(var r=0;r<=nR;r++){ var y=GY+r*rhd; s+='<line x1="'+GX+'" y1="'+y+'" x2="'+(GX+GW)+'" y2="'+y+'" stroke="#fdd" stroke-width="0.5"/>'; }
  for(var c2=0;c2<=nC;c2++){ var x=GX+c2*cwd; s+='<line x1="'+x+'" y1="'+GY+'" x2="'+x+'" y2="'+(GY+GH)+'" stroke="#fdd" stroke-width="0.5"/>'; }
  /* RO 块：底部一行（f_id=0，贴 Point A） */
  var roX=GX+2*cwd, roY=GY+(nR-2)*rhd, roW=3*cwd, roH=2*rhd;
  s+='<rect x="'+roX+'" y="'+roY+'" width="'+roW+'" height="'+roH+'" rx="3" fill="'+C_MAIN+'" opacity="'+(ph>=0?0.85:0.3)+'"/>';

    s+=_t(360,333,'应用 TA → 对齐 → 交付 Stage 8…',{a:'middle',s:12,st:1,f:C_MUT});
  }

  /* 诚实条：上行接通 ≠ 已连接 */
  s+='<rect x="44" y="372" width="636" height="100" rx="10" fill="#fff" stroke="'+C_GREY+'" stroke-width="1.2"/>';
  s+='<rect x="44" y="372" width="636" height="26" rx="10" fill="#f1f5f9"/>';
  s+=_t(360,385,'诚实点：上行接通 ≠ 已连接（竞争还没解决）',{a:'middle',s:10.5,w:800,f:C_MAIND});
  s+=_t(360,412,'• 可能有别的 UE 也抓了 #27、也收到这同一个 RAR → 正准备抢同一个 TC-RNTI',{a:'middle',s:9,f:C_SEC});
  s+=_t(360,430,'• Stage 8：Msg3（带唯一标识）+ Msg4（竞争解决）裁出胜者 → TC-RNTI 升格 C-RNTI → CONNECTED',{a:'middle',s:9,f:C_SEC});
  s+=_t(360,450,'• 此刻 RRC 仍 = IDLE，顶栏 C-RNTI 仍灰着（Stage 8 才点亮）',{a:'middle',s:9,w:700,st:1,f:C_MAIN});

  s+='</svg>';
  var ctrl='<div class="ctrl-bar">'+
    '<button class="case-btn'+(ph>0?' on':'')+'" onclick="alRun()">▶ 对齐</button>'+
    '<button class="case-btn" onclick="alReset()">↺ 复位</button>'+
    '<span style="font-size:11px;color:var(--text-mut);font-family:var(--font-mono);">'+(ph>=3?'✓ 上行接通':Math.min(ph,3)+'/3')+'</span></div>';
  return _wrapC(ctrl,s);
}
function _alRe(){ var v=_vc7(); if(v) v.innerHTML=renderAlign(); }
function alRun(){
  if(_alTid){ clearTimeout(_alTid); _alTid=null; }
  _alPhase=0; _alWritten=false; _alRe();
  var logs=['','[PHY] 应用 TA：上行发射时刻提前 N_TA = 25600·Tc ≈ '+TA_US+' μs。',
            '[OK] 上行定时对齐 gNB 时隙边界 → 上行链路首次接通。',
            '[MAC] 交付 Stage 8：TC-RNTI=0x4601 / TA(已应用) / Msg3 UL Grant。'];
  function step(){
    if(_alPhase>=3){ _alWriteCtx(); return; }
    _alPhase++; _alRe();
    if(logs[_alPhase]) Engine.LogEngine.inject(logs[_alPhase]);
    _alTid=setTimeout(step,950); Engine.addTimer(_alTid);
  }
  step();
}
function _alWriteCtx(){
  if(_alWritten) return; _alWritten=true;
  if(window.NR_CTX){
    window.NR_CTX.preamble_idx=PICK;
    window.NR_CTX.ta_cmd=T_A;
    window.NR_CTX.tc_rnti=TC_RNTI;
    window.NR_CTX.ra_response_win='sl20';
  }
  Engine.ctxSet('ta_ns', TA_NS);   /* 点亮顶栏 TA；C-RNTI 留给 Stage 8（仍灰）*/
  Engine.LogEngine.inject('[WARN] 竞争尚未解决，仍为临时身份；RRC 保持 IDLE，C-RNTI 待 Stage 8。');
}
function alReset(){ if(_alTid){ clearTimeout(_alTid); _alTid=null; } _alPhase=0; _alWritten=false; _alRe(); }

/* ─── Viz Router ─────────────────────────────────────────── */
Engine.renderVizSVG = function(subIdx){
  if(subIdx===0) return renderS7Discuss();
  if(subIdx===1) return renderPreamble();
  if(subIdx===2) return renderMsg1();
  if(subIdx===3) return renderRAR();
  if(subIdx===4) return renderAlign();
  return renderS7Discuss();
};
Engine.onAfterRender = function(subIdx){
  if(subIdx===1){ pmReset(); pmRun(); }
  if(subIdx===2){ m1Reset(); m1Run(); }
  if(subIdx===3){ rarReset(); rarRun(); }
  if(subIdx===4){ alReset(); alRun(); }
};
Engine.onStageExit = function(){
  if(_pmTid){ clearTimeout(_pmTid); _pmTid=null; }
  if(_m1Tid){ clearTimeout(_m1Tid); _m1Tid=null; }
  if(_rarTid){ clearTimeout(_rarTid); _rarTid=null; }
  if(_alTid){ clearTimeout(_alTid); _alTid=null; }
};

Engine.boot({ stageIdx: 7 });
</script>

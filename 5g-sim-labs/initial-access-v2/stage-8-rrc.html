<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Stage 8 · RRC 建立 & 安全</title>
<link rel="stylesheet" href="design-system.css">
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'], ['\\(','\\)']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
.case-btn { padding:4px 10px;border-radius:5px;font-size:11px;font-family:var(--font-mono);
            font-weight:700;cursor:pointer;border:1.5px solid var(--border);
            background:var(--surface);color:var(--text-sec);transition:all .15s; }
.case-btn.on { background:#0d9488;border-color:#0d9488;color:white; }
.ctrl-bar { display:flex;align-items:center;gap:12px;background:var(--surface);
            border:1px solid var(--border);border-radius:8px;padding:7px 14px;flex-wrap:wrap; }
</style>
</head>
<body>
<div id="app"></div>
<script src="stage-data.js"></script>
<script src="engine.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   Stage 8 · RRC 建立 & 安全 · 5 sub-steps (0..4)
   配色：主色 teal #0d9488(RRC/SRB/连接结构) / 深 #0f766e / 浅 #ccfbf1
        答案/胜出/CONNECTED 里程碑 = 翠绿 #16a34a / 浅 #dcfce7
        安全密钥 = 琥珀金 #d97706 / 浅 #fff7ed
        高光(竞争失败/未保护/诚实警告) = 红 #dc2626 / 浅 #fee2e2
        下行回指青 #0891b2；对照灰 #94a3b8
   ═══════════════════════════════════════════════════════════ */
var C_MAIN='#0d9488', C_MAIND='#0f766e', C_MAINL='#ccfbf1',
    C_ANS='#16a34a',  C_ANSL='#dcfce7',
    C_KEY='#d97706',  C_KEYL='#fff7ed',
    C_RED='#dc2626',  C_REDL='#fee2e2',
    C_DL='#0891b2',   C_DLL='#cffafe',
    C_GREY='#94a3b8', C_SEC='#475569', C_MUT='#94a3b8';

/* ── 文本助手（与 Stage 5/6/7 一致）── */
function _t(x,y,t,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" '+(o.a?'text-anchor="'+o.a+'" ':'')+
    'dominant-baseline="central" font-family="SF Mono,Consolas,monospace" '+
    'font-size="'+(o.s||10)+'" '+(o.w?'font-weight="'+o.w+'" ':'')+
    'fill="'+(o.f||'#1e293b')+'"'+(o.st?' font-style="italic"':'')+
    (o.id?' id="'+o.id+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'>'+t+'</text>';
}
function _mk(id,c){ return '<marker id="'+id+'" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+c+'"/></marker>'; }
function _bg(id){ return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="#f3fbfa"/><stop offset="1" stop-color="#ccfbf1"/></linearGradient>'+
  '<pattern id="hatch8" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
  '<rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="'+C_GREY+'" stroke-width="2"/></pattern></defs>'; }
function _frame(id){ return '<rect x="14" y="14" width="692" height="467" rx="14" fill="url(#'+id+')" stroke="#99f6e4" stroke-width="1.5"/>'; }
function _wrap(s,pt){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:'+(pt||6)+'px;">'+s+'</div>'; }
function _wrapC(ctrl,s){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:10px;">'+ctrl+s+'</div>'; }
function _vc8(){ return document.getElementById('vizContainer'); }

/* ── 上游 NR_CTX（带兜底，便于独立打开本页）── */
function _ctx(k,d){ return (window.NR_CTX&&window.NR_CTX[k]!=null)?window.NR_CTX[k]:d; }
var TC_RNTI = _ctx('tc_rnti','0x4601') || '0x4601';
var C_RNTI  = '0x4601';                 // 竞争解决成功 → TC-RNTI 值升格为 C-RNTI（38.321 §5.1.5）
var TA_NS   = _ctx('ta_ns',13021);
var PICK    = _ctx('preamble_idx',27);

/* 预计算常量（已验证）*/
var CR_BITS=48, UEID_BITS=39;           // CCCH SDU 48bit；ue-Identity 39bit
var KGNB_BITS=256, AS_KEY_BITS=128;

/* ═══════════════════════════════════════════════════════════
   S8.0 · 理论黑板（竞争解决 + 连接建立 + 安全激活 路线图）
   ═══════════════════════════════════════════════════════════ */
function renderS8Discuss(){
  var s='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">';
  s+=_bg('s8bg');
  s+='<defs>'+_mk('a8M',C_MAIN)+_mk('a8G',C_GREY)+_mk('a8A',C_ANS)+'</defs>';
  s+=_frame('s8bg');
  s+='<rect x="14" y="14" width="692" height="40" rx="14" fill="'+C_MAIN+'" opacity="0.12"/>';
  s+=_t(360,34,'RRC 建立 &amp; 安全：竞争解决 → 建连 → 激活保护 → RRC_CONNECTED',{a:'middle',s:13,w:700,f:C_MAIND});

  /* 接续 S7 的状态条 */
  s+='<rect x="40" y="60" width="640" height="22" rx="6" fill="'+C_KEYL+'" stroke="#fed7aa" stroke-width="1"/>';
  s+=_t(360,71,'承 Stage 7：已拿到 TC-RNTI（临时）+ 上行已对齐 TA，但竞争未决、仍 RRC_IDLE',{a:'middle',s:9.5,w:700,f:'#b45309'});

  /* 两张「非解决不可」卡 */
  var cards=[
    {x:40, c:C_MAIN, t:'① 竞争还没解决', l1:'可能有别的 UE 也抓了 #'+PICK, l2:'也收了同一个 RAR、抢同一 TC-RNTI', f:'→ Msg3 塞唯一身份 → Msg4 点名胜者'},
    {x:372,c:C_KEY,  t:'② 连接 + 安全都没有', l1:'还只是临时身份、明文裸奔',     l2:'没有 SRB1、没有完整性/加密保护',   f:'→ 建 SRB1 → 激活 AS 安全双保护'}
  ];
  for(var i=0;i<2;i++){ var c=cards[i];
    s+='<rect x="'+c.x+'" y="90" width="308" height="86" rx="10" fill="#fff" stroke="'+c.c+'" stroke-width="1.8"/>';
    s+='<rect x="'+c.x+'" y="90" width="308" height="26" rx="10" fill="'+c.c+'" opacity="0.14"/>';
    s+=_t(c.x+154,103,c.t,{a:'middle',s:11.5,w:800,f:c.c});
    s+=_t(c.x+154,131,c.l1,{a:'middle',s:9.5,f:C_SEC});
    s+=_t(c.x+154,146,c.l2,{a:'middle',s:9.5,f:C_SEC});
    s+='<rect x="'+(c.x+12)+'" y="156" width="284" height="14" rx="5" fill="'+(i===0?C_MAINL:C_KEYL)+'"/>';
    s+=_t(c.x+154,163,c.f,{a:'middle',s:9,w:700,f:(i===0?C_MAIND:'#b45309')});
  }

  /* CBRA 阶梯（4 步全景：S7 灰=已完成 / S8 主色=本阶段点亮）*/
  s+=_t(360,192,'4 步竞争式接入（CBRA）· 本阶段点亮后两步 Msg3 / Msg4',{a:'middle',s:11,w:800,f:C_MAIND});
  s+='<rect x="40" y="206" width="640" height="64" rx="10" fill="#f1f5f9"/>';
  s+='<rect x="40" y="270" width="640" height="64" rx="10" fill="'+C_MAINL+'" opacity="0.6"/>';
  s+='<rect x="48" y="210" width="84" height="18" rx="5" fill="'+C_GREY+'"/>';
  s+=_t(90,219,'Stage 7（已完成）',{a:'middle',s:8,w:800,f:'#fff'});
  s+='<rect x="48" y="274" width="84" height="18" rx="5" fill="'+C_MAIN+'"/>';
  s+=_t(90,283,'Stage 8（本）',{a:'middle',s:8.5,w:800,f:'#fff'});
  var UEx=150, GNx=570;
  s+='<line x1="'+UEx+'" y1="206" x2="'+UEx+'" y2="334" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 3"/>';
  s+='<line x1="'+GNx+'" y1="206" x2="'+GNx+'" y2="334" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 3"/>';
  s+='<rect x="'+(UEx-26)+'" y="196" width="52" height="18" rx="6" fill="'+C_MAIN+'"/>'; s+=_t(UEx,205,'UE',{a:'middle',s:9.5,w:800,f:'#fff'});
  s+='<rect x="'+(GNx-30)+'" y="196" width="60" height="18" rx="6" fill="'+C_DL+'"/>'; s+=_t(GNx,205,'gNB',{a:'middle',s:9.5,w:800,f:'#fff'});
  function msgA(y,fromUE,col,mk,dashed){
    var x1=fromUE?(UEx+8):(GNx-8), x2=fromUE?(GNx-8):(UEx+8);
    return '<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+col+'" stroke-width="'+(dashed?1.8:2.4)+'"'+(dashed?' stroke-dasharray="6 4"':'')+' marker-end="url(#'+mk+')"/>';
  }
  s+=_t(360,222,'Msg1 · Preamble（随机抓 1 个）',{a:'middle',s:9,w:700,f:C_GREY});
  s+=msgA(234,true,C_GREY,'a8G',true);
  s+=_t(360,254,'Msg2 · RAR（TA + TC-RNTI + UL Grant）',{a:'middle',s:9,w:700,f:C_GREY});
  s+=msgA(264,false,C_GREY,'a8G',true);
  s+=_t(360,286,'Msg3 · RRCSetupRequest（带唯一身份 · SRB0）',{a:'middle',s:9.5,w:700,f:C_MAIN});
  s+=msgA(298,true,C_MAIN,'a8M',false);
  s+=_t(360,318,'Msg4 · 竞争解决 + RRCSetup（TC-RNTI→C-RNTI · 进 CONNECTED）',{a:'middle',s:9.5,w:700,f:C_ANS});
  s+=msgA(328,false,C_ANS,'a8A',false);

  /* 底部左：SRB / 安全演进 */
  s+='<rect x="40" y="344" width="368" height="130" rx="10" fill="#fff" stroke="'+C_MAIN+'" stroke-width="1.5"/>';
  s+='<rect x="40" y="344" width="368" height="24" rx="10" fill="'+C_MAINL+'"/>';
  s+=_t(224,356,'信令承载（SRB）一路升级',{a:'middle',s:10,w:800,f:C_MAIND});
  var srb=[
    ['SRB0 / CCCH', 'Msg3·Msg4', 'TM · 无安全 · 不分段', C_GREY],
    ['SRB1 / DCCH', 'Msg5 起',   'RLC AM · 可靠重传',     C_MAIN],
    ['+ AS 安全',   'SMC 之后',  '完整性(强制)+加密(可选)', C_ANS]
  ];
  for(var k=0;k<3;k++){ var r=srb[k], ry=375+k*32;
    s+='<rect x="54" y="'+ry+'" width="120" height="24" rx="5" fill="'+r[3]+'" opacity="0.16" stroke="'+r[3]+'" stroke-width="1"/>';
    s+=_t(114,ry+12,r[0],{a:'middle',s:9,w:800,f:r[3]});
    s+=_t(184,ry+5,r[1],{s:8,f:C_MUT});
    s+=_t(184,ry+18,r[2],{s:8.2,f:C_SEC});
    if(k<2) s+=_t(380,ry+12,'↓',{a:'middle',s:13,w:800,f:C_GREY});
  }

  /* 底部右：安全预告·密钥树 */
  s+='<rect x="420" y="344" width="260" height="130" rx="10" fill="#fff" stroke="'+C_KEY+'" stroke-width="1.5"/>';
  s+='<rect x="420" y="344" width="260" height="24" rx="10" fill="'+C_KEYL+'"/>';
  s+=_t(550,356,'🔐 一把根密钥长出整棵保护树',{a:'middle',s:9.5,w:800,f:'#b45309'});
  s+='<rect x="500" y="376" width="100" height="22" rx="6" fill="'+C_KEY+'"/>';
  s+=_t(550,387,'K_gNB（根）',{a:'middle',s:9,w:800,f:'#fff'});
  s+='<line x1="550" y1="398" x2="550" y2="410" stroke="'+C_KEY+'" stroke-width="1.4"/>';
  s+='<line x1="462" y1="410" x2="638" y2="410" stroke="'+C_KEY+'" stroke-width="1.4"/>';
  var leaf=['K_RRCint','K_RRCenc','K_UPenc'];
  for(var j=0;j<3;j++){ var lx=440+j*82;
    s+='<line x1="'+(lx+34)+'" y1="410" x2="'+(lx+34)+'" y2="420" stroke="'+C_KEY+'" stroke-width="1.2"/>';
    s+='<rect x="'+lx+'" y="420" width="68" height="20" rx="5" fill="'+C_KEYL+'" stroke="'+C_KEY+'" stroke-width="1"/>';
    s+=_t(lx+34,430,leaf[j],{a:'middle',s:7.8,w:700,f:'#b45309'});
  }
  s+=_t(550,456,'完整性=防篡改(强制) · 加密=防窃听(可选)',{a:'middle',s:8,f:C_SEC});
  s+=_t(550,468,'诚实点：K_gNB 由 NAS 鉴权产生 → 后续项目',{a:'middle',s:7.8,st:1,f:C_MUT});

  s+='</svg>';
  return _wrap(s,6);
}

/* ═══════════════════════════════════════════════════════════
   S8.1 · Msg3 · RRCSetupRequest（SRB0/CCCH，塞唯一身份当竞争武器）
   phases: 0 idle → 1 用 UL Grant 发 PUSCH → 2 填 ue-Identity/cause → 3 标 48bit 指纹+加扰 TC-RNTI
   ═══════════════════════════════════════════════════════════ */
var _m3Phase=0, _m3Tid=null;
function renderMsg3(){
  var ph=_m3Phase;
  var s='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">';
  s+=_bg('m3bg');
  s+='<defs>'+_mk('m3ar',C_MAIN)+'</defs>';
  s+=_frame('m3bg');
  s+=_t(360,30,'Msg3 · RRCSetupRequest：第一条 RRC 消息，塞进「唯一身份」当竞争武器',{a:'middle',s:12,w:700,f:C_MAIND});
  s+=_t(360,48,'用 Stage 7 给的 UL Grant 在 PUSCH 上发 → 走 SRB0 / 上行 CCCH（明文，无安全）',{a:'middle',s:9.5,f:C_SEC});

  /* 左：UE→gNB PUSCH 发射 */
  var UEx=92, GNx=320;
  s+='<rect x="'+(UEx-30)+'" y="74" width="60" height="22" rx="6" fill="'+C_MAIN+'"/>'; s+=_t(UEx,85,'UE',{a:'middle',s:10,w:800,f:'#fff'});
  s+='<rect x="'+(GNx-32)+'" y="74" width="64" height="22" rx="6" fill="'+C_DL+'"/>'; s+=_t(GNx,85,'gNB',{a:'middle',s:10,w:800,f:'#fff'});
  s+='<line x1="'+UEx+'" y1="100" x2="'+UEx+'" y2="210" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>';
  s+='<line x1="'+GNx+'" y1="100" x2="'+GNx+'" y2="210" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>';
  s+=_t((UEx+GNx)/2,116,'UL Grant（来自 RAR）→ PUSCH',{a:'middle',s:8.5,w:700,f:C_KEY});
  if(ph>=1){
    s+='<line x1="'+(UEx+8)+'" y1="138" x2="'+(GNx-8)+'" y2="138" stroke="'+C_MAIN+'" stroke-width="2.6" marker-end="url(#m3ar)"/>';
    s+=_t((UEx+GNx)/2,128,'Msg3（PUSCH）',{a:'middle',s:8.5,w:800,f:C_MAIN});
  } else {
    s+='<line x1="'+(UEx+8)+'" y1="138" x2="'+(GNx-8)+'" y2="138" stroke="#e2e8f0" stroke-width="1.6" stroke-dasharray="5 4"/>';
  }
  /* 信道栈小标 */
  s+='<rect x="'+(UEx-46)+'" y="160" width="92" height="44" rx="7" fill="#fff" stroke="'+C_MAIN+'" stroke-width="1.1"/>';
  s+=_t(UEx,173,'SRB0 / CCCH',{a:'middle',s:8.5,w:800,f:C_MAIND});
  s+=_t(UEx,187,'RLC TM',{a:'middle',s:8,f:C_SEC});
  s+=_t(UEx,198,'不分段',{a:'middle',s:7.6,f:C_MUT});

  /* 右：48-bit CCCH SDU 比特带（RRCSetupRequest 内容）*/
  var BX=360, BW=320, BY=110, fields=[
    {n:'CHOICE 头',   b:4,         c:C_SEC,  sub:'UPER 消息路由 1+2+1'},
    {n:'ue-Identity', b:UEID_BITS, c:C_MAIN, sub:'39 bit · 随机值/5G-S-TMSI-Part1'},
    {n:'estCause',    b:4,         c:C_KEY,  sub:'接入原因'},
    {n:'spare',       b:1,         c:C_GREY, sub:'保留'}
  ];
  var totB=4+UEID_BITS+4+1, accX=BX;
  s+=_t(BX+BW/2,98,'RRCSetupRequest 内容（编进 48-bit CCCH SDU）',{a:'middle',s:9.5,w:800,f:C_MAIND});
  for(var i=0;i<fields.length;i++){ var fd=fields[i], w=BW*fd.b/totB, lit=(ph>=2);
    s+='<rect x="'+accX.toFixed(1)+'" y="'+BY+'" width="'+(w-2).toFixed(1)+'" height="34" rx="4" fill="'+(lit?fd.c:'#f1f5f9')+'" opacity="'+(lit?0.92:1)+'" stroke="'+(lit?fd.c:'#e2e8f0')+'" stroke-width="1"/>';
    s+=_t(accX+w/2,BY+17,(w>60?fd.n:fd.b+'b'),{a:'middle',s:(w>60?8.5:8),w:800,f:(lit?'#fff':C_MUT)});
    accX+=w;
  }
  s+=_t(BX,BY+46,'开头 4 bit 是 UPER 的 CHOICE 路由头（1+2+1）→ 指明「这是 RRCSetupRequest」',{s:8.6,f:C_SEC});
  s+=_t(BX,BY+59,'呼应 Stage 6：无标签紧凑编码，连消息类型都靠位置 + 选择位省着编',{s:8,st:1,f:C_MUT});
  s+=_t(BX,BY+76,'最显眼的是 ue-Identity：接入前还没唯一身份，先填 39-bit 随机值占位',{s:8.6,f:C_SEC});
  s+=_t(BX,BY+90,'正因为「随机」→ 可能和别人撞 → 需要 Msg4 竞争解决裁决',{s:8.6,st:1,f:C_RED});

  /* 中部：48-bit 指纹卡（竞争武器）*/
  var FX=44, FY=246, FW=636, FH=70;
  s+='<rect x="'+FX+'" y="'+FY+'" width="'+FW+'" height="'+FH+'" rx="11" fill="'+(ph>=3?C_MAINL:'#f8fafc')+'" stroke="'+(ph>=3?C_MAIN:'#e2e8f0')+'" stroke-width="'+(ph>=3?2:1)+'"/>';
  s+=_t(FX+FW/2,FY+16,(ph>=3?'🔖 这 48 bit（6 字节）= 你的「指纹」':'…整条 CCCH SDU 即将成为竞争指纹'),{a:'middle',s:11,w:800,f:(ph>=3?C_MAIND:C_MUT)});
  /* 6 字节示意 */
  for(var by=0;by<6;by++){ var bxx=FX+FW/2-150+by*50;
    s+='<rect x="'+bxx+'" y="'+(FY+28)+'" width="44" height="22" rx="4" fill="'+(ph>=3?'#fff':'#f1f5f9')+'" stroke="'+(ph>=3?C_MAIN:'#e2e8f0')+'" stroke-width="1"/>';
    s+=_t(bxx+22,FY+39,'B'+by,{a:'middle',s:8.5,w:700,f:(ph>=3?C_MAIND:C_MUT)});
  }
  s+=_t(FX+FW/2,FY+60,(ph>=3?'gNB 会在 Msg4 把这 48 bit 原样回显 → 谁的指纹被回显，谁就是竞争胜者':''),{a:'middle',s:9,w:700,f:C_MAIN});

  /* 加扰条 */
  s+='<rect x="44" y="328" width="312" height="48" rx="9" fill="'+C_REDL+'" stroke="#fecaca" stroke-width="1.2"/>';
  s+=_t(200,344,'加扰 RNTI = TC-RNTI（'+TC_RNTI+'）',{a:'middle',s:10,w:800,f:'#991b1b'});
  s+=_t(200,362,'还没有 C-RNTI；用 RAR 给的临时身份',{a:'middle',s:8.6,f:C_SEC});
  s+='<rect x="368" y="328" width="312" height="48" rx="9" fill="#fff" stroke="'+C_RED+'" stroke-width="1.2"/>';
  s+=_t(524,344,'⚠ 明文裸奔：SRB0 无完整性、无加密',{a:'middle',s:9.5,w:800,f:'#991b1b'});
  s+=_t(524,362,'安全要到 S8.3 SMC 才激活',{a:'middle',s:8.6,f:C_SEC});

  /* 鸡生蛋诚实条 */
  s+='<rect x="44" y="386" width="636" height="86" rx="10" fill="#fff" stroke="'+C_GREY+'" stroke-width="1.2"/>';
  s+='<rect x="44" y="386" width="636" height="24" rx="10" fill="#f1f5f9"/>';

  _secPhase=0; _secRe();
  var logs=['','[RRC] 取根密钥 K_gNB（256b，来自 NAS 鉴权 / 越界）。',
            '[RRC] KDF 派生 AS 密钥：K_RRCint / K_RRCenc / K_UPenc（截断 128b）。',
            '[RRC] 收 SecurityModeCommand：指定 NIA/NEA；本消息仅完整性保护。',
            '[OK] 发 SecurityModeComplete：完整性 + 加密双激活 → AS 安全建立。'];
  function step(){
    if(_secPhase>=4){ return; }
    _secPhase++; _secRe();
    if(logs[_secPhase]) Engine.LogEngine.inject(logs[_secPhase]);
    _secTid=setTimeout(step,950); Engine.addTimer(_secTid);
  }
  step();
}
function secReset(){ if(_secTid){ clearTimeout(_secTid); _secTid=null; } _secPhase=0; _secRe(); }

var STAGES9=[['⓪','Tc'],['①','SSB'],['②','PSS'],['③','SSS'],['④','PBCH'],['⑤','CORESET'],['⑥','SIB1'],['⑦','PRACH'],['⑧','RRC']];

  var UEx=130, GNx=360;

  var sx=[150,360];

    s+=_t(sx[i],smY,states[i][0],{a:'middle',s:11,w:800,f:on?(i===1?C_ANS:C_SEC):C_MUT});

  s+=_t(254,smY-12,(ph>=2?'竞争解决+RRCSetup':'…'),{a:'middle',s:7.6,f:(ph>=2?C_ANS:C_MUT)});

  /* 全流程 9 段时间线 */
  s+=_t(360,212,'全流程闭环：从 0.509ns 的 Tc，到 RRC_CONNECTED',{a:'middle',s:10.5,w:800,f:C_MAIND});
  var LX=44, LW=636, step9=LW/8;

  for(var k=0;k<9;k++){ var cx=LX+k*step9;
    var done=(ph>=3) || k<8;       /* 前 8 段始终已完成；第 9 段 ph>=3 点亮 */
    var isLast=(k===8);
    var col2=isLast?(ph>=3?C_ANS:C_MUT):C_MAIN;
    s+='<circle cx="'+cx+'" cy="248" r="'+(isLast?11:8)+'" fill="'+(isLast&&ph>=3?C_ANS:(done?col2:'#fff'))+'" stroke="'+col2+'" stroke-width="2"/>';
    if(isLast&&ph>=3) s+=_t(cx,248,'✓',{a:'middle',s:10,w:800,f:'#fff'});
    s+=_t(cx,228,STAGES9[k][0],{a:'middle',s:9,w:700,f:col2});
    s+=_t(cx,268,STAGES9[k][1],{a:'middle',s:7.6,w:(isLast?800:600),f:isLast?col2:C_SEC});

  /* 写入总线汇总卡 */
  if(ph>=2){
    s+='<rect x="44" y="288" width="636" height="48" rx="10" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="1.8"/>';
    s+=_t(360,304,'写入 NR_CTX：c_rnti='+C_RNTI+' · rrc_state=CONNECTED · srb1=✓ · AS 安全=✓',{a:'middle',s:9.5,w:800,f:'#15803d'});

  } else {

    s+=_t(360,312,'状态机翻到 CONNECTED 后写入总线…',{a:'middle',s:10,st:1,f:C_MUT});

    s+=_t(200,359,'🚩 终点：RRC_CONNECTED',{a:'middle',s:11,w:800,f:C_ANS});

    s+=_t(200,404,'有可靠信令、受安全保护的成员',{a:'middle',s:9.5,f:C_SEC});
    s+=_t(200,428,'空口接入（L1/L2 + RRC/AS）',{a:'middle',s:9,w:700,f:C_MAIND});
    s+=_t(200,444,'这条主线到此完整收官',{a:'middle',s:9,w:700,f:C_MAIND});
    s+=_t(200,458,'',{a:'middle',s:8});
  } else {
    s+='<rect x="44" y="346" width="312" height="120" rx="11" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>';
    s+=_t(200,406,'🚩 终点旗待升起…',{a:'middle',s:11,st:1,f:C_MUT});
  }
  /* 诚实点：CONNECTED ≠ 能上网 */
  s+='<rect x="368" y="346" width="312" height="120" rx="11" fill="#fff" stroke="'+C_GREY+'" stroke-width="1.3"/>';
  s+='<rect x="368" y="346" width="312" height="26" rx="11" fill="#f1f5f9"/>';
  s+=_t(524,359,'诚实点：CONNECTED ≠ 能上网',{a:'middle',s:10.5,w:800,f:C_MAIND});
  s+=_t(524,386,'• 现在是 RRC/AS 连接，还没有',{a:'middle',s:9,f:C_SEC});
  s+=_t(524,402,'数据承载（DRB）、还没有 IP',{a:'middle',s:9,f:C_SEC});
  s+=_t(524,422,'• 接下来：NAS 注册 + PDU 会话',{a:'middle',s:9,w:700,f:C_RED});
  s+=_t(524,438,'建立 → 分配 DRB → 真正上网',{a:'middle',s:9,w:700,f:C_RED});
  s+=_t(524,458,'NAS / PDU 会话 + NTN 为后续独立项目',{a:'middle',s:8,st:1,f:C_MUT});

  s+='</svg>';
  var ctrl='<div class="ctrl-bar">'+
    '<button class="case-btn'+(ph>0?' on':'')+'" onclick="finRun()">▶ 收官</button>'+
    '<button class="case-btn" onclick="finReset()">↺ 复位</button>'+
    '<span style="font-size:11px;color:var(--text-mut);font-family:var(--font-mono);">'+(ph>=3?'✓ CONNECTED · 全流程完成':Math.min(ph,3)+'/3')+'</span></div>';
  return _wrapC(ctrl,s);
}
function _finRe(){ var v=_vc8(); if(v) v.innerHTML=renderFinale(); }
function finRun(){
  if(_finTid){ clearTimeout(_finTid); _finTid=null; }
  _finPhase=0; _finWritten=false; _finRe();
  var logs=['','[RRC] 发 RRCSetupComplete（SRB1 / DCCH，加扰 C-RNTI；内携 NAS 注册请求转 AMF）。',
            '[RRC] 状态机：IDLE → CONNECTED。接入流程（L1/L2 + RRC/AS）完成。',
            '[SUCCESS] 全流程闭环：Tc → SSB → PSS → SSS → PBCH → CORESET → SIB1 → PRACH → RRC。'];
  function step(){
    if(_finPhase>=3){ _finWriteCtx(); return; }
    _finPhase++; _finRe();
    if(logs[_finPhase]) Engine.LogEngine.inject(logs[_finPhase]);
    if(_finPhase===2) _finWriteCtx();   /* 状态机翻 CONNECTED 即写总线 */
    _finTid=setTimeout(step,1000); Engine.addTimer(_finTid);
  }
  step();
}
function _finWriteCtx(){
  if(_finWritten) return; _finWritten=true;
  if(window.NR_CTX){
    window.NR_CTX.srb1_established=true;
    window.NR_CTX.as_security=true;
  }
  if(window.NR_CTX && window.NR_CTX.c_rnti==null) window.NR_CTX.c_rnti=C_RNTI;
  Engine.ctxSet('rrc_state','CONNECTED');
}
function finReset(){ if(_finTid){ clearTimeout(_finTid); _finTid=null; } _finPhase=0; _finWritten=false; _finRe(); }

/* ─── Viz Router ─────────────────────────────────────────── */
Engine.renderVizSVG = function(subIdx){
  if(subIdx===0) return renderS8Discuss();
  if(subIdx===1) return renderMsg3();
  if(subIdx===2) return renderMsg4();
  if(subIdx===3) return renderSecurity();
  if(subIdx===4) return renderFinale();
  return renderS8Discuss();
};
Engine.onAfterRender = function(subIdx){
  if(subIdx===1){ m3Reset(); m3Run(); }
  if(subIdx===2){ m4Reset(); m4Run(); }
  if(subIdx===3){ secReset(); secRun(); }
  if(subIdx===4){ finReset(); finRun(); }
};
Engine.onStageExit = function(){
  if(_m3Tid){ clearTimeout(_m3Tid); _m3Tid=null; }
  if(_m4Tid){ clearTimeout(_m4Tid); _m4Tid=null; }
  if(_secTid){ clearTimeout(_secTid); _secTid=null; }
  if(_finTid){ clearTimeout(_finTid); _finTid=null; }
};

Engine.boot({ stageIdx: 8 });

<script>
/* ═══════════════════════════════════════════════════════════
   Stage 0 · 5GC 架构与 SBA 总览 · 4 sub-steps (0..3)
   配色（网元身份分色）：
     AMF 紫 #7c3aed / SMF 青蓝 #0891b2 / UPF navy #1e3a8a
     UDM·AUSF 金 #d97706 / gNB 灰 #64748b
     答案绿 #059669 / 高光红 #dc2626(越界·告警) / 对照灰 #94a3b8
   本 Stage 立起后续复用母版：网元盒 _nfBox / N-Bus / 接口箭头
   ═══════════════════════════════════════════════════════════ */
var C_AMF='#7c3aed', C_AMFD='#5b21b6', C_AMFL='#ede9fe',
    C_SMF='#0891b2', C_SMFD='#0e7490', C_SMFL='#cffafe',
    C_UPF='#1e3a8a', C_UPFD='#172554', C_UPFL='#dbeafe',
    C_KEY='#d97706', C_KEYD='#b45309', C_KEYL='#fff7ed',
    C_GNB='#64748b', C_GNBL='#e2e8f0',
    C_ANS='#059669', C_ANSL='#d1fae5',
    C_RED='#dc2626', C_REDL='#fee2e2',
    C_GREY='#94a3b8', C_SEC='#475569', C_MUT='#94a3b8';

/* ── SVG 文本助手（与 1.0 各 Stage 一致）── */
function _t(x,y,t,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" '+(o.a?'text-anchor="'+o.a+'" ':'')+
    'dominant-baseline="central" font-family="SF Mono,Consolas,monospace" '+
    'font-size="'+(o.s||10)+'" '+(o.w?'font-weight="'+o.w+'" ':'')+
    'fill="'+(o.f||'#1e293b')+'"'+(o.st?' font-style="italic"':'')+
    (o.id?' id="'+o.id+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'>'+t+'</text>';
}
function _mk(id,c){ return '<marker id="'+id+'" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+c+'"/></marker>'; }
function _bg(id){ return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="#faf9ff"/><stop offset="1" stop-color="#f1f0fb"/></linearGradient></defs>'; }
function _frame(id){ return '<rect x="14" y="14" width="692" height="467" rx="14" fill="url(#'+id+')" stroke="#ddd6fe" stroke-width="1.5"/>'; }
function _wrap(s,pt){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:'+(pt||6)+'px;">'+s+'</div>'; }
function _wrapC(ctrl,s){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:10px;">'+ctrl+s+'</div>'; }
function _vc(){ return document.getElementById('vizContainer'); }

/* ── 上游 NR_CTX（带兜底，便于独立打开本页）── */
function _ctx(k,d){ return (window.NR_CTX&&window.NR_CTX[k]!=null)?window.NR_CTX[k]:d; }

/* ══════════════════════════════════════════════════════════
   可复用母版 · 网元盒（后续 Stage 泳道头复用）
   x,y = 左上角；w,h；c=主色；cl=浅色填充；abbr=缩写；full=全称
   plane: 'cp'|'up'|'ran' 用于右上角小标
   ══════════════════════════════════════════════════════════ */
function _nfBox(x,y,w,h,c,cl,abbr,full,o){ o=o||{};
  var s='';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" fill="'+cl+'" stroke="'+c+'" stroke-width="'+(o.sw||2)+'"'+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  /* 顶部色条 */
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="6" rx="3" fill="'+c+'"'+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  s+=_t(x+w/2, y+h/2-7, abbr, {a:'middle',s:(o.as||16),w:800,f:c});
  if(full) s+=_t(x+w/2, y+h/2+11, full, {a:'middle',s:(o.fs||7.5),f:C_SEC});
  return s;
}
/* 接口箭头：双端水平/竖直线 + 标签 */
function _iface(x1,y1,x2,y2,c,label,o){ o=o||{};
  var dash=o.dash?' stroke-dasharray="'+o.dash+'"':'';
  var s='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(o.sw||1.8)+'"'+dash+
        (o.m?' marker-end="url(#'+o.m+')"':'')+(o.m2?' marker-start="url(#'+o.m2+')"':'')+'/>';
  if(label){ var mx=(x1+x2)/2, my=(y1+y2)/2;
    s+='<rect x="'+(mx-(o.lw||20))+'" y="'+(my-8)+'" width="'+((o.lw||20)*2)+'" height="16" rx="4" fill="#fff" stroke="'+c+'" stroke-width="1" opacity="0.95"/>';
    s+=_t(mx, my, label, {a:'middle',s:(o.ls||8.5),w:800,f:c});
  }
  return s;
}

/* ══════════════════════════════════════════════════════════
   S0.0 · 过渡图：RRC_CONNECTED → 5GC 三问
   ══════════════════════════════════════════════════════════ */
function renderOverview(){
  var s='<svg viewBox="0 0 720 452" width="100%" height="100%" style="display:block;">';
  s+=_bg('bg0')+_frame('bg0');
  s+='<defs>'+_mk('arP',C_AMF)+_mk('arG',C_ANS)+_mk('arR',C_RED)+'</defs>';
  s+=_t(360,40,'空口已通 → 但「网络」还不认识你',{a:'middle',s:15,w:800,f:C_AMFD});

  /* 左：1.0 终点状态卡 */
  s+='<rect x="40" y="78" width="190" height="120" rx="11" fill="#ecfdf5" stroke="'+C_ANS+'" stroke-width="2"/>';
  s+=_t(135,100,'1.0 终点',{a:'middle',s:11,w:800,f:C_ANS});
  s+=_t(135,124,'RRC_CONNECTED',{a:'middle',s:12,w:800,f:'#065f46'});
  s+=_t(135,146,'C-RNTI = 0x4601',{a:'middle',s:9.5,f:C_SEC});
  s+=_t(135,164,'AS 安全已激活',{a:'middle',s:9.5,f:C_SEC});
  s+=_t(135,182,'空口管道 = 通',{a:'middle',s:9.5,w:700,f:C_ANS});

  /* 中：gNB 管道（透明） */
  s+='<rect x="270" y="100" width="120" height="76" rx="10" fill="'+C_GNBL+'" stroke="'+C_GNB+'" stroke-width="2" stroke-dasharray="5 4"/>';
  s+=_t(330,124,'gNB',{a:'middle',s:14,w:800,f:C_GNB});
  s+=_t(330,146,'透明管道',{a:'middle',s:9,f:C_SEC});
  s+=_t(330,162,'不认识你',{a:'middle',s:8.5,st:1,f:C_MUT});
  s+=_iface(230,138,270,138,C_GNB,'',{m:'arG'});

  /* 右：5GC 三问 */
  var qs=[
    ['你是谁？','AUSF / UDM 鉴权',C_KEY,'#fffbeb'],
    ['准不准接入？','AMF 移动性管理',C_AMF,C_AMFL],
    ['数据往哪送？','SMF + UPF 会话',C_SMF,C_SMFL]
  ];
  qs.forEach(function(q,i){ var qy=82+i*84;
    s+='<rect x="470" y="'+qy+'" width="210" height="68" rx="10" fill="'+q[3]+'" stroke="'+q[2]+'" stroke-width="1.8"/>';
    s+=_t(575,qy+24,q[0],{a:'middle',s:12,w:800,f:q[2]});
    s+=_t(575,qy+46,q[1],{a:'middle',s:9,f:C_SEC});
    s+=_iface(390,138,470,qy+34,q[2],'',{m:(i==1?'arP':'arP'),sw:1.4,dash:'4 3'});
  });

  /* 底部结论条 */
  s+='<rect x="40" y="356" width="640" height="68" rx="11" fill="#faf5ff" stroke="'+C_AMF+'" stroke-width="1.5"/>';
  s+=_t(60,382,'2.0 旅程：',{s:11,w:800,f:C_AMFD});
  s+=_t(60,404,'NAS 注册 → 5G-AKA 鉴权（空投 K_gNB 还债）→ NAS 安全 → 拿 5G-GUTI → PDU 会话拿 IP → 首个包出 N6',{s:9.3,f:C_SEC});
  s+='</svg>';
  return _wrap(s,8);
}

/* ══════════════════════════════════════════════════════════
   S0.1 · 网元点名：CP/UP 分区 + 五网元 + gNB
   ══════════════════════════════════════════════════════════ */
function renderNFRoster(){
  var s='<svg viewBox="0 0 720 452" width="100%" height="100%" style="display:block;">';
  s+=_bg('bg1')+_frame('bg1');
  s+=_t(360,38,'5GC 网元点名 · 控制面指挥 / 用户面搬运',{a:'middle',s:14,w:800,f:C_AMFD});

  /* 控制面分区底板 */
  s+='<rect x="34" y="64" width="652" height="190" rx="12" fill="#faf9ff" stroke="#ddd6fe" stroke-width="1.5"/>';
  s+=_t(50,82,'控制面 CP · 只跑信令，不碰用户数据',{s:10,w:800,f:C_AMFD});

  /* CP 网元：AUSF/UDM(金) AMF(紫) SMF(青蓝) */
  s+=_nfBox(70,100,150,128,C_AMF,C_AMFL,'AMF','接入移动性管理',{as:20,fs:8});
  s+=_t(145,210,'信令枢纽·大管家',{a:'middle',s:8,st:1,f:C_AMFD});
  s+=_nfBox(285,100,150,128,C_SMF,C_SMFL,'SMF','会话管理',{as:20,fs:8});
  s+=_t(360,210,'会话大脑·分配IP',{a:'middle',s:8,st:1,f:C_SMFD});
  s+=_nfBox(500,100,90,128,C_KEY,C_KEYL,'AUSF','鉴权服务',{as:15,fs:7});
  s+=_t(545,210,'验真伪',{a:'middle',s:7.5,st:1,f:C_KEYD});
  s+=_nfBox(596,100,90,128,C_KEY,C_KEYL,'UDM','签约数据中心',{as:15,fs:7});
  s+=_t(641,206,'SIDF',{a:'middle',s:7.5,w:800,f:C_KEYD});
  s+=_t(641,218,'持私钥解 SUCI',{a:'middle',s:6.6,st:1,f:C_KEYD});

  /* 用户面分区底板 */
  s+='<rect x="34" y="268" width="652" height="100" rx="12" fill="#eff3fb" stroke="#c7d2fe" stroke-width="1.5"/>';
  s+=_t(50,286,'用户面 UP · 只搬数据，不做决策',{s:10,w:800,f:C_UPFD});
  s+=_nfBox(70,302,200,56,C_UPF,C_UPFL,'UPF','用户面功能·数据路由器',{as:18,fs:7.5});
  s+=_t(440,324,'N3 收 → N6 发，宽广的「数据海洋」',{a:'middle',s:10,f:C_UPFD});
  s+=_t(440,344,'真正搬运每一个用户数据包',{a:'middle',s:8.5,st:1,f:C_SEC});

  /* RAN：gNB 透明管道 */
  s+='<rect x="34" y="382" width="652" height="56" rx="12" fill="'+C_GNBL+'" stroke="'+C_GNB+'" stroke-width="1.5" stroke-dasharray="6 4"/>';
  s+=_nfBox(70,392,150,38,C_GNB,'#f1f5f9','gNB','下一代基站',{as:14,fs:7,sw:1.5});
  s+=_t(440,404,'接入网 RAN · 2.0 中退居「透明数据管道」',{a:'middle',s:10,w:700,f:C_GNB});
  s+=_t(440,422,'转发 NAS / 承载数据，不解读核心网内容',{a:'middle',s:8.5,st:1,f:C_MUT});
  s+='</svg>';
  return _wrap(s,8);
}

/* ══════════════════════════════════════════════════════════
   S0.2 · SBA 服务化总线（带 REST 调用流动动画）
   ══════════════════════════════════════════════════════════ */
var _busPhase=0, _busTid=null;
function renderSBA(){
  var ctrl='<div class="ctrl-bar"><span style="font-size:11px;font-weight:700;color:'+C_SEC+';">SBA 服务化总线</span>'+
    '<button class="case-btn" id="busBtn" onclick="busStep()">▶ 播放一次 REST 调用</button>'+
    '<span style="font-size:10px;color:'+C_MUT+';">HTTP/2 · JSON · 服务发现(NRF)</span></div>';
  var s='<svg viewBox="0 0 720 412" width="100%" height="100%" style="display:block;">';
  s+=_bg('bg2')+_frame('bg2');
  s+='<defs>'+_mk('arBus',C_AMF)+'</defs>';
  s+=_t(360,36,'核心网内部 = 互相调 REST API',{a:'middle',s:14,w:800,f:C_AMFD});

  /* 四个 CP NF 挂在总线上 */
  var nfs=[
    ['AMF',C_AMF,C_AMFL,90],
    ['SMF',C_SMF,C_SMFL,250],
    ['AUSF',C_KEY,C_KEYL,410],
    ['UDM',C_KEY,C_KEYL,560]
  ];
  var busY=210;
  nfs.forEach(function(n){ s+=_nfBox(n[3],90,110,72,n[1],n[2],n[0],'',{as:17}); });

  /* 服务化总线（横向粗线） */
  s+='<rect x="50" y="'+(busY-4)+'" width="620" height="8" rx="4" fill="url(#busGrad)"/>';
  s+='<defs><linearGradient id="busGrad" x1="0" y1="0" x2="1" y2="0">'+
     '<stop offset="0" stop-color="'+C_AMF+'"/><stop offset="0.5" stop-color="'+C_SMF+'"/>'+
     '<stop offset="1" stop-color="'+C_KEY+'"/></linearGradient></defs>';
  s+=_t(360,busY+24,'SBA 服务化总线（Service-Based Bus）· HTTP/2 RESTful',{a:'middle',s:10,w:800,f:C_AMFD});
  /* NF 到总线的接入竖线 */
  nfs.forEach(function(n){ s+='<line x1="'+(n[3]+55)+'" y1="162" x2="'+(n[3]+55)+'" y2="'+(busY-4)+'" stroke="'+n[1]+'" stroke-width="1.8"/>'; });

  /* 流动的 REST 包（动画用，初始隐藏） */
  s+='<circle id="busPkt" cx="145" cy="'+busY+'" r="7" fill="'+C_ANS+'" opacity="0"/>';
  s+=_t(145,busY,'',{a:'middle',s:7,w:800,f:'#fff',id:'busPktT'});

  /* 服务名清单 */
  s+='<rect x="50" y="262" width="620" height="118" rx="10" fill="#fff" stroke="#ddd6fe" stroke-width="1.2"/>';
  var svcs=[
    ['Namf_Communication','AMF','代为下发 N1/N2 消息'],
    ['Nausf_UEAuthentication','AUSF','发起鉴权'],
    ['Nudm_UEAuthentication','UDM','取鉴权向量'],
    ['Nsmf_PDUSession','SMF','建 PDU 会话']
  ];
  s+=_t(64,280,'服务接口示例（按服务名调用，非点对点专线）：',{s:9.5,w:800,f:C_SEC});
  svcs.forEach(function(v,i){ var ry=298+i*19;
    s+=_t(72,ry,'• ',{s:9,w:800,f:C_AMF});
    s+=_t(82,ry,v[0],{s:9,w:800,f:C_AMFD});
    s+=_t(300,ry,'['+v[1]+']',{s:8.5,w:700,f:C_SMF});
    s+=_t(360,ry,'→ '+v[2],{s:8.5,f:C_SEC});
  });
  s+=_t(490,308,'对比 4G：',{s:9,w:800,f:C_RED});
  s+=_t(490,326,'MME↔HSS 用 Diameter',{s:8.5,f:C_SEC});
  s+=_t(490,342,'点对点专线·僵硬',{s:8.5,st:1,f:C_MUT});
  s+=_t(490,362,'5G = 微服务那一套',{s:8.5,w:700,f:C_ANS});
  s+='</svg>';
  return _wrapC(ctrl,s);
}
function busStep(){
  var pkt=document.getElementById('busPkt'), t=document.getElementById('busPktT');
  if(!pkt) return;
  /* AMF(145) → AUSF(465)：一次鉴权调用 */
  var x0=145, x1=465, dur=1400, t0=null;
  pkt.setAttribute('opacity','1');
  if(t){ t.textContent='REST'; }
  function step(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/dur);
    var x=x0+(x1-x0)*p;
    pkt.setAttribute('cx',x); if(t) t.setAttribute('x',x);
    if(p<1){ Engine.addTimer(requestAnimationFrame(step)); }
    else { pkt.setAttribute('opacity','0'); if(t)t.textContent='';
      Engine.LogEngine.inject('[SBA] AMF → Nausf_UEAuthentication(AUSF)：发起鉴权调用 (HTTP/2 200 OK)。'); }
  }
  Engine.addTimer(requestAnimationFrame(step));
}

/* ══════════════════════════════════════════════════════════
   S0.3 · 完整 5GC 拓扑 + N 接口 + 旅程路线
   ══════════════════════════════════════════════════════════ */
function renderTopo(){
  var s='<svg viewBox="0 0 720 452" width="100%" height="100%" style="display:block;">';
  s+=_bg('bg3')+_frame('bg3');
  s+='<defs>'+_mk('arN',C_SEC)+_mk('arU',C_UPF)+'</defs>';
  s+=_t(360,36,'5GC 全景拓扑 · 控制面信令 / 用户面数据流',{a:'middle',s:14,w:800,f:C_AMFD});

  /* 网元布局 */
  s+=_nfBox(40,150,86,60,C_GNB,C_GNBL,'gNB','',{as:14,sw:1.5});  /* RAN */
  s+=_nfBox(250,80,96,58,C_AMF,C_AMFL,'AMF','',{as:16});
  s+=_nfBox(250,180,96,58,C_SMF,C_SMFL,'SMF','',{as:16});
  s+=_nfBox(470,80,96,52,C_KEY,C_KEYL,'AUSF','',{as:14});
  s+=_nfBox(590,80,96,52,C_KEY,C_KEYL,'UDM','',{as:14});
  s+=_nfBox(250,300,96,58,C_UPF,C_UPFL,'UPF','',{as:16});
  s+=_nfBox(470,300,120,58,C_GNB,'#f8fafc','DN','数据网络',{as:15,fs:7,sw:1.5});

  /* —— 控制面接口（实线灰）—— */
  /* N2 gNB-AMF */
  s+=_iface(126,170,250,109,C_SEC,'N2',{m:'arN',lw:13,ls:8});
  /* N1 (逻辑) UE-AMF：标在 N2 旁，虚线说明逻辑穿透 */
  s+=_t(180,128,'N1(NAS 逻辑·穿 gNB)',{a:'middle',s:7.5,st:1,f:C_AMF});
  /* N11 AMF-SMF：SBA 下无点对点专线，由 Nsmf/Namf 服务调用实现 → 虚线 */
  s+=_iface(298,138,298,180,C_SEC,'N11',{m:'arN',m2:'arN',lw:15,ls:8,dash:'5 3',sw:1.5});
  s+=_t(330,159,'(SBA 承载)',{a:'middle',s:6.8,st:1,f:C_AMF});
  /* AMF-AUSF (SBA) */
  s+=_iface(346,106,470,106,C_KEY,'',{dash:'5 3',sw:1.5});
  s+=_t(408,96,'Nausf',{a:'middle',s:7.5,w:700,f:C_KEYD});
  /* AUSF-UDM (SBA) */
  s+=_iface(566,106,590,106,C_KEY,'',{dash:'5 3',sw:1.5});

  /* —— 用户面接口（navy 粗实线）—— */
  /* N3 gNB-UPF */
  s+=_iface(90,210,250,322,C_UPF,'N3',{m:'arU',lw:13,ls:8,sw:2.4});
  /* N4 SMF-UPF（控制配用户面，竖虚线） */
  s+=_iface(298,238,298,300,C_SMF,'N4',{m:'arN',lw:13,ls:8,dash:'4 3',sw:1.8});
  /* N6 UPF-DN */
  s+=_iface(346,329,470,329,C_UPF,'N6',{m:'arU',lw:13,ls:8,sw:2.4});

  /* SBA 总线提示条（顶部） */
  s+='<rect x="250" y="58" width="436" height="3" rx="1.5" fill="'+C_AMF+'" opacity="0.4"/>';
  s+=_t(468,50,'⟵ SBA 服务化总线（CP 内部 HTTP/2）⟶',{a:'middle',s:7.5,st:1,f:C_AMF});

  /* 越界黑盒标注 */
  s+='<rect x="470" y="300" width="120" height="58" rx="9" fill="none" stroke="'+C_RED+'" stroke-width="1.4" stroke-dasharray="4 3"/>';
  s+=_t(530,372,'N6 之后 = 黑盒(越界)',{a:'middle',s:8,st:1,f:C_RED});

  /* 旅程路线条 */
  s+='<rect x="34" y="396" width="652" height="44" rx="10" fill="#faf5ff" stroke="'+C_AMF+'" stroke-width="1.3"/>';
  var legs=['①NAS上行','②鉴权(空投K_gNB)','③NAS安全','④拿GUTI','⑤PDU会话','⑥QoS/DRB·出N6'];
  var lx=60;
  legs.forEach(function(l,i){
    var col=(i==1||i==5)?C_ANS:C_AMFD;
    s+=_t(lx,418,l,{s:8.4,w:(i==1||i==5)?800:600,f:col});
    lx+=((i==1)?118:(i==5?0:96));
    if(i<legs.length-1) s+=_t(lx-12,418,'›',{s:11,w:800,f:C_MUT});
  });
  s+='</svg>';
  return _wrap(s,8);
}

/* ══════════════════════════════════════════════════════════
   VIZ ROUTER + HOOKS
   ══════════════════════════════════════════════════════════ */
Engine.renderVizSVG = function(subIdx){
  if(subIdx===0) return renderOverview();
  if(subIdx===1) return renderNFRoster();
  if(subIdx===2) return renderSBA();
  if(subIdx===3) return renderTopo();
  return renderOverview();
};
Engine.onAfterRender = function(subIdx){
  /* S0.2 SBA：自动播放一次 REST 调用做引子 */
  if(subIdx===2){ Engine.addTimer(setTimeout(busStep, 600)); }
};
Engine.onStageExit = function(){
  if(_busTid){ clearTimeout(_busTid); _busTid=null; }
};
Engine.boot({ stageIdx: 0 });

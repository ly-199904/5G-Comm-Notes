  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" fill="'+cl+'" stroke="'+c+'" stroke-width="'+(o.sw||2)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';

/* S1.1 动画：信件沿三段折线行进，到 AMF 后「解封」，循环 */
var _relayRAF=null;
function relayAnim(){
  var pkt=document.getElementById('s11pkt'), glow=document.getElementById('s11glow');
  var op1=document.getElementById('s11open'), op2=document.getElementById('s11open2');
  if(!pkt) return;
  var pts=[[LANE.ue,180],[LANE.gnb,180],[LANE.gnb,300],[LANE.amf,300]];
  var segLen=[], total=0;
  for(var i=0;i<pts.length-1;i++){var dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1];var L=Math.hypot(dx,dy);segLen.push(L);total+=L;}
  var dur=3200, hold=1100, t0=null;
  function at(dist){
    var d=dist;
    for(var i=0;i<segLen.length;i++){
      if(d<=segLen[i]||i===segLen.length-1){
        var f=segLen[i]?d/segLen[i]:0;
        return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];
      }
      d-=segLen[i];
    }
    return pts[pts.length-1];
  }
  function frame(ts){
    if(!t0)t0=ts; var el=ts-t0;
    if(el<dur){
      var p=el/dur, pos=at(p*total);
      pkt.setAttribute('transform','translate('+pos[0]+','+pos[1]+')');
      glow.setAttribute('cx',pos[0]); glow.setAttribute('cy',pos[1]);
      glow.setAttribute('opacity', 0.18*Math.sin(p*Math.PI));
      if(op1){op1.setAttribute('opacity','0.25');op2.setAttribute('opacity','0.25');}
      _relayRAF=Engine.addTimer(requestAnimationFrame(frame));
    } else if(el<dur+hold){
      pkt.setAttribute('transform','translate('+LANE.amf+',300)');
      glow.setAttribute('opacity','0');
      if(op1){op1.setAttribute('opacity','1');op2.setAttribute('opacity','1');}
      _relayRAF=Engine.addTimer(requestAnimationFrame(frame));
    } else {
      Engine.LogEngine.inject('[NGAP] gNB → AMF：Initial UE Message（封装 NAS Registration Request），N2 送达。');
      Engine.LogEngine.inject('[5GMM] AMF 解封 N1 NAS PDU：Registration Request(type=initial)，N1 逻辑链路建立。');
      t0=null;
      _relayRAF=Engine.addTimer(requestAnimationFrame(frame));
    }
  }
  _relayRAF=Engine.addTimer(requestAnimationFrame(frame));
}

/* ══════════════════════════════════════════════════════════

Engine.renderVizSVG = function(subIdx){
  if(subIdx===0) return renderHandoff();
  if(subIdx===1) return renderRelay();
  if(subIdx===2) return renderSUCI();
  if(subIdx===3) return renderCatcher();
  return renderHandoff();
};
Engine.onAfterRender = function(subIdx){
  if(subIdx===1){ Engine.addTimer(setTimeout(relayAnim, 500)); }
  if(subIdx===2){
    /* 真名 / 隐藏标识就位（顶栏 SUCI 标签亮起）。只有「算出来」后才写——符合零先验。 */
    Engine.ctxSet('nas.supi', SUCI.supi);
    Engine.ctxSet('nas.suci', SUCI.nai);
  }
};
Engine.onStageExit = function(){
  if(_relayRAF){ cancelAnimationFrame(_relayRAF); _relayRAF=null; }
};
Engine.boot({ stageIdx: 1 });

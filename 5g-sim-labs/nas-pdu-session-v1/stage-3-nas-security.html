<script>
/* ═══════════════════════════════════════════════════════════
   Stage 3 · NAS 安全激活 · 4 sub-steps (0..3)
   配色（沿用 2.0 网元身份分色）：
     UE slate #334155 / gNB 灰 #94a3b8（透明管道·虚线）
     AMF 紫 #7c3aed（NAS 安全主角）/ 密钥金 #d97706
     答案绿 #059669（激活·同核恍然）/ 高光红 #dc2626（降级攻击·越界）
   物理诚实：NAS 算法 = 5G-IA/5G-EA（≠ AS 的 NIA/NEA，同核不同名）；
            NAS 与 AS 双层并存，密钥不同源（NAS←K_AMF / AS←K_gNB）。
   ctxSet 写点：nas.k_nas_int / nas.k_nas_enc（在 S3.1 SMP 完成回调里写，零先验）。
   ═══════════════════════════════════════════════════════════ */
var C_UE='#334155',  C_UED='#1e293b', C_UEL='#eef2f7',
    C_GNB='#94a3b8', C_GNBD='#64748b',C_GNBL='#e2e8f0',
    C_AMF='#7c3aed', C_AMFD='#5b21b6',C_AMFL='#ede9fe',
    C_KEY='#d97706', C_KEYD='#b45309',C_KEYL='#fff7ed',
    C_ANS='#059669', C_ANSL='#d1fae5',C_ANSD='#065f46',
    C_RED='#dc2626', C_REDL='#fee2e2',
    C_AMB='#f59e0b', C_AMBL='#fef3c7',
    C_SEC='#475569', C_MUT='#94a3b8';

/* ── 真实派生的 NAS 安全密钥（K_AMF → A.8，FC=0x69，128 LSB；可复现）── */
var NAS_SEC = {
  alg_int:'128-5G-IA2', alg_enc:'128-5G-EA2', alg_core:'AES', alg_id:'2',
  k_amf:'db53a94f…f683',
  k_nas_int:'a45af205…5bb5', k_nas_int_full:'a45af2051d9515569be4a666aa825bb5',
  k_nas_enc:'8707bda8…a6d4', k_nas_enc_full:'8707bda84deb623f4a60ea3e6407a6d4',
};

/* ── SVG 文本助手（与 S1 一致）── */
function _t(x,y,t,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" '+(o.a?'text-anchor="'+o.a+'" ':'')+
    'dominant-baseline="central" font-family="SF Mono,Consolas,monospace" '+
    'font-size="'+(o.s||10)+'" '+(o.w?'font-weight="'+o.w+'" ':'')+
    'fill="'+(o.f||'#1e293b')+'"'+(o.st?' font-style="italic"':'')+
    (o.id?' id="'+o.id+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'>'+t+'</text>';
}
function _mk(id,c){ return '<marker id="'+id+'" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+c+'"/></marker>'; }
function _bg(id){ return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="#faf8ff"/><stop offset="1" stop-color="#f1eefb"/></linearGradient></defs>'; }
function _frame(id){ return '<rect x="12" y="12" width="696" height="456" rx="14" fill="url(#'+id+')" stroke="#ddd6fe" stroke-width="1.5"/>'; }
function _wrap(s,pt){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:'+(pt||6)+'px;">'+s+'</div>'; }

/* 网元盒（母版，与 S1 一致）：x,y 左上角 */
function _nfBox(x,y,w,h,c,cl,abbr,full,o){ o=o||{};
  var s='';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" fill="'+cl+'" stroke="'+c+'" stroke-width="'+(o.sw||2)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="6" rx="3" fill="'+c+'"'+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  s+=_t(x+w/2, y+h/2-6, abbr, {a:'middle',s:(o.as||16),w:800,f:c});
  if(full) s+=_t(x+w/2, y+h/2+11, full, {a:'middle',s:(o.fs||7.5),f:C_SEC});
  return s;
}
/* 接口箭头：线 + 可选标签盒（与 S1 一致）*/
function _iface(x1,y1,x2,y2,c,label,o){ o=o||{};
  var dash=o.dash?' stroke-dasharray="'+o.dash+'"':'';
  var s='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(o.sw||1.8)+'"'+dash+
        (o.m?' marker-end="url(#'+o.m+')"':'')+(o.m2?' marker-start="url(#'+o.m2+')"':'')+'/>';
  if(label){ var mx=(x1+x2)/2, my=(y1+y2)/2;
    s+='<rect x="'+(mx-(o.lw||20))+'" y="'+(my-8)+'" width="'+((o.lw||20)*2)+'" height="16" rx="4" fill="#fff" stroke="'+c+'" stroke-width="1" opacity="0.96"/>';
    s+=_t(mx, my, label, {a:'middle',s:(o.ls||8.5),w:800,f:c});
  }
  return s;
}
/* 密钥小钥匙图元（金，可加 transform）*/
function _keyChip(x,y,label,c){
  c=c||C_KEY;
  var g='<g transform="translate('+x+','+y+')">';
  g+='<circle cx="-7" cy="0" r="5.5" fill="none" stroke="'+c+'" stroke-width="2"/>';
  g+='<line x1="-2" y1="0" x2="9" y2="0" stroke="'+c+'" stroke-width="2"/>';
  g+='<line x1="6" y1="0" x2="6" y2="4" stroke="'+c+'" stroke-width="2"/>';
  g+='<line x1="9" y1="0" x2="9" y2="4" stroke="'+c+'" stroke-width="2"/>';
  g+='</g>';
  if(label) g+=_t(x+18,y,label,{s:8.5,w:800,f:c});
  return g;
}
function _nasActivated(){ return !!(window.NR_CTX&&window.NR_CTX.nas&&window.NR_CTX.nas.k_nas_int); }

/* ══════════════════════════════════════════════════════════
   S3.0 · 鉴权 ≠ 加密：SMC 是「点火」开关
   ══════════════════════════════════════════════════════════ */
function renderIgnite(){
  var s='<svg viewBox="0 0 720 480" width="100%" height="100%" style="display:block;">';
  s+=_bg('bgI')+_frame('bgI');
  s+='<defs>'+_mk('arIg',C_AMF)+'</defs>';
  s+=_t(360,38,'鉴权 ≠ 加密：NAS 安全靠 SMC「点火」激活',{a:'middle',s:15,w:800,f:C_AMFD});

  /* —— Row1 左：S2 交付的原料 —— */
  s+='<rect x="40" y="58" width="304" height="88" rx="10" fill="'+C_KEYL+'" stroke="'+C_KEY+'" stroke-width="1.5"/>';
  s+=_t(56,74,'S2 鉴权交付了什么',{s:10,w:800,f:C_KEYD});
  s+=_keyChip(64,98,'K_AMF（及整棵密钥树）',C_KEY);
  s+=_t(56,118,'双方各自长出同一棵树 = 安全「原料」就位',{s:8.4,f:C_SEC});
  s+=_t(56,133,'但原料 ≠ 启用：此刻 NAS 仍未加密 / 未完保',{s:8.4,w:700,f:C_RED});

  /* —— Row1 右：不激活的风险 —— */
  s+='<rect x="360" y="58" width="320" height="88" rx="10" fill="'+C_REDL+'" stroke="'+C_RED+'" stroke-width="1.5"/>';
  s+=_t(376,74,'若不激活就放行后续注册',{s:10,w:800,f:C_RED});
  s+=_t(376,96,'• 后续 NAS（PDU 会话、5G-GUTI 分配…）明文可被窃听',{s:8.4,f:C_SEC});
  s+=_t(376,112,'• 可被篡改 / 注入伪造信令',{s:8.4,f:C_SEC});
  s+=_t(376,131,'⇒ 必须先用 SMC 把 NAS 安全「点火」',{s:8.8,w:800,f:C_RED});

  /* —— Row2：点火时间轴（核心）—— */
  s+=_t(360,166,'NAS 消息时间轴：一个开关，分出「裸跑」与「受保护」两段',{a:'middle',s:10,w:700,f:C_AMFD});

  /* 左：未保护期（amber）*/
  s+='<rect x="48" y="182" width="278" height="130" rx="10" fill="'+C_AMBL+'" stroke="'+C_AMB+'" stroke-width="1.5"/>';
  s+=_t(187,198,'未保护期（鉴权阶段）',{a:'middle',s:9.5,w:800,f:'#92400e'});
  var msgsL=['Registration Request','Authentication Request','Authentication Response'];
  msgsL.forEach(function(m,i){
    var yy=220+i*26;
    s+='<rect x="64" y="'+(yy-9)+'" width="246" height="18" rx="4" fill="#fff" stroke="'+C_AMB+'" stroke-width="1"/>';
    s+=_t(74,yy,m,{s:8,f:C_SEC});
    s+=_t(300,yy,'…',{a:'middle',s:9,f:C_AMB});
  });
  s+=_t(187,303,'明文裸跑（首条 Reg Request 完保可选）',{a:'middle',s:7.6,st:1,f:'#92400e'});

  /* 中：点火开关（紫）*/
  s+='<rect x="334" y="200" width="52" height="96" rx="10" fill="'+C_AMF+'" stroke="'+C_AMFD+'" stroke-width="2"/>';
  s+=_t(360,222,'NAS',{a:'middle',s:9,w:800,f:'#fff'});
  s+=_t(360,236,'SMC',{a:'middle',s:11,w:800,f:'#fff'});
  s+=_t(360,262,'⚡',{a:'middle',s:18});
  s+=_t(360,282,'点火',{a:'middle',s:9,w:800,f:'#fff'});
  /* OFF→ON 跨越箭头 */
  s+=_iface(326,192,394,192,C_ANS,'',{m:'arIg',sw:2.2});
  s+=_t(360,184,'OFF → ON',{a:'middle',s:7.6,w:800,f:C_ANSD});

  /* 右：受保护期（green）*/
  s+='<rect x="394" y="182" width="278" height="130" rx="10" fill="#f0fdf4" stroke="'+C_ANS+'" stroke-width="1.5"/>';
  s+=_t(533,198,'受保护期（激活之后）',{a:'middle',s:9.5,w:800,f:C_ANSD});
  var msgsR=['Security Mode Complete','Registration Accept','PDU Session Estab. …'];
  msgsR.forEach(function(m,i){
    var yy=220+i*26;
    s+='<rect x="410" y="'+(yy-9)+'" width="246" height="18" rx="4" fill="#fff" stroke="'+C_ANS+'" stroke-width="1"/>';
    s+=_t(420,yy,m,{s:8,f:C_ANSD});
    s+=_t(646,yy,'🔒',{a:'middle',s:9});
  });
  s+=_t(533,303,'完整性保护 + 加密（K_NASint / K_NASenc）',{a:'middle',s:7.6,w:700,f:C_ANSD});

  s+=_t(360,326,'时间 →',{a:'middle',s:8,st:1,f:C_MUT});

  /* —— Row3：结论条 —— */
  s+='<rect x="40" y="344" width="640" height="116" rx="11" fill="#faf5ff" stroke="'+C_AMF+'" stroke-width="1.4"/>';
  s+=_t(58,364,'核心直觉：',{s:11,w:800,f:C_AMFD});
  s+=_t(58,384,'鉴权产出密钥「原料」（K_AMF），SMC 是把它「点火启用」的开关——选算法、派生 K_NAS*、开启保护。',{s:9,f:C_SEC});
  s+=_t(58,403,'微妙之处：SMC 这条下行消息本身已被完整性保护（用刚派生的 K_NASint），但暂不加密——',{s:9,f:C_SEC});
  s+=_t(58,420,'因为 UE 必须先「明文读懂」里面选了哪套算法，才能派生出同一把加密钥。',{s:9,w:700,f:C_AMFD});
  s+='<line x1="58" y1="433" x2="662" y2="433" stroke="#ece6fb" stroke-width="1"/>';
  s+=_t(58,447,'从 UE 回的 Security Mode Complete 起，NAS 信令全程完保 + 加密。下一步看这一来一回。',{s:8.8,st:1,f:C_AMFD});
  s+='</svg>';
  return _wrap(s,8);
}

/* ══════════════════════════════════════════════════════════
   S3.1 · NAS SMC / SMP 双消息握手（泳道 + 动画）
   ══════════════════════════════════════════════════════════ */
var LANE={ ue:150, gnb:360, amf:575 };
function renderSMC(){
  var act=_nasActivated();
  var s='<svg viewBox="0 0 720 480" width="100%" height="100%" style="display:block;">';
  s+=_bg('bgM')+_frame('bgM');
  s+='<defs>'+_mk('arDl',C_AMF)+_mk('arUl',C_ANS)+'</defs>';
  s+=_t(360,34,'NAS 安全模式握手：SMC ↓ 完保先行，SMP ↑ 加密随后',{a:'middle',s:13.5,w:800,f:C_AMFD});

  /* N1 逻辑弧（穿 gNB 透明转发） */
  s+='<path d="M'+LANE.ue+' 62 C '+LANE.ue+' 44, '+LANE.amf+' 44, '+LANE.amf+' 62" fill="none" stroke="'+C_AMF+'" stroke-width="1.4" stroke-dasharray="5 4"/>';
  s+='<rect x="288" y="46" width="144" height="15" rx="7" fill="#faf5ff" stroke="'+C_AMF+'" stroke-width="1"/>';
  s+=_t(360,53,'N1 · NAS（逻辑·穿 gNB）',{a:'middle',s:8,w:800,f:C_AMF});

  /* 泳道头 + 生命线 */
  var heads=[
    [LANE.ue, C_UE,  C_UEL, 'UE','终端', null],
    [LANE.gnb,C_GNBD,C_GNBL,'gNB','透明转发','7 4'],
    [LANE.amf,C_AMFD,C_AMFL,'AMF','NAS 安全端点', null]
  ];
  heads.forEach(function(h){
    s+=_nfBox(h[0]-54,64,108,40,h[1],h[2],h[3],h[4],{as:14,fs:7,sw:1.8,dash:h[5]});
    s+='<line x1="'+h[0]+'" y1="104" x2="'+h[0]+'" y2="346" stroke="'+h[1]+'" stroke-width="1.1" stroke-dasharray="4 5" opacity="0.5"/>';
  });

  /* ① SMC 下行（AMF → UE）：完保未加密（虚线紫）*/
  s+=_t(360,126,'① NAS Security Mode Command',{a:'middle',s:9.5,w:800,f:C_AMF});
  s+=_iface(LANE.amf,142,LANE.ue,142,C_AMF,'',{m:'arDl',sw:1.8,dash:'6 4'});
  s+=_t(360,160,'仅完整性保护（K_NASint）· 暂不加密 ⟦ UE 需先读懂所选算法 ⟧',{a:'middle',s:7.8,w:700,f:C_AMFD});
  s+=_t(360,174,'携带：selected '+NAS_SEC.alg_int+'/'+NAS_SEC.alg_enc+' · ngKSI · replayed UE security capabilities',{a:'middle',s:7.4,f:C_SEC});

  /* UE 处理框（左）*/
  s+='<rect x="40" y="190" width="252" height="100" rx="9" fill="#fff" stroke="'+C_UE+'" stroke-width="1.4"/>';
  s+=_t(52,205,'UE 收到 SMC 后（USIM/ME 内）：',{s:8.8,w:800,f:C_UED});
  s+=_t(52,224,'① 核对 replayed 安全能力 == 自己当初发的？',{s:8,w:700,f:C_RED});
  s+=_t(64,238,'→ 防降级攻击 bidding-down',{s:7.4,st:1,f:C_RED});
  s+=_t(52,256,'② K_NASint + 下行 NAS COUNT 验 NAS-MAC（抗重放）',{s:7.4,f:C_SEC});
  s+=_t(52,274,'③ 派生 K_NASint / K_NASenc（绑算法 ID）',{s:8,w:700,f:C_KEYD});

  /* gNB 透明说明（中）*/
  s+='<rect x="300" y="190" width="120" height="100" rx="9" fill="#fff" stroke="'+C_GNBD+'" stroke-width="1.2" stroke-dasharray="4 3"/>';
  s+=_t(360,210,'gNB 透明转发',{a:'middle',s:8.4,w:800,f:C_GNBD});
  s+=_t(360,228,'NAS 对它仍是',{a:'middle',s:7.6,f:C_SEC});
  s+=_t(360,242,'不透明黑盒',{a:'middle',s:7.6,st:1,f:C_GNBD});
  s+='<line x1="312" y1="254" x2="408" y2="254" stroke="'+C_GNBL+'" stroke-width="1"/>';
  s+=_t(360,270,'只在 RRC↔NGAP',{a:'middle',s:7.2,f:C_MUT});
  s+=_t(360,282,'之间搬运',{a:'middle',s:7.2,f:C_MUT});

  /* ② SMP 上行（UE → AMF）：完保 + 加密（实线绿）*/
  s+=_t(360,306,'② NAS Security Mode Complete',{a:'middle',s:9.5,w:800,f:C_ANSD});
  s+=_iface(LANE.ue,322,LANE.amf,322,C_ANS,'',{m:'arUl',sw:2});
  s+=_t(360,340,'完整性保护 + 加密 🔒（首条加密 NAS 消息 · IMEISV 设备串码在此密文回传）',{a:'middle',s:7.7,w:700,f:C_ANSD});

  /* 动画令牌（SMC 半透明信封 / SMP 实心锁）+ 光晕 */
  s+='<circle id="m31glow" cx="'+LANE.amf+'" cy="142" r="16" fill="'+C_AMF+'" opacity="0"/>';
  s+='<g id="m31smc" transform="translate('+LANE.amf+',142)" opacity="'+(act?0:1)+'">';
  s+='<rect x="-15" y="-10" width="30" height="20" rx="3" fill="#fff" stroke="'+C_AMF+'" stroke-width="1.6" stroke-dasharray="3 2"/>';
  s+='<path d="M-15 -8 L0 3 L15 -8" fill="none" stroke="'+C_AMF+'" stroke-width="1.3"/>';
  s+=_t(0,-4,'SMC',{a:'middle',s:6,w:800,f:C_AMF})+'</g>';
  s+='<g id="m31smp" transform="translate('+LANE.ue+',322)" opacity="0">';
  s+='<rect x="-15" y="-10" width="30" height="20" rx="3" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="1.6"/>';
  s+=_t(0,-3,'🔒',{a:'middle',s:9})+'</g>';

  /* 激活横幅 */
  var bf=act?C_ANS:C_MUT, bbg=act?'#f0fdf4':'#f8fafc', btxt=act?'NAS 安全上下文已激活 ✓':'NAS 安全上下文：未激活';
  s+='<rect id="m31banner" x="40" y="350" width="640" height="26" rx="8" fill="'+bbg+'" stroke="'+bf+'" stroke-width="1.4"'+(act?'':' stroke-dasharray="5 4"')+'/>';
  s+=_t(360,363,btxt,{a:'middle',s:9.5,w:800,f:bf,id:'m31bt'});

  /* 诚实条 */
  s+='<rect x="40" y="380" width="640" height="84" rx="11" fill="#fff7ed" stroke="'+C_KEY+'" stroke-width="1.3"/>';
  s+=_t(58,396,'物理诚实：',{s:9.5,w:800,f:C_KEYD});
  s+=_t(130,396,'SMC 下行「先完保、暂不加密」——UE 须先明文读出所选算法才能派生密钥；SMP 起上行才同时加密。',{s:8.3,f:C_SEC});
  s+=_t(58,416,'防降级（bidding-down）：AMF 回放它收到的 UE 安全能力，UE 比对——中间人若删强算法，此处即被发现。',{s:8.3,f:C_SEC});
  s+=_t(58,436,'【隐私升级】网络查设备串码 IMEISV 只能在 SMC 里问，UE 塞进首条加密的 SMP 回——5G 杜绝 IMEI 明文泄露！',{s:8.3,w:700,f:C_ANSD});
  s+=_t(58,456,'真实派生：K_NASint='+NAS_SEC.k_nas_int+' / K_NASenc='+NAS_SEC.k_nas_enc+'（源 K_AMF，TS 33.501 A.8，FC=0x69）。',{s:8.3,w:700,f:C_KEYD});
  s+='</svg>';
  return _wrap(s,8);
}

/* S3.1 动画：SMC↓（半透明）→ UE 处理 → SMP↑（实心锁）→ 激活写 ctx，单次播放 */
var _smcRAF=null;
function smcAnim(){
  if(_nasActivated()) return;               /* 已激活则静态展示，不再播放 */
  var smc=document.getElementById('m31smc'), smp=document.getElementById('m31smp'),
      glow=document.getElementById('m31glow'), bt=document.getElementById('m31bt'),
      banner=document.getElementById('m31banner');
  if(!smc) return;
  var t0=null;
  var D1=2000, H1=1100, D2=2000, H2=900;    /* SMC↓ / UE处理 / SMP↑ / 激活 */
  function lerp(a,b,f){ return a+(b-a)*f; }
  function frame(ts){
    if(_nasActivated()) return;             /* 防御：被外部激活则停 */
    if(!t0)t0=ts; var el=ts-t0;
    if(el<D1){                              /* SMC 下行：AMF → UE */
      var f=el/D1, x=lerp(LANE.amf,LANE.ue,f);
      smc.setAttribute('transform','translate('+x+',142)');
      glow.setAttribute('cx',x); glow.setAttribute('opacity',0.16*Math.sin(f*Math.PI));
      smp.setAttribute('opacity','0');
    } else if(el<D1+H1){                     /* UE 处理停顿 */
      smc.setAttribute('transform','translate('+LANE.ue+',142)');
      glow.setAttribute('opacity','0');
    } else if(el<D1+H1+D2){                  /* SMP 上行：UE → AMF */
      var f2=(el-D1-H1)/D2, x2=lerp(LANE.ue,LANE.amf,f2);
      smc.setAttribute('opacity','0');
      smp.setAttribute('opacity','1');
      smp.setAttribute('transform','translate('+x2+',322)');
      glow.setAttribute('cx',x2); glow.setAttribute('cy',322);
      glow.setAttribute('opacity',0.16*Math.sin(f2*Math.PI));
    } else if(el<D1+H1+D2+H2){               /* 到达 AMF，激活 */
      smp.setAttribute('transform','translate('+LANE.amf+',322)');
      glow.setAttribute('opacity','0');
      if(banner){ banner.setAttribute('stroke',C_ANS); banner.setAttribute('fill','#f0fdf4'); banner.removeAttribute('stroke-dasharray'); }
      if(bt){ bt.setAttribute('fill',C_ANS); bt.textContent='NAS 安全上下文已激活 ✓'; }
    } else {                                 /* 激活：写 ctx（算出/激活才写，零先验）*/
      Engine.LogEngine.inject('[5GMM] UE → AMF：Security Mode Complete（完保 + 加密）。NAS 安全上下文激活。');
      Engine.LogEngine.inject('[KEY] NAS 密钥就位：K_NASint='+NAS_SEC.k_nas_int+' / K_NASenc='+NAS_SEC.k_nas_enc+'。');
      Engine.ctxSet('nas.k_nas_enc', NAS_SEC.k_nas_enc_full);
      Engine.ctxSet('nas.k_nas_int', NAS_SEC.k_nas_int_full);  /* 触发重渲染为「已激活」静态态，动画收尾 */
      return;                                /* 不再排帧 */
    }
    _smcRAF=Engine.addTimer(requestAnimationFrame(frame));
  }
  _smcRAF=Engine.addTimer(requestAnimationFrame(frame));
}

  s+='<circle cx="360" cy="112" r="9" fill="#fff" stroke="'+C_AMF+'" stroke-width="1.4"/>';

  ];
  var wx=48;
  why.forEach(function(w){
    s+='<rect x="'+wx+'" y="284" width="200" height="74" rx="9" fill="'+w[3]+'" stroke="'+w[2]+'" stroke-width="1.4"/>';

   VIZ ROUTER + HOOKS

Engine.renderVizSVG = function(subIdx){
  if(subIdx===0) return renderIgnite();
  if(subIdx===1) return renderSMC();
  if(subIdx===2) return renderNaming();
  if(subIdx===3) return renderDualLayer();
  return renderIgnite();
};
Engine.onAfterRender = function(subIdx){
  if(subIdx===1 && !_nasActivated()){ Engine.addTimer(setTimeout(smcAnim, 500)); }
};
Engine.onStageExit = function(){
  if(_smcRAF){ cancelAnimationFrame(_smcRAF); _smcRAF=null; }
};
Engine.boot({ stageIdx: 3 });

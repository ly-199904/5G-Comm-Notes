<script>
/* ═══════════════════════════════════════════════════════════
   Stage 4 · 注册完成 & 5G-GUTI · 4 sub-steps (0..3)
   配色（沿用 2.0 网元身份分色，本 Stage 主题=注册完成里程碑）：
     UE slate #334155 / gNB 灰 #94a3b8（透明管道·虚线）
     AMF 紫 #7c3aed（注册主角·分配 GUTI）/ 身份金 #d97706（SUCI/ECIES）
     答案绿 #059669（REGISTERED 里程碑 · GUTI 安全临时身份）/ 高光红 #dc2626（SUPI 暴露/越界）
   物理诚实：5G-GUTI 是临时身份（注册后 AMF 分配，可周期/事件重分配 → unlinkability）；
            5G-S-TMSI（SetID+Pointer+5G-TMSI=48bit）是空口寻呼用的压缩形，缝合回 1.0 AS 层；
            Registration Complete 仅在分配了新 5G-GUTI（等 IE）时才必须回。
   ctxSet 写点：nas.reg_state / nas.guti（在 S4.1 regAnim 完成回调里写，零先验；guti 点亮顶栏）。
   ═══════════════════════════════════════════════════════════ */
var C_UE='#334155',  C_UED='#1e293b', C_UEL='#eef2f7',
    C_GNB='#94a3b8', C_GNBD='#64748b',C_GNBL='#e2e8f0',
    C_AMF='#7c3aed', C_AMFD='#5b21b6',C_AMFL='#ede9fe',
    C_KEY='#d97706', C_KEYD='#b45309',C_KEYL='#fff7ed',
    C_ANS='#059669', C_ANSL='#d1fae5',C_ANSD='#065f46',
    C_RED='#dc2626', C_REDL='#fee2e2',
    C_SEC='#475569', C_MUT='#94a3b8';

/* ── 本沙盘 5G-GUTI（TS 23.003 §2.10；与 S1/S2 的 MCC=460/MNC=01 一致）── */
var GUTI = {
  mcc:'460', mnc:'01',
  region:'0xCA',   /* AMF Region ID  · 8 bit */
  setid:'0x0A1',   /* AMF Set ID     · 10 bit */
  pointer:'0x01',  /* AMF Pointer    · 6 bit */
  tmsi:'8A3F1C20', /* 5G-TMSI        · 32 bit（顶栏 token / 轮换的临时身份）*/
  guami:'460-01-0xCA-0x0A1-0x01',
};

/* ── SVG 文本助手（与 S3 一致）── */
function _t(x,y,t,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" '+(o.a?'text-anchor="'+o.a+'" ':'')+
    'dominant-baseline="central" font-family="SF Mono,Consolas,monospace" '+
    'font-size="'+(o.s||10)+'" '+(o.w?'font-weight="'+o.w+'" ':'')+
    'fill="'+(o.f||'#1e293b')+'"'+(o.st?' font-style="italic"':'')+
    (o.id?' id="'+o.id+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'>'+t+'</text>';
}
function _mk(id,c){ return '<marker id="'+id+'" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+c+'"/></marker>'; }
function _bg(id){ return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="#f5fbf8"/><stop offset="1" stop-color="#ebf6f0"/></linearGradient></defs>'; }
function _frame(id){ return '<rect x="12" y="12" width="696" height="456" rx="14" fill="url(#'+id+')" stroke="#a7f3d0" stroke-width="1.5"/>'; }
function _wrap(s,pt){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:'+(pt||6)+'px;">'+s+'</div>'; }

/* 网元盒（母版，与 S3 一致）：x,y 左上角 */
function _nfBox(x,y,w,h,c,cl,abbr,full,o){ o=o||{};
  var s='';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" fill="'+cl+'" stroke="'+c+'" stroke-width="'+(o.sw||2)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="6" rx="3" fill="'+c+'"'+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  s+=_t(x+w/2, y+h/2-6, abbr, {a:'middle',s:(o.as||16),w:800,f:c});
  if(full) s+=_t(x+w/2, y+h/2+11, full, {a:'middle',s:(o.fs||7.5),f:C_SEC});
  return s;
}
/* 接口箭头：线 + 可选标签盒（与 S3 一致）*/
function _iface(x1,y1,x2,y2,c,label,o){ o=o||{};
  var dash=o.dash?' stroke-dasharray="'+o.dash+'"':'';
  var s='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(o.sw||1.8)+'"'+dash+
        (o.m?' marker-end="url(#'+o.m+')"':'')+(o.m2?' marker-start="url(#'+o.m2+')"':'')+'/>';
  if(label){ var mx=(x1+x2)/2, my=(y1+y2)/2;
    s+='<rect x="'+(mx-(o.lw||20))+'" y="'+(my-8)+'" width="'+((o.lw||20)*2)+'" height="16" rx="4" fill="#fff" stroke="'+c+'" stroke-width="1" opacity="0.96"/>';
    s+=_t(mx, my, label, {a:'middle',s:(o.ls||8.5),w:800,f:c});
  }
  return s;
}
/* 身份令牌图元（小卡片+图标）*/
function _idChip(x,y,w,h,c,cl,name,sub){
  var s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" fill="'+cl+'" stroke="'+c+'" stroke-width="1.6"/>';
  s+=_t(x+w/2,y+18,name,{a:'middle',s:11,w:800,f:c});
  if(sub) s+=_t(x+w/2,y+34,sub,{a:'middle',s:7.6,f:C_SEC});
  return s;
}
function _registered(){ return !!(window.NR_CTX&&window.NR_CTX.nas&&window.NR_CTX.nas.guti); }

/* ══════════════════════════════════════════════════════════
   S4.0 · 安全已激活：AMF 为注册收尾（探讨）
   ══════════════════════════════════════════════════════════ */
function renderWrapup(){
  var s='<svg viewBox="0 0 720 480" width="100%" height="100%" style="display:block;">';
  s+=_bg('bgW')+_frame('bgW');
  s+='<defs>'+_mk('arW',C_AMF)+_mk('arWg',C_ANS)+'</defs>';
  s+=_t(360,36,'安全已激活：AMF 为注册收尾，分配身份与定时器',{a:'middle',s:14.5,w:800,f:C_AMFD});

  /* —— 5GMM 状态机旅程（头条视觉）—— */
  s+=_t(360,60,'5GMM 状态机：一路从 DEREGISTERED 走到 REGISTERED',{a:'middle',s:9.5,w:700,f:C_SEC});
  var st=[
    [60,  '5GMM-DEREGISTERED','起点（未注册）',  C_MUT, '#f8fafc'],
    [296, '5GMM-REGISTERED-INITIATED','鉴权 / NAS 安全进行中', C_AMF, C_AMFL],
    [532, '5GMM-REGISTERED','注册完成 ✓', C_ANS, C_ANSL]
  ];
  st.forEach(function(b,i){
    s+='<rect x="'+b[0]+'" y="78" width="128" height="46" rx="9" fill="'+b[4]+'" stroke="'+b[3]+'" stroke-width="1.8"/>';
    s+=_t(b[0]+64,95,b[1],{a:'middle',s:7.8,w:800,f:b[3]});
    s+=_t(b[0]+64,112,b[2],{a:'middle',s:7.4,f:C_SEC});
  });
  /* 转移箭头 + 触发标签 */
  s+=_iface(188,101,296,101,C_AMF,'',{m:'arW',sw:1.8});
  s+=_t(242,90,'S1 Reg Request',{a:'middle',s:6.8,w:700,f:C_AMF});
  s+=_iface(424,101,532,101,C_ANS,'',{m:'arWg',sw:1.8});
  s+=_t(478,90,'S2 AKA · S3 SMC',{a:'middle',s:6.8,w:700,f:C_ANSD});

  /* —— Registration Accept 携带什么（中央信封）—— */
  s+=_t(360,148,'本步：AMF 下发 Registration Accept（受 S3 已激活的 NAS 安全保护 🔒）',{a:'middle',s:10,w:700,f:C_AMFD});

  s+='<rect x="46" y="166" width="628" height="118" rx="11" fill="#fff" stroke="'+C_AMF+'" stroke-width="1.6"/>';
  s+='<rect x="46" y="166" width="628" height="6" rx="3" fill="'+C_AMF+'"/>';
  s+=_t(64,186,'Registration Accept（AMF → UE，完保 + 加密）携带：',{s:9.5,w:800,f:C_AMFD});
  var carry=[
    ['5G-GUTI','网络分配的临时身份（替代 SUCI）', C_ANS, C_ANSL],
    ['TAI List','注册区域：区内移动免重注册', C_AMF, C_AMFL],
    ['T3512 等定时器','周期注册 / 可达性维持', C_KEY, C_KEYL],
    ['Allowed NSSAI','允许的切片（S5 路由用）', C_GNBD, C_GNBL]
  ];
  carry.forEach(function(c,i){
    var cx=60+i*154;
    s+='<rect x="'+cx+'" y="202" width="142" height="64" rx="8" fill="'+c[3]+'" stroke="'+c[2]+'" stroke-width="1.3"/>';
    s+=_t(cx+71,220,c[0],{a:'middle',s:9,w:800,f:c[2]});
    s+='<line x1="'+(cx+12)+'" y1="232" x2="'+(cx+130)+'" y2="232" stroke="#fff" stroke-width="1"/>';
    s+=_t(cx+71,248,c[1].slice(0,12),{a:'middle',s:6.8,f:C_SEC});
    if(c[1].length>12) s+=_t(cx+71,258,c[1].slice(12),{a:'middle',s:6.8,f:C_SEC});
  });

  /* —— 回执：Registration Complete —— */
  s+='<rect x="46" y="296" width="628" height="40" rx="10" fill="'+C_UEL+'" stroke="'+C_UE+'" stroke-width="1.4"/>';
  s+=_t(64,310,'UE 回执：',{s:9.5,w:800,f:C_UED});
  s+=_t(132,310,'Registration Complete（UE → AMF）——确认收到并存好新分配的 5G-GUTI。',{s:8.6,f:C_SEC});
  s+=_t(64,326,'物理诚实：仅当 Accept 分配了新 5G-GUTI（等 IE）时，UE 才必须回这条 Complete。',{s:8,st:1,w:700,f:C_RED});

  /* —— 结论绿条 —— */
  s+='<rect x="40" y="348" width="640" height="56" rx="11" fill="#f0fdf4" stroke="'+C_ANS+'" stroke-width="1.4"/>';
  s+=_t(58,366,'核心直觉：',{s:10.5,w:800,f:C_ANSD});
  s+=_t(58,384,'鉴权（S2）+ 安全激活（S3）之后，AMF 才放心把注册「盖章生效」——下发受保护的 Accept、',{s:8.8,f:C_SEC});
  s+=_t(58,398,'分配临时身份 5G-GUTI、配置定时器；UE 进入 5GMM-REGISTERED。这是「能上网」前的最后一道登记。',{s:8.8,w:700,f:C_ANSD});

  /* —— 越界灰标 —— */
  s+='<rect x="40" y="412" width="640" height="50" rx="10" fill="#f8fafc" stroke="'+C_MUT+'" stroke-width="1.2" stroke-dasharray="5 4"/>';
  s+=_t(58,430,'越界（黑盒，不展开）：',{s:9,w:800,f:C_MUT});
  s+=_t(208,430,'AMF 重选 / 负载均衡、去注册（De-registration）、紧急注册等流程属移动性管理细节。',{s:8,f:C_SEC});
  s+=_t(58,450,'本步聚焦 Initial Registration 的收尾：Registration Accept / Complete + 5G-GUTI 分配 + 定时器。',{s:8,st:1,f:C_AMFD});
  s+='</svg>';
  return _wrap(s,6);
}

/* ══════════════════════════════════════════════════════════
   S4.1 · Registration Accept / Complete 握手（泳道 + 动画 · 里程碑）
   ══════════════════════════════════════════════════════════ */
var LANE={ ue:150, gnb:360, amf:575 };
function renderRegFlow(){
  var act=_registered();
  var s='<svg viewBox="0 0 720 480" width="100%" height="100%" style="display:block;">';
  s+=_bg('bgR')+_frame('bgR');
  s+='<defs>'+_mk('arDn',C_ANS)+_mk('arUp',C_UE)+'</defs>';
  s+=_t(360,34,'注册收尾握手：Accept ↓ 携 5G-GUTI，Complete ↑ 回执',{a:'middle',s:13.5,w:800,f:C_AMFD});

  /* N1 逻辑弧（穿 gNB 透明转发） */
  s+='<path d="M'+LANE.ue+' 62 C '+LANE.ue+' 44, '+LANE.amf+' 44, '+LANE.amf+' 62" fill="none" stroke="'+C_AMF+'" stroke-width="1.4" stroke-dasharray="5 4"/>';
  s+='<rect x="288" y="46" width="144" height="15" rx="7" fill="#f0fdf4" stroke="'+C_AMF+'" stroke-width="1"/>';
  s+=_t(360,53,'N1 · NAS（逻辑·穿 gNB · 受保护🔒）',{a:'middle',s:7.6,w:800,f:C_AMF});

  /* 泳道头 + 生命线 */
  var heads=[
    [LANE.ue, C_UE,  C_UEL, 'UE','终端', null],
    [LANE.gnb,C_GNBD,C_GNBL,'gNB','透明转发','7 4'],
    [LANE.amf,C_AMFD,C_AMFL,'AMF','NAS 安全端点', null]
  ];
  heads.forEach(function(h){
    s+=_nfBox(h[0]-54,64,108,40,h[1],h[2],h[3],h[4],{as:14,fs:7,sw:1.8,dash:h[5]});
    s+='<line x1="'+h[0]+'" y1="104" x2="'+h[0]+'" y2="346" stroke="'+h[1]+'" stroke-width="1.1" stroke-dasharray="4 5" opacity="0.5"/>';
  });

  /* ① Registration Accept 下行（AMF → UE）：完保 + 加密（实线绿）*/
  s+=_t(360,126,'① Registration Accept 🔒',{a:'middle',s:9.5,w:800,f:C_ANSD});
  s+=_iface(LANE.amf,142,LANE.ue,142,C_ANS,'',{m:'arDn',sw:2});
  s+=_t(360,160,'完保 + 加密（NAS 安全已激活）· 携：5G-GUTI · TAI List · T3512 · Allowed NSSAI',{a:'middle',s:7.6,w:700,f:C_ANSD});

  /* UE 处理框（左）*/
  s+='<rect x="40" y="178" width="252" height="104" rx="9" fill="#fff" stroke="'+C_UE+'" stroke-width="1.4"/>';
  s+=_t(52,194,'UE 收到 Registration Accept 后：',{s:8.8,w:800,f:C_UED});
  s+=_t(52,213,'① 解密 / 验完保（K_NAS* · 来自 S3）',{s:8,f:C_SEC});
  s+=_t(52,231,'② 存储 5G-GUTI（后续用它替代 SUCI）',{s:8,w:700,f:C_ANSD});
  s+=_t(52,249,'③ 按 T3512 配置周期注册定时器',{s:8,f:C_KEYD});
  s+=_t(52,267,'④ 进入 5GMM-REGISTERED 状态',{s:8,w:700,f:C_AMFD});

  /* gNB 透明说明（中）*/
  s+='<rect x="300" y="178" width="120" height="104" rx="9" fill="#fff" stroke="'+C_GNBD+'" stroke-width="1.2" stroke-dasharray="4 3"/>';
  s+=_t(360,198,'gNB 透明转发',{a:'middle',s:8.4,w:800,f:C_GNBD});
  s+=_t(360,217,'NAS 受保护',{a:'middle',s:7.6,f:C_SEC});
  s+=_t(360,231,'gNB 看不到',{a:'middle',s:7.6,st:1,f:C_GNBD});
  s+=_t(360,245,'GUTI 内容',{a:'middle',s:7.6,st:1,f:C_GNBD});
  s+='<line x1="312" y1="258" x2="408" y2="258" stroke="'+C_GNBL+'" stroke-width="1"/>';
  s+=_t(360,272,'仅 RRC↔NGAP 搬运',{a:'middle',s:7,f:C_MUT});

  /* UE 状态徽（右）*/
  s+='<rect x="428" y="178" width="252" height="104" rx="9" fill="'+C_AMFL+'" stroke="'+C_AMF+'" stroke-width="1.4"/>';
  s+=_t(440,194,'AMF 侧：注册登记',{s:8.8,w:800,f:C_AMFD});
  s+=_t(440,213,'• 绑定 SUPI ↔ 新分配的 5G-GUTI',{s:8,f:C_SEC});
  s+=_t(440,231,'• 记录 UE 注册区域（TAI List）',{s:8,f:C_SEC});
  s+=_t(440,249,'• 启动 Mobile Reachable 定时器',{s:8,f:C_SEC});
  s+=_t(440,267,'• 5GMM 上下文：REGISTERED',{s:8,w:700,f:C_AMFD});

  /* ② Registration Complete 上行（UE → AMF）：回执（实线 slate）*/
  s+=_t(360,300,'② Registration Complete',{a:'middle',s:9.5,w:800,f:C_UED});
  s+=_iface(LANE.ue,316,LANE.amf,316,C_UE,'',{m:'arUp',sw:1.8});
  s+=_t(360,334,'回执：确认已收到并存好新 5G-GUTI（分配新 GUTI 时必须回）',{a:'middle',s:7.6,w:700,f:C_UED});

  /* 动画令牌（Accept 绿锁信封 ↓ / Complete slate 回执 ↑）+ 光晕 */
  s+='<circle id="m41glow" cx="'+LANE.amf+'" cy="142" r="16" fill="'+C_ANS+'" opacity="0"/>';
  s+='<g id="m41acc" transform="translate('+LANE.amf+',142)" opacity="'+(act?0:1)+'">';
  s+='<rect x="-17" y="-11" width="34" height="22" rx="3" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="1.6"/>';
  s+=_t(0,-3,'🔒',{a:'middle',s:9})+'</g>';
  s+='<g id="m41cmp" transform="translate('+LANE.ue+',316)" opacity="0">';
  s+='<rect x="-15" y="-10" width="30" height="20" rx="3" fill="#fff" stroke="'+C_UE+'" stroke-width="1.6"/>';
  s+=_t(0,-3,'✓',{a:'middle',s:11,w:800,f:C_UED})+'</g>';

  /* 激活横幅（注册完成里程碑）*/
  var bf=act?C_ANS:C_MUT, bbg=act?'#f0fdf4':'#f8fafc',
      btxt=act?'5GMM-REGISTERED ✓ · 5G-GUTI '+GUTI.tmsi+' 已分配':'5GMM 状态：REGISTERED-INITIATED（等待 Accept）';
  s+='<rect id="m41banner" x="40" y="346" width="640" height="26" rx="8" fill="'+bbg+'" stroke="'+bf+'" stroke-width="1.4"'+(act?'':' stroke-dasharray="5 4"')+'/>';
  s+=_t(360,359,btxt,{a:'middle',s:9.5,w:800,f:bf,id:'m41bt'});

  /* 诚实条 */
  s+='<rect x="40" y="376" width="640" height="86" rx="11" fill="#f0fdf4" stroke="'+C_ANS+'" stroke-width="1.3"/>';
  s+=_t(58,392,'里程碑：',{s:9.5,w:800,f:C_ANSD});
  s+=_t(120,392,'UE 现在是 5GMM-REGISTERED——核心网正式「认识并接纳」了它，但还没有 PDU 会话（仍上不了网）。',{s:8.3,f:C_SEC});
  s+=_t(58,412,'身份轮换：从此 UE 用临时的 5G-GUTI 替代 SUCI，进一步减少永久/隐藏身份的暴露（下一步细说）。',{s:8.3,f:C_SEC});
  s+=_t(58,432,'物理诚实：Registration Complete 是条件性回执——仅在 Accept 分配了新 5G-GUTI（等 IE）时才必须回。',{s:8.3,w:700,f:C_RED});
  s+=_t(58,452,'承接 S3：Accept / Complete 全程受 NAS 安全保护（K_NASint/enc，gNB 透明转发看不到内容）。',{s:8.3,w:700,f:C_ANSD});
  s+='</svg>';
  return _wrap(s,8);
}

/* S4.1 动画：Accept↓（绿锁）→ UE 处理 → Complete↑（回执）→ 完成写 ctx，单次播放 */
var _regRAF=null;
function regAnim(){
  if(_registered()) return;                  /* 已注册则静态展示，不再播放 */
  var acc=document.getElementById('m41acc'), cmp=document.getElementById('m41cmp'),
      glow=document.getElementById('m41glow'), bt=document.getElementById('m41bt'),
      banner=document.getElementById('m41banner');
  if(!acc) return;
  var t0=null;
  var D1=2000, H1=1200, D2=1800, H2=900;     /* Accept↓ / UE处理 / Complete↑ / 登记 */
  function lerp(a,b,f){ return a+(b-a)*f; }
  function frame(ts){
    if(_registered()) return;                /* 防御：被外部写入则停 */
    if(!t0)t0=ts; var el=ts-t0;
    if(el<D1){                               /* Accept 下行：AMF → UE */
      var f=el/D1, x=lerp(LANE.amf,LANE.ue,f);
      acc.setAttribute('transform','translate('+x+',142)');
      glow.setAttribute('cx',x); glow.setAttribute('cy',142);
      glow.setAttribute('opacity',0.18*Math.sin(f*Math.PI));
      cmp.setAttribute('opacity','0');
    } else if(el<D1+H1){                      /* UE 处理停顿 */
      acc.setAttribute('transform','translate('+LANE.ue+',142)');
      glow.setAttribute('opacity','0');
    } else if(el<D1+H1+D2){                   /* Complete 上行：UE → AMF */
      var f2=(el-D1-H1)/D2, x2=lerp(LANE.ue,LANE.amf,f2);
      acc.setAttribute('opacity','0');
      cmp.setAttribute('opacity','1');
      cmp.setAttribute('transform','translate('+x2+',316)');
      glow.setAttribute('cx',x2); glow.setAttribute('cy',316);
      glow.setAttribute('opacity',0.18*Math.sin(f2*Math.PI));
    } else if(el<D1+H1+D2+H2){                /* 到达 AMF，登记完成 */
      cmp.setAttribute('transform','translate('+LANE.amf+',316)');
      glow.setAttribute('opacity','0');
      if(banner){ banner.setAttribute('stroke',C_ANS); banner.setAttribute('fill','#f0fdf4'); banner.removeAttribute('stroke-dasharray'); }
      if(bt){ bt.setAttribute('fill',C_ANS); bt.textContent='5GMM-REGISTERED ✓ · 5G-GUTI '+GUTI.tmsi+' 已分配'; }
    } else {                                  /* 完成：写 ctx（分配/登记才写，零先验）*/
      Engine.LogEngine.inject('[5GMM] AMF → UE：Registration Accept（完保+加密，携 5G-GUTI / TAI List / T3512）。');
      Engine.LogEngine.inject('[5GMM] UE → AMF：Registration Complete。注册完成，进入 5GMM-REGISTERED。');
      Engine.LogEngine.inject('[ID] 5G-GUTI 已分配：GUAMI='+GUTI.guami+' · 5G-TMSI=0x'+GUTI.tmsi+'。后续以 GUTI 替代 SUCI。');
      Engine.ctxSet('nas.reg_state', 'REGISTERED');
      Engine.ctxSet('nas.guti', GUTI.tmsi);  /* 触发重渲染为「已注册」静态态 + 点亮顶栏 GUTI */
      return;                                 /* 不再排帧 */
    }
    _regRAF=Engine.addTimer(requestAnimationFrame(frame));
  }
  _regRAF=Engine.addTimer(requestAnimationFrame(frame));
}

};

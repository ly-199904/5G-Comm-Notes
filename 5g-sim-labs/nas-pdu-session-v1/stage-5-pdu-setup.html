/* ═══════════════════════════════════════════════════════════

   配色（网元身份分色，本 Stage 主题=会话建立·CUPS 登场）：

     答案绿 #059669（UE IP 分配 · 会话建立里程碑）/ 高光红 #dc2626（越界·上不了网告警）
   物理诚实：5GSM 捎带在 5GMM（AMF 不读 5GSM，呼应 S1 gNB 不读 NAS）；
            N11 是服务化 Nsmf_PDUSession（HTTP/2，非 Diameter）；
            CP/UP 分离——SMF 经 N4/PFCP 远程编程 UPF；UE IP 由 SMF 分配；
            N3 隧道 S5 仅配 UPF 端点，gNB 端 + 空口 DRB 留给 S6（缝合点）。
   ctxSet 写点：nas.pdu_sessions(push) / nas._pdu_ip（在 S5.1 pduAnim 完成回调里写，零先验；_pdu_ip 点亮顶栏 PDU）。

/* ── 本沙盘 PDU 会话实例（与 S1/S2 的 PLMN=460/01 一致；数值经 pdu_s5.py 校验）── */
var PDU = {

/* ── SVG 文本助手（与 S3/S4 一致）── */
function _t(x,y,t,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" '+(o.a?'text-anchor="'+o.a+'" ':'')+
    'dominant-baseline="central" font-family="SF Mono,Consolas,monospace" '+
    'font-size="'+(o.s||10)+'" '+(o.w?'font-weight="'+o.w+'" ':'')+
    'fill="'+(o.f||'#1e293b')+'"'+(o.st?' font-style="italic"':'')+
    (o.id?' id="'+o.id+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'>'+t+'</text>';
}
function _mk(id,c){ return '<marker id="'+id+'" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+c+'"/></marker>'; }
function _bg(id){ return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="#f0fbfd"/><stop offset="1" stop-color="#e3f5f9"/></linearGradient></defs>'; }
function _frame(id){ return '<rect x="12" y="12" width="696" height="456" rx="14" fill="url(#'+id+')" stroke="#a5e8f0" stroke-width="1.5"/>'; }
function _wrap(s,pt){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:'+(pt||6)+'px;">'+s+'</div>'; }

/* 网元盒（母版，与 S3/S4 一致）：x,y 左上角 */
function _nfBox(x,y,w,h,c,cl,abbr,full,o){ o=o||{};
  var s='';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" fill="'+cl+'" stroke="'+c+'" stroke-width="'+(o.sw||2)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="6" rx="3" fill="'+c+'"'+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  s+=_t(x+w/2, y+h/2-6, abbr, {a:'middle',s:(o.as||16),w:800,f:c});
  if(full) s+=_t(x+w/2, y+h/2+11, full, {a:'middle',s:(o.fs||7.5),f:C_SEC});
  return s;
}
/* 接口箭头：线 + 可选标签盒（与 S3/S4 一致）*/
function _iface(x1,y1,x2,y2,c,label,o){ o=o||{};
  var dash=o.dash?' stroke-dasharray="'+o.dash+'"':'';
  var s='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(o.sw||1.8)+'"'+dash+
        (o.m?' marker-end="url(#'+o.m+')"':'')+(o.m2?' marker-start="url(#'+o.m2+')"':'')+'/>';
  if(label){ var mx=(x1+x2)/2, my=(y1+y2)/2;
    s+='<rect x="'+(mx-(o.lw||20))+'" y="'+(my-8)+'" width="'+((o.lw||20)*2)+'" height="16" rx="4" fill="#fff" stroke="'+c+'" stroke-width="1" opacity="0.96"/>';
    s+=_t(mx, my, label, {a:'middle',s:(o.ls||8.5),w:800,f:c});
  }
  return s;
}
function _pduDone(){ return !!(window.NR_CTX&&window.NR_CTX.nas&&window.NR_CTX.nas._pdu_ip); }

    s+=_t(p[0]+46,189,p[3],{a:'middle',s:12,w:800,f:p[1]});
    s+=_t(p[0]+46,204,p[4],{a:'middle',s:6.8,f:C_SEC});

  /* 管段：空口(虚·S6) / N3(虚·S6) / N6(实·navy) */

  s+=_t(163,184,'空口',{a:'middle',s:6.4,f:C_MUT});
  s+=_iface(278,194,324,194,C_UPFD,'',{sw:2,dash:'4 3'});

  s+='<rect x="566" y="174" width="110" height="40" rx="8" fill="#f0fdf4" stroke="'+C_ANS+'" stroke-width="1.3"/>';
  s+=_t(621,189,'拿到 IP 才有路',{a:'middle',s:7.6,w:800,f:C_ANSD});
  s+=_t(621,204,'本沙盘终点=N6',{a:'middle',s:6.6,st:1,f:C_SEC});

  /* —— 下区：建立请求四要素 —— */
  s+=_t(360,234,'PDU Session Establishment Request 的四个关键要素',{a:'middle',s:10,w:800,f:C_SMFD});
  var four=[
    ['DNN','internet','连哪个数据网络', C_SMF, C_SMFL],

  s+=_nfBox(70,348,128,38,C_SMFD,C_SMFL,'SMF','会话大脑·控制',{as:13,fs:7,sw:1.6});
  s+=_iface(198,367,300,367,C_UPF,'N4/PFCP',{m:'arCn',m2:'arCn',sw:2,lw:30,ls:7.5});

}

/* ══════════════════════════════════════════════════════════
   S5.1 · PDU 会话建立主流程（五泳道 + 动画 · 里程碑）
   ══════════════════════════════════════════════════════════ */
var LANE={ ue:86, gnb:222, amf:358, smf:494, upf:630 };
/* 六段：[x1,x2,y,color,marker,iface,msg] */
var FLOW=[
  [LANE.ue, LANE.amf, 126, C_AMF, 'arFa', 'N1🔒', '① PDU Est. Request（穿 gNB）'],
  [LANE.amf,LANE.smf, 162, C_SMF, 'arFs', 'N11',  '③ CreateSMContext'],
  [LANE.smf,LANE.upf, 198, C_UPF, 'arFu', 'N4',   '④ PFCP Session Est.'],
  [LANE.upf,LANE.smf, 234, C_UPF, 'arFu', 'N4',   '④ PFCP Resp（N3 TEID）'],
  [LANE.smf,LANE.amf, 270, C_SMF, 'arFs', 'N11',  '⑤ N1N2MsgTransfer'],
  [LANE.ue, LANE.amf, 306, C_ANS, 'arFg', 'N1🔒', '⑥ Est. Accept（UE IP）']  /* 注：AMF→UE，动画里反向 */
];
function renderFlow(){
  var done=_pduDone();
  var s='<svg viewBox="0 0 720 480" width="100%" height="100%" style="display:block;">';
  s+=_bg('bgF')+_frame('bgF');
  s+='<defs>'+_mk('arFa',C_AMF)+_mk('arFs',C_SMF)+_mk('arFu',C_UPF)+_mk('arFg',C_ANS)+'</defs>';
  s+=_t(360,32,'PDU 会话建立全流程：从捎带请求到拿 IP（五泳道接力）',{a:'middle',s:13.5,w:800,f:C_SMFD});

  /* 泳道头 + 生命线 */
  var heads=[
    [LANE.ue, C_UE,  C_UEL, 'UE','终端', null],
    [LANE.gnb,C_GNBD,C_GNBL,'gNB','透明转发','7 4'],
    [LANE.amf,C_AMFD,C_AMFL,'AMF','转发邮局', null],
    [LANE.smf,C_SMFD,C_SMFL,'SMF','会话大脑', null],
    [LANE.upf,C_UPFD,C_UPFL,'UPF','用户面', null]
  ];
  heads.forEach(function(h){
    s+=_nfBox(h[0]-50,52,100,38,h[1],h[2],h[3],h[4],{as:13,fs:6.6,sw:1.7,dash:h[5]});
    s+='<line x1="'+h[0]+'" y1="90" x2="'+h[0]+'" y2="322" stroke="'+h[1]+'" stroke-width="1.1" stroke-dasharray="4 5" opacity="0.5"/>';
  });
  /* AMF→SMF 服务化总线提示（N11 非 Diameter）*/
  s+=_t((LANE.amf+LANE.smf)/2,102,'N11 = 服务化（HTTP/2 RESTful，非 Diameter）',{a:'middle',s:6.6,st:1,f:C_SMFD});

  /* 六段消息箭头（pending 时半透明）*/
  FLOW.forEach(function(g,i){
    var x1=g[0], x2=g[1], rev=(i===5);          /* seg6 实际方向 AMF→UE */
    var ax1=rev?x2:x1, ax2=rev?x1:x2;
    var op=done?1:0.22;
    s+='<g id="fseg'+i+'" opacity="'+op+'">';
    s+=_iface(ax1,g[2],ax2,g[2],g[3],'',{m:g[4],sw:2});
    /* 接口小盒在中点 */
    var mx=(x1+x2)/2;
    s+='<rect x="'+(mx-19)+'" y="'+(g[2]-8)+'" width="38" height="15" rx="4" fill="#fff" stroke="'+g[3]+'" stroke-width="1" opacity="0.97"/>';
    s+=_t(mx,g[2]-0.5,g[5],{a:'middle',s:7.4,w:800,f:g[3]});
    /* 消息名：跨 gNB 两段(①⑥)左对齐，中间四段居中 */
    var lx, la;
    if(i===0||i===5){ lx=LANE.ue+8; la=null; } else { lx=(x1+x2)/2; la='middle'; }
    s+=_t(lx,g[2]-13,g[6],{a:la,s:6.6,w:700,f:g[3]});
    s+='</g>';
  });
  /* gNB 透传标记（seg1 / seg6 经过 gNB）*/
  s+=_t(LANE.gnb,126-22,'(透传)',{a:'middle',s:6.2,st:1,f:C_GNBD});
  s+=_t(LANE.gnb,306+18,'(透传)',{a:'middle',s:6.2,st:1,f:C_GNBD});

  /* ② AMF 选 SMF 决策标注（置于 gNB–AMF 间隙，避开 seg2 标签与 N11 提示）*/
  var _dcx=290;
  s+='<rect x="'+(_dcx-50)+'" y="142" width="100" height="14" rx="4" fill="'+C_AMFL+'" stroke="'+C_AMF+'" stroke-width="0.9"/>';
  s+=_t(_dcx,149,'② 按 DNN+S-NSSAI 选 SMF',{a:'middle',s:5.8,w:700,f:C_AMFD});

  /* 动画令牌（光晕 + 信封）*/
  s+='<circle id="fglow" cx="'+LANE.ue+'" cy="126" r="15" fill="'+C_SMF+'" opacity="0"/>';
  s+='<g id="ftok" transform="translate('+LANE.ue+',126)" opacity="'+(done?0:1)+'">';
  s+='<rect x="-16" y="-10" width="32" height="20" rx="3" fill="'+C_SMFL+'" stroke="'+C_SMFD+'" stroke-width="1.6"/>';
  s+=_t(0,-1.5,'✉',{a:'middle',s:11,id:'ftokg'})+'</g>';

  /* UE IP 结果牌（完成点亮）*/

  s+='<rect id="fipbox" x="40" y="328" width="640" height="26" rx="8" fill="'+(ipShown?'#f0fdf4':'#f8fafc')+'" stroke="'+(ipShown?C_ANS:C_MUT)+'" stroke-width="1.4"'+(ipShown?'':' stroke-dasharray="5 4"')+'/>';
  s+=_t(360,341,ipShown?('PDU 会话 #'+PDU.id+' 建立 ✓ · UE IP '+PDU.ueip+' 已分配 · DNN='+PDU.dnn+' · S-NSSAI='+PDU.snssai):'PDU 会话建立中… 控制面接力进行',
        {a:'middle',s:9.5,w:800,f:(ipShown?C_ANSD:C_MUT),id:'fipt'});

  /* 诚实条 */

  s+=_t(58,377,'捎带 &amp; 分层透明：',{s:9.2,w:800,f:C_SMFD});
  s+=_t(176,377,'5GSM 的 Request 封在 5GMM 容器里。AMF 只读外层（PDU ID/S-NSSAI/DNN）选 SMF，不读内层 5GSM。',{s:7.8,f:C_SEC});
  s+=_t(58,395,'N11 是服务化：',{s:9.2,w:800,f:C_SMFD});
  s+=_t(170,395,'AMF 找 SMF 走 Nsmf_PDUSession（HTTP/2 RESTful），不是 4G 的 GTP-C/Diameter 专线。',{s:7.8,f:C_SEC});
  s+=_t(58,413,'本步产出：',{s:9.2,w:800,f:C_ANSD});

/* S5.1 动画：令牌沿六段接力，逐段点亮；完成写 ctx，单次播放 */
var _fRAF=null;
function pduAnim(){
  if(_pduDone()) return;
  var tok=document.getElementById('ftok'), glow=document.getElementById('fglow'),
      tg=document.getElementById('ftokg');
  if(!tok) return;
  var GLY=['✉','⚙','⚙','✓','✉','IP'];      /* 各段令牌图标 */
  var SEGD=900, HOLD=380;                     /* 每段移动 / 段间停顿 */
  var t0=null, seg=0;
  function lerp(a,b,f){ return a+(b-a)*f; }
  function lit(i){ var g=document.getElementById('fseg'+i); if(g)g.setAttribute('opacity','1'); }
  function frame(ts){
    if(_pduDone()) return;
    if(!t0)t0=ts; var el=ts-t0;
    var cyc=SEGD+HOLD, idx=Math.floor(el/cyc);
    if(idx>5){                                 /* 全部六段完成：写 ctx（零先验）*/
      var sess={ id:PDU.id, dnn:PDU.dnn, snssai:PDU.snssai, type:PDU.type, ssc:PDU.ssc,
                 ue_ip:PDU.ueip, qos_flows:[{qfi:PDU.qfi, fiveqi:PDU.fiveqi}], drb_id:null };
      var arr=(window.NR_CTX&&window.NR_CTX.nas&&window.NR_CTX.nas.pdu_sessions)?window.NR_CTX.nas.pdu_sessions.slice():[];
      arr.push(sess);
      Engine.LogEngine.inject('[N11] AMF → SMF：Nsmf_PDUSession_CreateSMContext（DNN='+PDU.dnn+', S-NSSAI='+PDU.snssai+'）。');
      Engine.LogEngine.inject('[N4/PFCP] SMF ↔ UPF：装隧道——下发 PDR/FAR/QER/URR，回上行 N3 TEID='+PDU.teid+'。');
      Engine.LogEngine.inject('[5GSM] AMF → UE：PDU Session Est. Accept。UE IP='+PDU.ueip+'（IPv4, SSC mode '+PDU.ssc+'）已分配。');
      Engine.ctxSet('nas.pdu_sessions', arr);
      Engine.ctxSet('nas._pdu_ip', PDU.ueip);   /* 点亮顶栏 PDU + 触发重渲染为已完成静态态 */
      return;
    }
    /* 段内进度 */
    var inSeg=el-idx*cyc;
    var g=FLOW[idx], rev=(idx===5);
    var sx=rev?g[1]:g[0], ex=rev?g[0]:g[1];     /* seg6 AMF→UE 反向 */
    if(seg!==idx){ for(var k=0;k<idx;k++) lit(k); seg=idx; if(tg)tg.textContent=GLY[idx]; }
    if(inSeg<SEGD){
      var f=inSeg/SEGD, x=lerp(sx,ex,f);
      tok.setAttribute('opacity','1');
      tok.setAttribute('transform','translate('+x+','+g[2]+')');
      glow.setAttribute('cx',x); glow.setAttribute('cy',g[2]);
      glow.setAttribute('fill', g[3]);
      glow.setAttribute('opacity',0.20*Math.sin(f*Math.PI));
    } else {
      tok.setAttribute('transform','translate('+ex+','+g[2]+')');
      glow.setAttribute('opacity','0');
      lit(idx);
    }
    _fRAF=Engine.addTimer(requestAnimationFrame(frame));
  }
  _fRAF=Engine.addTimer(requestAnimationFrame(frame));
}

/* ═══════════════════════════════════════════════════════════
   Stage 6 · QoS 与 DRB 落地（UP · 终点）· 4 sub-steps (0..3)
   配色（网元身份分色，本 Stage 主题=用户面点亮·SDAP 登场·回 AS 层）：
     UE slate #334155 / gNB 深灰 #64748b（S6 重新成为主角：建 DRB）
     AMF 紫 #7c3aed（退为 NGAP 转发）/ SMF 青蓝 #0891b2（核心 QoS Flow）
     UPF navy #1e3a8a（用户面主角 · SDAP/DRB/数据流同 navy 家族）
     答案绿 #059669（DRB 建成 · 首包出 N6 · 还债点睛，稀缺）/ 高光红 #dc2626（之前上不了网/边界，稀缺）
     身份金 #d97706（极客提示：Reflective QoS / SDAP header，少量）
   物理诚实：① QoS Flow(核心网粒度) ≠ DRB(空口粒度)，SDAP 做 QFI→DRB 映射(踩坑#16)；
            ② SDAP 是 5G AS 层新增 L2 顶层(4G EPS Bearer 一管到底)；
            ③ RRCReconfiguration 是 2.0 唯一一次回 1.0 AS 层；S5 的 NAS Accept(含IP) 搭它一起送达 UE；
            ④ gNB 经 Resp 回填 N3 TEID → SMF 经 N4 改 FAR → N3 双向打通；
            ⑤ 首包出 N6 = 还清 1.0「CONNECTED≠能上网」债；N6 之后黑盒(踩坑#17)。
   ctxSet 写点：nas._drb_id(=1，点亮顶栏 DRB#) + 回填 nas.pdu_sessions[0].drb_id，
            均在 S6.1 drbAnim 六段全部完成回调里写（DRB 建好才存在，零先验·踩坑#33）。
   ═══════════════════════════════════════════════════════════ */
var C_UE='#334155',  C_UED='#1e293b', C_UEL='#eef2f7',
    C_GNB='#94a3b8', C_GNBD='#64748b',C_GNBL='#e2e8f0',
    C_AMF='#7c3aed', C_AMFD='#5b21b6',C_AMFL='#ede9fe',
    C_SMF='#0891b2', C_SMFD='#0e7490',C_SMFL='#cffafe',
    C_UPF='#1e3a8a', C_UPFD='#172554',C_UPFL='#dbeafe',
    C_KEY='#d97706', C_KEYD='#b45309',C_KEYL='#fff7ed',
    C_ANS='#059669', C_ANSL='#d1fae5',C_ANSD='#065f46',
    C_RED='#dc2626', C_REDL='#fee2e2',
    C_SEC='#475569', C_MUT='#94a3b8';

/* ── 本沙盘 QoS/DRB 实例（承接 S5：PLMN 460/01；数值经 pdu_s6.py 校验）── */
var QOS = {
  pduId:5, qfi:1, fiveqi:9, arp:9, drbId:1,
  ueip:'10.45.0.2', dnn:'internet', snssai:'SST1 (eMBB)', type:'IPv4', ssc:1,
  gnbTeid:'0x00C81001', gnbN3:'172.16.10.7',
  upfTeid:'0x0A4D0001', upfN3:'172.16.20.5',
};

/* ── SVG 文本助手（与 S3/S4/S5 一致）── */
function _t(x,y,t,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" '+(o.a?'text-anchor="'+o.a+'" ':'')+
    'dominant-baseline="central" font-family="SF Mono,Consolas,monospace" '+
    'font-size="'+(o.s||10)+'" '+(o.w?'font-weight="'+o.w+'" ':'')+
    'fill="'+(o.f||'#1e293b')+'"'+(o.st?' font-style="italic"':'')+
    (o.id?' id="'+o.id+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'>'+t+'</text>';
}
function _mk(id,c){ return '<marker id="'+id+'" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+c+'"/></marker>'; }
function _bg(id){ return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="#f4f7fd"/><stop offset="1" stop-color="#e9eef9"/></linearGradient></defs>'; }
function _frame(id){ return '<rect x="12" y="12" width="696" height="456" rx="14" fill="url(#'+id+')" stroke="#c2d2ef" stroke-width="1.5"/>'; }
function _wrap(s,pt){ return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:'+(pt||6)+'px;">'+s+'</div>'; }

/* 网元盒（母版，与 S3/S4/S5 一致）：x,y 左上角 */
function _nfBox(x,y,w,h,c,cl,abbr,full,o){ o=o||{};
  var s='';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" fill="'+cl+'" stroke="'+c+'" stroke-width="'+(o.sw||2)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="6" rx="3" fill="'+c+'"'+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';
  s+=_t(x+w/2, y+h/2-6, abbr, {a:'middle',s:(o.as||16),w:800,f:c});
  if(full) s+=_t(x+w/2, y+h/2+11, full, {a:'middle',s:(o.fs||7.5),f:C_SEC});
  return s;
}
/* 接口箭头：线 + 可选标签盒（与 S3/S4/S5 一致）*/
function _iface(x1,y1,x2,y2,c,label,o){ o=o||{};
  var dash=o.dash?' stroke-dasharray="'+o.dash+'"':'';
  var s='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(o.sw||1.8)+'"'+dash+
        (o.m?' marker-end="url(#'+o.m+')"':'')+(o.m2?' marker-start="url(#'+o.m2+')"':'')+'/>';
  if(label){ var mx=(x1+x2)/2, my=(y1+y2)/2;
    s+='<rect x="'+(mx-(o.lw||20))+'" y="'+(my-8)+'" width="'+((o.lw||20)*2)+'" height="16" rx="4" fill="#fff" stroke="'+c+'" stroke-width="1" opacity="0.96"/>';
    s+=_t(mx, my, label, {a:'middle',s:(o.ls||8.5),w:800,f:c});
  }
  return s;
}
function _drbDone(){ return !!(window.NR_CTX&&window.NR_CTX.nas&&window.NR_CTX.nas._drb_id); }

/* ══════════════════════════════════════════════════════════
   S6.0 · 两级 QoS 模型 + SDAP 登场（探讨·概念图）
   ══════════════════════════════════════════════════════════ */

  s+=_bg('bgC')+_frame('bgC');
  s+='<defs>'+_mk('arC4',C_GNBD)+_mk('arCq',C_SMF)+_mk('arCd',C_UPF)+'</defs>';
  s+=_t(360,34,'最后一公里：4G 一根管子 → 5G 两级 QoS，SDAP 当「分拣员」',{a:'middle',s:13.5,w:800,f:C_UPFD});

  /* —— 上区：4G vs 5G 对比 —— */
  s+=_t(360,58,'同一件事（保障数据 QoS），4G 与 5G 的做法不同',{a:'middle',s:9.2,w:700,f:C_SEC});
  /* 4G 卡（左·一管到底）*/

  s+=_t(196,150,'QoS 绑死在「承载」上：一条承载从 UE 一路到网关，',{a:'middle',s:6.8,f:C_SEC});
  s+=_t(196,161,'空口与核心网用同一粒度——粗、不灵活。',{a:'middle',s:6.8,st:1,f:C_MUT});
  /* 5G 卡（右·两级）*/
  s+='<rect x="368" y="72" width="312" height="96" rx="11" fill="'+C_UPFL+'" stroke="'+C_UPF+'" stroke-width="1.4"/>';
  s+=_t(524,88,'5G NR：QoS Flow + DRB 两级（SDAP 接缝）',{a:'middle',s:9.5,w:800,f:C_UPFD});
  s+=_nfBox(384,104,52,30,C_UE,C_UEL,'UE','',{as:11,sw:1.3});
  s+=_iface(436,119,500,119,C_UPF,'DRB',{m:'arCd',sw:2.2,lw:18,ls:7.5});
  s+=_nfBox(500,104,52,30,C_GNBD,C_GNBL,'gNB','',{as:10,sw:1.3});
  s+=_iface(552,119,616,119,C_SMF,'QoS Flow',{m:'arCq',sw:2.2,lw:30,ls:6.8});
  s+=_nfBox(616,104,52,30,C_UPFD,C_UPFL,'UPF','',{as:10,sw:1.3});
  s+=_t(524,150,'空口用 DRB（navy）· 核心网用 QoS Flow（青蓝），',{a:'middle',s:6.8,f:C_SEC});
  s+=_t(524,161,'两级各自精细；衔接处的「分拣」交给新角色 SDAP。',{a:'middle',s:6.8,w:700,f:C_UPFD});

  /* —— 中区：SDAP 分拣台（5G 新增 · 本屏核心概念）—— */
  s+=_t(360,188,'SDAP（5G 新增 · AS 层 L2 顶层）：把核心网的 QoS Flow 分拣进空口的 DRB',{a:'middle',s:10,w:800,f:C_UPFD});
  s+='<rect x="40" y="200" width="640" height="150" rx="12" fill="#fff" stroke="'+C_UPF+'" stroke-width="1.5"/>';
  /* 左：进来的 QoS Flow（核心网侧，来自 N3）*/
  s+=_t(120,216,'核心网侧（来自 N3）',{a:'middle',s:7.4,w:700,f:C_SMFD});
  var flows=[
    [228,'QoS Flow · QFI=1',C_SMF,C_SMFL,1],
    [262,'QoS Flow · QFI=5',C_MUT,'#f1f5f9',0],
    [296,'QoS Flow · QFI=9',C_MUT,'#f1f5f9',0]
  ];
  flows.forEach(function(f){
    s+='<rect x="54" y="'+f[0]+'" width="132" height="26" rx="6" fill="'+f[3]+'" stroke="'+f[2]+'" stroke-width="1.3"'+(f[4]?'':' stroke-dasharray="4 3"')+'/>';
    s+=_t(120,f[0]+13,f[1],{a:'middle',s:7.6,w:(f[4]?800:600),f:f[2]});
    s+=_iface(186,f[0]+13,278,283,f[2],'',{sw:(f[4]?1.8:1.2),dash:(f[4]?'':'3 3')});
  });
  s+=_t(120,332,'（QFI=5/9 仅示意「多流」，本沙盘只有 QFI=1）',{a:'middle',s:6.2,st:1,f:C_MUT});
  /* 中：SDAP 分拣箱 */
  s+='<rect x="278" y="252" width="120" height="62" rx="10" fill="'+C_UPFL+'" stroke="'+C_UPF+'" stroke-width="2"/>';
  s+='<rect x="278" y="252" width="120" height="7" rx="3.5" fill="'+C_UPF+'"/>';
  s+=_t(338,272,'SDAP',{a:'middle',s:16,w:800,f:C_UPFD});
  s+=_t(338,288,'分拣台',{a:'middle',s:8,w:700,f:C_UPFD});
  s+=_t(338,301,'QFI → DRB 映射',{a:'middle',s:6.4,st:1,f:C_SEC});
  /* 右：出去的 DRB（空口侧，去 PDCP）*/
  s+=_t(600,216,'空口侧（交 PDCP→DRB）',{a:'middle',s:7.4,w:700,f:C_UPFD});
  s+=_iface(398,283,512,270,C_UPF,'',{sw:2.2,m:'arCd'});
  s+='<rect x="512" y="256" width="156" height="28" rx="7" fill="'+C_UPFL+'" stroke="'+C_UPF+'" stroke-width="1.6"/>';
  s+=_t(590,270,'DRB#1（default DRB）',{a:'middle',s:8.4,w:800,f:C_UPFD});
  s+='<rect x="512" y="292" width="156" height="24" rx="6" fill="#f8fafc" stroke="'+C_MUT+'" stroke-width="1" stroke-dasharray="4 3"/>';
  s+=_t(590,304,'（多流时可分到 DRB#2…）',{a:'middle',s:6.6,st:1,f:C_MUT});
  s+=_t(360,338,'本沙盘：单条 QoS Flow（QFI=1 / 5QI=9 non-GBR / ARP=9）→ 映射到 DRB#1（默认 DRB）',{a:'middle',s:7.6,w:700,f:C_UPFD});

  /* —— 底：极客提示 + 越界灰标 —— */

  s+='<rect x="48" y="363" width="30" height="12" rx="3" fill="#fff" stroke="'+C_KEY+'" stroke-width="0.9"/>';
  s+=_t(63,369.5,'极客',{a:'middle',s:6.6,w:800,f:C_KEYD});
  s+=_t(86,369.5,'上行映射可「显式」由 RRC 配，也可用 Reflective QoS：gNB 在 SDAP 头打 QFI+RDI，UE 照着反推 UL 映射。',{s:6.6,st:1,f:C_SEC});
  s+='<rect x="40" y="386" width="640" height="74" rx="10" fill="#f8fafc" stroke="'+C_MUT+'" stroke-width="1.2" stroke-dasharray="5 4"/>';
  s+=_t(58,404,'本沙盘声明（静态策略 · 越界黑盒）：',{s:9,w:800,f:C_MUT});
  s+=_t(58,422,'QoS 取值（5QI/ARP）来自 PCF（PCC 规则），计费来自 CHF——本沙盘用默认静态 QoS（5QI=9），二者不实例化；',{s:7.6,f:C_SEC});
  s+=_t(58,438,'多 DRB 调度/SDAP 头完整编码(UL/R 比特)/RLC 模式细节不展开。终点边界：首包吐到 N6 即止，',{s:7.6,f:C_SEC});
  s+=_t(58,452,'DN 之外（公网 BGP 路由）一律黑盒。',{s:7.6,st:1,f:C_MUT});
  s+='</svg>';
  return _wrap(s,6);
}

/* ══════════════════════════════════════════════════════════
   S6.1 · DRB 建立全流程（五泳道 + 动画 · 里程碑）
   ══════════════════════════════════════════════════════════ */
var LANE={ ue:86, gnb:222, amf:358, smf:494, upf:630 };
/* 六段：[fromX, toX, y, color, marker, iface, msg]（token 从 from→to，箭头指 to）*/
var FLOW6=[
  [LANE.amf, LANE.gnb, 126, C_AMF, 'arGa', 'N2',  '① 资源建立请求 (NAS+N2 SM)'],
  [LANE.gnb, LANE.ue,  162, C_UPF, 'arGd', 'Uu',  '② RRCReconfig · 建 DRB ★回AS'],
  [LANE.ue,  LANE.gnb, 198, C_GNBD,'arGg', 'Uu',  '③ ReconfigComplete'],
  [LANE.gnb, LANE.amf, 234, C_AMF, 'arGa', 'N2',  '④ 资源建立响应 (gNB N3 TEID)'],
  [LANE.amf, LANE.smf, 270, C_SMF, 'arGs', 'N11', '⑤ UpdateSMContext'],
  [LANE.smf, LANE.upf, 306, C_UPF, 'arGu', 'N4',  '⑥ PFCP Modify (DL FAR→gNB)']
];
function renderFlow(){
  var done=_drbDone();
  var s='<svg viewBox="0 0 720 480" width="100%" height="100%" style="display:block;">';
  s+=_bg('bgF')+_frame('bgF');
  s+='<defs>'+_mk('arGa',C_AMF)+_mk('arGd',C_UPF)+_mk('arGg',C_GNBD)+_mk('arGs',C_SMF)+_mk('arGu',C_UPF)+'</defs>';
  s+=_t(360,30,'DRB 建立全流程：gNB 把 QoS Flow 落成空口承载，N3 双向打通（五泳道接力）',{a:'middle',s:12.5,w:800,f:C_UPFD});

  /* 泳道头 + 生命线 */
  var heads=[
    [LANE.ue, C_UE,  C_UEL, 'UE','终端', null],
    [LANE.gnb,C_GNBD,C_GNBL,'gNB','建 DRB 主角', null],
    [LANE.amf,C_AMFD,C_AMFL,'AMF','NGAP 转发', null],
    [LANE.smf,C_SMFD,C_SMFL,'SMF','会话大脑', null],
    [LANE.upf,C_UPFD,C_UPFL,'UPF','用户面', null]
  ];
  heads.forEach(function(h){
    s+=_nfBox(h[0]-50,50,100,36,h[1],h[2],h[3],h[4],{as:13,fs:6.6,sw:1.7,dash:h[5]});
    s+='<line x1="'+h[0]+'" y1="86" x2="'+h[0]+'" y2="322" stroke="'+h[1]+'" stroke-width="1.1" stroke-dasharray="4 5" opacity="0.5"/>';
  });
  /* AMF→SMF 服务化总线提示（N11/N2 非 Diameter）*/
  s+=_t((LANE.amf+LANE.smf)/2,98,'N11=服务化(HTTP/2)',{a:'middle',s:6.2,st:1,f:C_SMFD});
  /* ★ 回到 AS 层 徽标（UE–gNB 间隙，Uu 段）*/
  s+='<rect x="'+(154-46)+'" y="100" width="92" height="14" rx="4" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="1"/>';
  s+=_t(154,107,'★ 回到 1.0 AS 层',{a:'middle',s:6.6,w:800,f:C_ANSD});

  /* 六段消息箭头（pending 半透明）*/
  FLOW6.forEach(function(g,i){
    var op=done?1:0.22;
    s+='<g id="gseg'+i+'" opacity="'+op+'">';
    s+=_iface(g[0],g[2],g[1],g[2],g[3],'',{m:g[4],sw:2});
    var mx=(g[0]+g[1])/2;
    s+='<rect x="'+(mx-15)+'" y="'+(g[2]-8)+'" width="30" height="15" rx="4" fill="#fff" stroke="'+g[3]+'" stroke-width="1" opacity="0.97"/>';
    s+=_t(mx,g[2]-0.5,g[5],{a:'middle',s:7.6,w:800,f:g[3]});
    s+=_t(mx,g[2]-14,g[6],{a:'middle',s:6,w:700,f:g[3]});
    s+='</g>';
  });

  /* 动画令牌（光晕 + 信封）*/
  s+='<circle id="gglow" cx="'+LANE.amf+'" cy="126" r="15" fill="'+C_UPF+'" opacity="0"/>';
  s+='<g id="gtok" transform="translate('+LANE.amf+',126)" opacity="'+(done?0:1)+'">';
  s+='<rect x="-15" y="-9" width="30" height="18" rx="3" fill="'+C_UPFL+'" stroke="'+C_UPFD+'" stroke-width="1.6"/>';
  s+=_t(0,-1,'✉',{a:'middle',s:10,id:'gtokg'})+'</g>';

  /* DRB 结果牌（完成点亮）*/
  s+='<rect id="gdrbbox" x="40" y="328" width="640" height="26" rx="8" fill="'+(done?'#f0fdf4':'#f8fafc')+'" stroke="'+(done?C_ANS:C_MUT)+'" stroke-width="1.4"'+(done?'':' stroke-dasharray="5 4"')+'/>';
  s+=_t(360,341,done?('DRB#'+QOS.drbId+' 建立 ✓ · QoS Flow QFI='+QOS.qfi+'(5QI='+QOS.fiveqi+') → DRB#'+QOS.drbId+' · N3 双向打通(gNB↔UPF) · 空口⟷核心网已缝合'):'DRB 建立中… 五泳道接力进行（NGAP 资源建立 → 回 AS 层建 DRB → 回填 N3）',
        {a:'middle',s:(done?8.2:9),w:800,f:(done?C_ANSD:C_MUT),id:'gdrbt'});

  /* 诚实条 */
  s+='<rect x="40" y="360" width="640" height="100" rx="11" fill="'+C_UPFL+'" stroke="'+C_UPF+'" stroke-width="1.3"/>';
  s+=_t(58,377,'回到 AS 层：',{s:9.2,w:800,f:C_UPFD});
  s+=_t(150,377,'② 是 2.0 唯一一次回 1.0 空口——RRCReconfiguration 建 DRB + 配 SDAP，并把 S5 那封 NAS Accept(含 IP) 搭着一起送达 UE。',{s:7.4,f:C_SEC});
  s+=_t(58,395,'N3 缝合：',{s:9.2,w:800,f:C_UPFD});

/* S6.1 动画：令牌沿六段接力，逐段点亮；完成写 ctx，单次播放（踩坑#33）*/
var _fRAF=null;
function drbAnim(){
  if(_drbDone()) return;
  var tok=document.getElementById('gtok'), glow=document.getElementById('gglow'),
      tg=document.getElementById('gtokg');
  if(!tok) return;
  var GLY=['✉','⚙','✓','✉','⚙','✓'];
  var SEGD=820, HOLD=360;
  var t0=null, seg=-1;
  function lerp(a,b,f){ return a+(b-a)*f; }
  function lit(i){ var g=document.getElementById('gseg'+i); if(g)g.setAttribute('opacity','1'); }
  function frame(ts){
    if(_drbDone()) return;
    if(!t0)t0=ts; var el=ts-t0;
    var cyc=SEGD+HOLD, idx=Math.floor(el/cyc);
    if(idx>5){                                  /* 六段完成：写 ctx（零先验）*/
      /* 回填 pdu_sessions[0].drb_id；若独立运行 S6（无 S5），seed 一条会话 */
      var base=(window.NR_CTX&&window.NR_CTX.nas&&window.NR_CTX.nas.pdu_sessions)?window.NR_CTX.nas.pdu_sessions.slice():[];
      if(base.length){ base[0]=Object.assign({},base[0],{drb_id:QOS.drbId}); }
      else { base.push({ id:QOS.pduId, dnn:QOS.dnn, snssai:QOS.snssai, type:QOS.type, ssc:QOS.ssc,
                         ue_ip:QOS.ueip, qos_flows:[{qfi:QOS.qfi, fiveqi:QOS.fiveqi}], drb_id:QOS.drbId }); }
      Engine.LogEngine.inject('[N2/NGAP] AMF → gNB：PDU Session Resource Setup Request（携 NAS Accept + N2 SM info）。');
      Engine.LogEngine.inject('[RRC] gNB → UE：RRCReconfiguration——建 DRB#'+QOS.drbId+'（QFI='+QOS.qfi+'→DRB#'+QOS.drbId+'）+ SDAP-Config + 转发 NAS Accept。');
      Engine.LogEngine.inject('[RRC] UE → gNB：RRCReconfigurationComplete。空口 DRB 建立完成。');
      Engine.LogEngine.inject('[N2/NGAP] gNB → AMF：PDU Session Resource Setup Response（gNB N3 TEID='+QOS.gnbTeid+'@'+QOS.gnbN3+'）。');
      Engine.LogEngine.inject('[N4/PFCP] SMF → UPF：Session Modification——DL FAR 指向 gNB N3 端点。N3 隧道双向打通。');
      Engine.ctxSet('nas.pdu_sessions', base);
      Engine.ctxSet('nas._drb_id', QOS.drbId);   /* 点亮顶栏 DRB# + 触发重渲染为已完成静态态 */
      return;
    }
    var inSeg=el-idx*cyc;
    var g=FLOW6[idx];
    if(seg!==idx){ for(var k=0;k<idx;k++) lit(k); seg=idx; if(tg)tg.textContent=GLY[idx]; }
    if(inSeg<SEGD){
      var f=inSeg/SEGD, x=lerp(g[0],g[1],f);
      tok.setAttribute('opacity','1');
      tok.setAttribute('transform','translate('+x+','+g[2]+')');
      glow.setAttribute('cx',x); glow.setAttribute('cy',g[2]);
      glow.setAttribute('fill', g[3]);
      glow.setAttribute('opacity',0.20*Math.sin(f*Math.PI));
    } else {
      tok.setAttribute('transform','translate('+g[1]+','+g[2]+')');
      glow.setAttribute('opacity','0');
      lit(idx);
    }
    _fRAF=Engine.addTimer(requestAnimationFrame(frame));
  }
  _fRAF=Engine.addTimer(requestAnimationFrame(frame));
}

/* S6.2 连续动画：数据包沿 UE→gNB→UPF→DN 循环流动（装饰·不写 ctx）*/
var _pktRAF=null;
function pktAnim(){
  var pkt=document.getElementById('spkt');
  if(!pkt) return;
  var WP=[PKT.ue, PKT.gnb, PKT.upf, PKT.dn];   /* 三段 */
  var SEGD=900, HOLD=240, TAIL=600;            /* 每段 / 段间停 / 到 DN 后停顿再循环 */
  var t0=null;
  function lerp(a,b,f){ return a+(b-a)*f; }
  function frame(ts){
    if(Engine.getSubIdx()!==2){ _pktRAF=null; return; }   /* 离开本子步：自终止 */
    if(!t0)t0=ts; var el=ts-t0;
    var cyc=SEGD+HOLD, total=3*cyc+TAIL;
    var p=el%total, idx=Math.floor(p/cyc);
    var x;
    if(idx>2){ x=WP[3]; }                       /* 到 DN 停顿 */
    else {
      var inSeg=p-idx*cyc;
      var f=inSeg<SEGD?(inSeg/SEGD):1;
      x=lerp(WP[idx],WP[idx+1],f);
    }
    pkt.setAttribute('transform','translate('+x+','+PKT.y+')');
    pkt.setAttribute('opacity', (idx>2 && (p-3*cyc)>TAIL*0.6)?0.35:1);
    _pktRAF=Engine.addTimer(requestAnimationFrame(frame));
  }
  _pktRAF=Engine.addTimer(requestAnimationFrame(frame));
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5G NR Initial Access · 协议物理层监测台</title>
<link rel="stylesheet" href="design-system.css">
<style>
  .hub-wrap {
    width: 100%; max-width: 1560px;
    height: calc(100vh - 24px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; overflow: hidden;
    box-shadow: var(--shadow-lg);
  }
  .hub-sidebar-footer {
    margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 10px; color: var(--text-mut); font-family: var(--font-mono);
    line-height: 1.6;
  }
  .hub-stage-badge {
    display: inline-block; font-size: 9px; padding: 2px 8px; border-radius: 10px;
    font-family: var(--font-mono); margin-left: 6px;
  }
  .hub-stage-badge.done { background: var(--accent-bg); color: var(--accent); }
  .hub-stage-badge.wip  { background: var(--warn-bg); color: var(--warn); }
  .hub-stage-badge.todo { background: transparent; color: var(--text-mut); border: 1px solid var(--border); }

  @media (max-width: 800px) {
    .hub-layout { grid-template-columns: 1fr; }
    .hub-sidebar { max-height: 200px; }
  }
</style>
</head>
<body>

<div class="hub-wrap">
  <div class="hub-layout">

    <!-- ── Left Sidebar ─────────────────────────────────────────────── -->
    <div class="hub-sidebar">
      <div class="hub-sidebar-title">5G NR Initial Access<br><span style="font-size:10px;color:var(--text-mut);font-weight:400;">初始接入 · 全流程导航</span></div>

      <button class="hub-stage-btn active" onclick="loadStage(0)" id="nav-0">
        <span class="hub-stage-num">⓪</span> UE 开机初始化
        <span class="hub-stage-badge done">完成</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(1)" id="nav-1">
        <span class="hub-stage-num">①</span> gNB 广播与 SSB
        <span class="hub-stage-badge wip">文字就绪</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(2)" id="nav-2">
        <span class="hub-stage-num">②</span> PSS 互相关扫描
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(3)" id="nav-3">
        <span class="hub-stage-num">③</span> PSS 符号同步
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(4)" id="nav-4">
        <span class="hub-stage-num">④</span> SSS 帧同步
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(5)" id="nav-5">
        <span class="hub-stage-num">⑤</span> PBCH / MIB
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(6)" id="nav-6">
        <span class="hub-stage-num">⑥</span> CORESET#0 盲检
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(7)" id="nav-7">
        <span class="hub-stage-num">⑦</span> SIB1 获取
        <span class="hub-stage-badge todo">待开发</span>
      </button>
      <button class="hub-stage-btn" onclick="loadStage(8)" id="nav-8">
        <span class="hub-stage-num">⑧</span> RACH 就绪
        <span class="hub-stage-badge todo">待开发</span>
      </button>

      <div class="hub-sidebar-footer">
        双击 stage-N-xxx.html<br>可独立运行单个步骤
      </div>
    </div>

    <!-- ── Right: Iframe ────────────────────────────────────────────── -->
    <iframe class="hub-frame" id="stageFrame" src="stage-0-boot.html"></iframe>
  </div>
</div>

<script>
  var STAGE_FILES = [
    'stage-0-boot.html',
    'stage-1-gnb-ssb.html',
    'stage-4-pss-scan.html',
    'stage-5-pss-sync.html',
    'stage-6-sss-sync.html',
    'stage-7-pbch-mib.html',
    'stage-8-coreset.html',
    'stage-9-sib1.html',
    'stage-10-rach-ready.html',
  ];

  var currentNav = 0;

  function loadStage(idx) {
    /* Update active nav */
    document.querySelectorAll('.hub-stage-btn').forEach(function(b, i) {
      b.classList.toggle('active', i === idx);
    });
    currentNav = idx;

    /* If stage file exists, load it; otherwise show placeholder */
    var frame = document.getElementById('stageFrame');
    if (frame) {
      frame.src = STAGE_FILES[idx];
    }
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Stage 3 · SSS 检测</title>
<link rel="stylesheet" href="design-system.css">

<style>
.nr-slider-wrap { display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px; }
.nr-slider { -webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
             background:var(--border);outline:none;cursor:pointer;width:150px; }
.nr-slider::-webkit-slider-thumb { -webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:#7c3aed;border:2px solid white;
  box-shadow:0 1px 4px rgba(124,58,237,.4); }
.nr-val  { font-family:var(--font-mono);font-size:12px;font-weight:700;
           color:#7c3aed;min-width:32px;text-align:right; }
.case-btn { padding:4px 10px;border-radius:5px;font-size:11px;font-family:var(--font-mono);
            font-weight:700;cursor:pointer;border:1.5px solid var(--border);
            background:var(--surface);color:var(--text-sec);transition:all .15s; }
.case-btn.on { background:#7c3aed;border-color:#7c3aed;color:white; }

            border:1px solid var(--border);border-radius:8px;padding:7px 14px;flex-wrap:wrap; }

.m0-flash { animation:m0jump 0.6s ease-in-out 2; }
</style>

<body>
<div id="app"></div>
<script src="stage-data.js"></script>
<script src="engine.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   Stage 3 · SSS 检测 · 4 sub-steps (0..3)
   配色：紫 #7c3aed(主) / 青 #0891b2(s1副色) / 绿 #059669(答案)
        / 灰 #94a3b8(对照) / 红 #dc2626(锁定高光)
   ═══════════════════════════════════════════════════════════ */

/* ── SSS 核心（TS 38.211 §7.4.2.3）· 载入时计算一次，动画不重算 ── */
function _genM(taps, init){
  var x=init.slice();
  for(var i=0;i<120;i++){ var s=0; taps.forEach(function(t){ s^=x[i+t]; }); x.push(s); }
  return x.slice(0,127);
}
var SX0=_genM([4,0],[0,0,0,0,0,0,1]);   // g0=x^7+x^4+1
var SX1=_genM([1,0],[0,0,0,0,0,0,1]);   // g1=x^7+x+1
function _s0(n,m0){ return 1-2*SX0[((n+m0)%127+127)%127]; }
function _s1(n,m1){ return 1-2*SX1[((n+m1)%127+127)%127]; }
function _m0of(n1,n2){ return 15*Math.floor(n1/112)+5*n2; }
function _m1of(n1){ return n1%112; }
function _sssD(n1,n2){
  var m0=_m0of(n1,n2), m1=_m1of(n1), d=[];
  for(var n=0;n<127;n++) d.push(_s0(n,m0)*_s1(n,m1));
  return d;
}
function _corr(a,b){ var s=0; for(var i=0;i<127;i++) s+=a[i]*b[i]; return s; }

/* 真实小区 PCI=337 → N_ID1=112, N_ID2=1 */
var TRUE_N1=112, TRUE_N2=1, TRUE_PCI=337;
var SSS_REF=_sssD(TRUE_N1,TRUE_N2);
/* 预计算 336 路相关：键=用于假设的 N_ID2（1=正确，0/2=错误对照） */
var BS_PEAKS={};
[0,1,2].forEach(function(n2){
  var p=[]; for(var n1=0;n1<336;n1++) p.push(_corr(_sssD(n1,n2),SSS_REF));
  BS_PEAKS[n2]=p;
});
var BS_ARG=BS_PEAKS[1].indexOf(Math.max.apply(null,BS_PEAKS[1]));  // =112

/* ── 公共文本助手 ── */
function _t(x,y,t,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" '+(o.a?'text-anchor="'+o.a+'" ':'')+
    'dominant-baseline="central" font-family="SF Mono,Consolas,monospace" '+
    'font-size="'+(o.s||10)+'" '+(o.w?'font-weight="'+o.w+'" ':'')+
    'fill="'+(o.f||'#1e293b')+'"'+(o.st?' font-style="italic"':'')+
    (o.id?' id="'+o.id+'"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'>'+t+'</text>';
}
var C_MAIN='#7c3aed', C_MAIND='#5b21b6', C_S0='#7c3aed', C_S1='#0891b2',
    C_ANS='#059669', C_ANSL='#d1fae5', C_HI='#dc2626', C_GREY='#94a3b8',
    C_SEC='#475569', C_MUT='#94a3b8';

/* ═══════════════════════════════════════════════════════════
   S3.0 · 理论黑板（PSS 已锁 → SSS 本阶段 → PCI 合成）
   ═══════════════════════════════════════════════════════════ */
function renderS3Discuss(){
  var s='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;" xmlns="http://www.w3.org/2000/svg">';
  s+='<defs><linearGradient id="s3bg" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>'+
     '<marker id="s3arA" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+C_MAIN+'"/></marker>'+
     '<marker id="s3arG" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+C_ANS+'"/></marker></defs>';
  s+='<rect x="14" y="14" width="692" height="467" rx="14" fill="url(#s3bg)" stroke="#ddd6fe" stroke-width="1.5"/>';
  s+='<rect x="14" y="14" width="692" height="44" rx="14" fill="'+C_MAIN+'" opacity="0.10"/>';
  s+=_t(360,36,'三步小区搜索 · SSS 站在 PSS 的肩膀上补齐 PCI',{a:'middle',s:13,w:700,f:C_MAIND});

  /* 左：PSS 已锁（绿/完成态）*/
  s+='<rect x="28" y="74" width="204" height="186" rx="10" fill="#fff" stroke="'+C_ANS+'" stroke-width="2"/>';
  s+='<rect x="28" y="74" width="204" height="34" rx="10" fill="'+C_ANS+'" opacity="0.12"/>';
  s+=_t(130,92,'① PSS · 已完成 ✓',{a:'middle',s:12,w:700,f:'#065f46'});
  s+=_t(130,126,'盲检 3 路 m-序列',{a:'middle',s:10.5,f:C_SEC});
  s+='<rect x="44" y="142" width="172" height="62" rx="6" fill="'+C_ANSL+'"/>';
  s+=_t(130,162,'解出 ▸ N_ID² ∈ {0,1,2}',{a:'middle',s:10,w:700,f:'#047857'});
  s+=_t(130,184,'解出 ▸ 符号定时',{a:'middle',s:10,f:'#047857'});
  s+=_t(130,232,'PCI 的低位（3 选 1）',{a:'middle',s:9.5,st:1,f:C_SEC});

  /* 中：SSS 本阶段（紫/主色）*/
  s+='<rect x="258" y="74" width="204" height="186" rx="10" fill="#fff" stroke="'+C_MAIN+'" stroke-width="2.5"/>';
  s+='<rect x="258" y="74" width="204" height="34" rx="10" fill="'+C_MAIN+'" opacity="0.14"/>';
  s+=_t(360,92,'② SSS · 本阶段',{a:'middle',s:12,w:700,f:C_MAIND});
  s+=_t(360,126,'336 路双序列相乘',{a:'middle',s:10.5,f:C_SEC});
  s+='<rect x="274" y="142" width="172" height="62" rx="6" fill="#f5f3ff"/>';
  s+=_t(360,162,'解出 ▸ N_ID¹ ∈ {0..335}',{a:'middle',s:10,w:700,f:C_MAIND});
  s+=_t(360,184,'解出 ▸ 半帧粗定时',{a:'middle',s:10,f:C_MAIND});
  s+=_t(360,232,'PCI 的高位（336 选 1）',{a:'middle',s:9.5,st:1,f:C_SEC});

  /* 右：PCI 合成 */
  s+='<rect x="488" y="74" width="204" height="186" rx="10" fill="#fff" stroke="#c8d6e8" stroke-width="1.5"/>';
  s+='<rect x="488" y="74" width="204" height="34" rx="10" fill="#94a3b8" opacity="0.12"/>';
  s+=_t(590,92,'③ PCI 合成',{a:'middle',s:12,w:700,f:'#475569'});
  s+=_t(590,128,'PCI = 3·N_ID¹ + N_ID²',{a:'middle',s:11,w:700,f:'#334155'});
  s+='<rect x="510" y="146" width="160" height="44" rx="6" fill="#f1f5f9"/>';
  s+=_t(590,162,'336 × 3 = 1008',{a:'middle',s:10.5,w:700,f:'#475569'});
  s+=_t(590,180,'物理小区唯一标识',{a:'middle',s:9.5,f:C_MUT});
  s+=_t(590,232,'→ Stage 4：v=PCI mod 4',{a:'middle',s:9.5,st:1,f:C_SEC});

  s+='<line x1="234" y1="167" x2="256" y2="167" stroke="'+C_ANS+'" stroke-width="2" marker-end="url(#s3arG)"/>';
  s+='<line x1="464" y1="167" x2="486" y2="167" stroke="'+C_MAIN+'" stroke-width="2" marker-end="url(#s3arA)"/>';

  /* 底：PCI 位拼接图（高位 N_ID¹×3 + 低位 N_ID² 余数 → 合成 PCI）*/
  s+='<rect x="28" y="276" width="664" height="148" rx="10" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>';
  s+=_t(360,296,'PCI 是一道「高低位拼接」：N_ID¹ 占高位(×3)，N_ID² 补低位余数(0~2)',{a:'middle',s:11,w:700,f:C_MAIND});
  var _hx=70,_hw=300,_bby=312,_bbh=46;
  s+='<rect x="'+_hx+'" y="'+_bby+'" width="'+_hw+'" height="'+_bbh+'" rx="8" fill="'+C_MAIN+'" opacity="0.16" stroke="'+C_MAIN+'" stroke-width="2"/>';
  s+=_t(_hx+_hw/2,_bby+16,'N_ID¹  ×3',{a:'middle',s:13,w:800,f:C_MAIND});
  s+=_t(_hx+_hw/2,_bby+33,'高位 · 0~335（本阶段解出）',{a:'middle',s:9.5,f:C_SEC});
  s+=_t(_hx+_hw+22,_bby+_bbh/2,'+',{a:'middle',s:24,w:800,f:C_SEC});
  var _lx=_hx+_hw+44,_lw=120;
  s+='<rect x="'+_lx+'" y="'+_bby+'" width="'+_lw+'" height="'+_bbh+'" rx="8" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="2"/>';
  s+=_t(_lx+_lw/2,_bby+16,'N_ID²',{a:'middle',s:13,w:800,f:C_ANS});
  s+=_t(_lx+_lw/2,_bby+33,'低位 0~2 ✓PSS',{a:'middle',s:9,f:'#047857'});
  s+=_t(_lx+_lw+20,_bby+_bbh/2,'=',{a:'middle',s:22,w:800,f:C_SEC});
  var _px=200,_pw=320,_ppy=384,_pph=34;
  s+='<rect x="'+_px+'" y="'+_ppy+'" width="'+_pw+'" height="'+_pph+'" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>';
  s+=_t(_px+_pw/2,_ppy+12,'PCI = 3·N_ID¹ + N_ID²  ∈ 0~1007',{a:'middle',s:12.5,w:800,f:'#334155'});
  s+=_t(_px+_pw/2,_ppy+26,'336 × 3 = 1008 个物理小区标识',{a:'middle',s:9,f:C_SEC});
  s+='<line x1="'+(_hx+_hw/2)+'" y1="'+(_bby+_bbh)+'" x2="'+(_px+_pw*0.32)+'" y2="'+_ppy+'" stroke="'+C_MAIN+'" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>';
  s+='<line x1="'+(_lx+_lw/2)+'" y1="'+(_bby+_bbh)+'" x2="'+(_px+_pw*0.72)+'" y2="'+_ppy+'" stroke="'+C_ANS+'" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>';
  s+='</svg>';
  return s;
}

/* ═══════════════════════════════════════════════════════════
   S3.1 · 双 m-序列逐点相乘（slider 驱动 + 扫描高亮）
   ═══════════════════════════════════════════════════════════ */
var _d1n1=112, _d1sweep=-1, _d1tid=null;
function _d1n2(){ return (window.NR_CTX && NR_CTX.nid2!=null) ? NR_CTX.nid2 : TRUE_N2; }
var D1_N=42, D1_X0=58, D1_W=586, D1_CW=586/42;
var D1_ROW={s0:152,s1:228,d:330};

function _d1strip(yc,fn,col,lbl){
  var s=_t(D1_X0-10,yc,lbl,{a:'end',s:11,w:700,f:col});
  for(var n=0;n<D1_N;n++){
    var v=fn(n), up=v>0, cx=D1_X0+n*D1_CW;
    var hl=(n===_d1sweep);
    s+='<rect class="d1cell" x="'+cx.toFixed(1)+'" y="'+(yc-15)+'" width="'+(D1_CW-1.5).toFixed(1)+'" height="30" rx="2" '+
       'fill="'+(up?col:'#fff')+'" stroke="'+(hl?C_HI:col)+'" stroke-width="'+(hl?2:1)+'" opacity="'+(up?'0.92':'1')+'"/>';
    s+=_t(cx+D1_CW/2-0.6,yc,up?'+':'−',{a:'middle',s:11,w:800,f:up?'#fff':col});
  }
  s+=_t(D1_X0+D1_W+8,yc,'···(127)',{s:9,f:C_MUT});
  return s;
}
function renderDualMSeq(){
  var n1=_d1n1, n2=_d1n2(), m0=_m0of(n1,n2), m1=_m1of(n1);
  var dArr=_sssD(n1,n2);
  var svg='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;flex:1;min-height:0;" xmlns="http://www.w3.org/2000/svg">';
  svg+='<defs><linearGradient id="d1bg" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient></defs>';
  svg+='<rect x="14" y="14" width="692" height="467" rx="14" fill="url(#d1bg)" stroke="#ddd6fe" stroke-width="1.5"/>';
  svg+=_t(360,34,'双 m-序列逐点相乘 → 生成 SSS（d_SSS = s₀ × s₁）',{a:'middle',s:13,w:700,f:C_MAIND});
  /* 参数条 */
  svg+='<rect x="28" y="56" width="300" height="48" rx="8" fill="#fff" stroke="#ddd6fe" stroke-width="1.2"/>';
  svg+=_t(42,72,'N_ID¹ = '+n1+'（本屏待解）',{s:10,w:700,f:C_MAIN});
  svg+=_t(42,90,'m₁ = '+m1+'　m₀ = 15·⌊'+n1+'/112⌋+5·'+n2+' = '+m0,{s:9.5,f:C_SEC});
  svg+='<rect x="338" y="56" width="170" height="48" rx="8" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="1.5"/>';
  svg+=_t(423,72,'N_ID² = '+n2+'  ✓ PSS 锁定',{a:'middle',s:10,w:700,f:C_ANS});
  svg+=_t(423,90,'只读 · 锚定 m₀',{a:'middle',s:9,f:'#047857'});
  svg+='<rect x="518" y="56" width="166" height="48" rx="8" fill="#fff" stroke="#ddd6fe" stroke-width="1.2"/>';
  svg+=_t(601,72,'g₀ = x⁷+x⁴+1',{a:'middle',s:9.5,w:700,f:C_S0});
  svg+=_t(601,90,'g₁ = x⁷+x+1',{a:'middle',s:9.5,w:700,f:C_S1});
  /* 三条带 */
  svg+=_d1strip(D1_ROW.s0,function(n){return _s0(n,m0);},C_S0,'s₀(n)');
  svg+=_d1strip(D1_ROW.s1,function(n){return _s1(n,m1);},C_S1,'s₁(n)');
  svg+=_t(360,(D1_ROW.s1+D1_ROW.d)/2-8,'↓ 同列相乘  ×  ≡  ⊕（异或）',{a:'middle',s:11,w:800,f:C_HI});
  svg+=_t(360,(D1_ROW.s1+D1_ROW.d)/2+8,'+×+=+，+×−=−　|　BPSK 域相乘 = 比特域异或，硬件只需廉价异或门（3GPP 选 m-序列的底层考量）',{a:'middle',s:8.5,st:1,f:C_SEC});
  svg+=_d1strip(D1_ROW.d,function(n){return dArr[n];},C_MAIN,'d_SSS');
  /* 底注 */
  svg+=_t(360,394,'两条母序列独立移位，逐点相乘才是要发送的 SSS（一条发不出 336 种身份）',{a:'middle',s:10,st:1,f:C_SEC});
  var jumpHi=(n1>=112)?C_HI:C_MAIND;
  svg+='<g id="m0jumpBox">';
  svg+='<rect x="110" y="414" width="500" height="40" rx="8" fill="#fff" stroke="'+(n1>=112?C_HI:'#ddd6fe')+'" stroke-width="'+(n1>=112?'1.6':'1')+'"/>';
  svg+=_t(360,434,'m₀ 跨 112 边界跳变：N_ID¹=111→m₀=5，112→m₀=20（⌊·/112⌋ 项 +15）',{a:'middle',s:10,w:700,f:jumpHi});
  svg+='</g>';
  svg+='</svg>';
  /* 控件 */
  var ctrl='<div class="ctrl-bar">'+
    '<div class="nr-slider-wrap"><span style="color:var(--text-mut)">N_ID¹</span>'+
    '<input class="nr-slider" type="range" min="0" max="335" value="'+n1+'" step="1" oninput="d1Set(+this.value)">'+
    '<span class="nr-val" id="d1val">'+n1+'</span></div>'+
    '<span style="width:1px;height:18px;background:var(--border);"></span>'+
    '<button class="case-btn" onclick="d1True()">↩ 回到真值 112</button>'+
    '<button class="case-btn" onclick="d1Play()">▶ 演示逐点相乘</button></div>';
  return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:18px;">'+ctrl+svg+'</div>';
}
function _d1VC(){ return document.getElementById('vizContainer'); }
function _d1Rerender(){ var vc=_d1VC(); if(vc) vc.innerHTML=renderDualMSeq(); }
function _blk(n){ return Math.floor(n/112); }   // 0/1/2 块号
function d1Set(v){
  if(_d1tid){ clearInterval(_d1tid); _d1tid=null; }
  var prev=_d1n1;
  _d1n1=Math.min(335,Math.max(0,v|0)); _d1sweep=-1; _d1Rerender();
  if(_blk(prev)!==_blk(_d1n1)){          // 跨 112/224 边界 → m₀ 阶跃，闪烁提示
    var box=document.getElementById('m0jumpBox');
    if(box){ box.classList.remove('m0-flash'); void box.getBoundingClientRect(); box.classList.add('m0-flash'); }
  }
}
function d1True(){ d1Set(112); }
function d1Play(){
  if(_d1tid){ clearInterval(_d1tid); _d1tid=null; }
  _d1sweep=0; _d1Rerender();
  _d1tid=setInterval(function(){
    _d1sweep++;
    if(_d1sweep>=D1_N){ _d1sweep=-1; clearInterval(_d1tid); _d1tid=null; }
    _d1Rerender();
  },90);
  Engine.addTimer(_d1tid);
}

/* ═══════════════════════════════════════════════════════════
   S3.2 · 在锁定定时上提取接收 SSS（开窗→FFT→取中心127 + 相位旋转）
   ═══════════════════════════════════════════════════════════ */
var _rxPhase=0, _rxTid=null;
/* 预计算 IQ 散点：理想 ±1 两点被未知信道相位抹满整圈 + 径向噪声（固定种子，动画不重算）*/
var RX_PTS=(function(){
  var s=7, rnd=function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  var pts=[];
  for(var k=0;k<2;k++){ for(var i=0;i<46;i++){
    var ang=rnd()*2*Math.PI, r=1+(rnd()-0.5)*0.5;
    pts.push([r*Math.cos(ang), r*Math.sin(ang)]);
  }}
  return pts;
})();
function renderRxExtract(){
  var n2=_d1n2();
  var svg='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;flex:1;min-height:0;" xmlns="http://www.w3.org/2000/svg">';
  svg+='<defs><linearGradient id="rxbg" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0" stop-color="#faf5ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient></defs>';
  svg+='<rect x="14" y="14" width="692" height="467" rx="14" fill="url(#rxbg)" stroke="#ddd6fe" stroke-width="1.5"/>';
  svg+=_t(360,34,'在 PSS 锁定的定时上开窗 · 取 symbol 2 中心 127 RE',{a:'middle',s:12.5,w:700,f:C_MAIND});

  /* ── 上：迷你 SSB 时频网格（居中、压扁）── */
  var GX=130, GY=54, GW=260, GH=104, symW=GW/4;
  svg+='<rect x="'+GX+'" y="'+GY+'" width="'+GW+'" height="'+GH+'" rx="4" fill="#fff" stroke="#c8d6e8" stroke-width="1"/>';
  ['Sym0','Sym1','Sym2','Sym3'].forEach(function(l,i){
    svg+=_t(GX+(i+0.5)*symW,GY-9,l,{a:'middle',s:9,f:C_SEC});
    if(i>0) svg+='<line x1="'+(GX+i*symW)+'" y1="'+GY+'" x2="'+(GX+i*symW)+'" y2="'+(GY+GH)+'" stroke="#e2e8f0" stroke-width="0.8"/>';
  });
  svg+='<rect x="'+(GX+0*symW+symW*0.15)+'" y="'+(GY+GH*0.30)+'" width="'+(symW*0.7)+'" height="'+(GH*0.40)+'" rx="2" fill="'+C_ANS+'" opacity="0.85"/>';
  svg+=_t(GX+0.5*symW,GY+GH*0.5,'PSS',{a:'middle',s:9,w:700,f:'#fff'});
  svg+=_t(GX+0.5*symW,GY+GH+11,'✓ 定时已锁',{a:'middle',s:8.5,f:C_ANS});
  svg+='<rect x="'+(GX+2*symW+symW*0.15)+'" y="'+(GY+GH*0.30)+'" width="'+(symW*0.7)+'" height="'+(GH*0.40)+'" rx="2" fill="'+C_MAIN+'" opacity="0.9"/>';
  svg+=_t(GX+2.5*symW,GY+GH*0.5,'SSS',{a:'middle',s:9,w:700,f:'#fff'});
  svg+=_t(GX+2.5*symW,GY+GH+11,'本屏目标',{a:'middle',s:8.5,w:700,f:C_MAIN});
  [1,3].forEach(function(sy){
    svg+='<rect x="'+(GX+sy*symW+2)+'" y="'+(GY+4)+'" width="'+(symW-4)+'" height="'+(GH-8)+'" rx="2" fill="#dbeafe" opacity="0.5"/>';
    svg+=_t(GX+(sy+0.5)*symW,GY+GH*0.5,'PBCH',{a:'middle',s:8,f:'#3b82f6'});
  });

  /* 开窗箭头 → FFT（置于网格右侧）*/
  svg+='<line x1="'+(GX+GW+6)+'" y1="'+(GY+GH/2)+'" x2="'+(GX+GW+40)+'" y2="'+(GY+GH/2)+'" stroke="'+C_MAIN+'" stroke-width="1.5" stroke-dasharray="4 3"/>';
  svg+=_t(GX+GW+23,GY+GH/2-10,'开窗',{a:'middle',s:9,f:C_MAIN});
  svg+='<rect x="'+(GX+GW+40)+'" y="'+(GY+GH/2-20)+'" width="74" height="40" rx="8" fill="#fff" stroke="'+C_MAIN+'" stroke-width="1.5"/>';
  svg+=_t(GX+GW+77,GY+GH/2-5,'FFT',{a:'middle',s:12,w:800,f:C_MAIN});
  svg+=_t(GX+GW+77,GY+GH/2+10,'取中心 127',{a:'middle',s:7.5,f:C_SEC});
  svg+=_t(GX+GW+77,GY+GH+11,'→ 接收 SSS',{a:'middle',s:9,w:700,f:C_MAIN});

  /* ── 中：IQ 星座图（理想两点 vs 接收甜甜圈 + 量幅度）── */
  var cyIQ=292, R=56;
  var cxL=185, cxR=535;
  // 左：理想 BPSK 两点
  svg+=_t(cxL,cyIQ-R-26,'理想 d_SSS：干净 BPSK 两点',{a:'middle',s:10,w:700,f:C_MAIN});
  svg+='<line x1="'+(cxL-R-14)+'" y1="'+cyIQ+'" x2="'+(cxL+R+14)+'" y2="'+cyIQ+'" stroke="#cbd5e1" stroke-width="1"/>';
  svg+='<line x1="'+cxL+'" y1="'+(cyIQ-R-14)+'" x2="'+cxL+'" y2="'+(cyIQ+R+14)+'" stroke="#cbd5e1" stroke-width="1"/>';
  svg+=_t(cxL+R+20,cyIQ,'I',{a:'middle',s:9,f:C_MUT});
  svg+=_t(cxL,cyIQ-R-20,'Q',{a:'middle',s:9,f:C_MUT});
  svg+='<circle cx="'+(cxL+R)+'" cy="'+cyIQ+'" r="6" fill="'+C_MAIN+'"/>';
  svg+='<circle cx="'+(cxL-R)+'" cy="'+cyIQ+'" r="6" fill="'+C_MAIN+'"/>';
  svg+=_t(cxL+R,cyIQ-15,'+1',{a:'middle',s:9,f:C_MAIND});
  svg+=_t(cxL-R,cyIQ-15,'−1',{a:'middle',s:9,f:C_MAIND});
  // 右：接收散点甜甜圈（确定性散点，整体随 _rxPhase 缓慢转）
  svg+=_t(cxR,cyIQ-R-26,'接收 SSS：未知 φ + 噪声 → 抹成甜甜圈',{a:'middle',s:10,w:700,f:C_SEC});
  svg+='<line x1="'+(cxR-R-14)+'" y1="'+cyIQ+'" x2="'+(cxR+R+14)+'" y2="'+cyIQ+'" stroke="#cbd5e1" stroke-width="1"/>';
  svg+='<line x1="'+cxR+'" y1="'+(cyIQ-R-14)+'" x2="'+cxR+'" y2="'+(cyIQ+R+14)+'" stroke="#cbd5e1" stroke-width="1"/>';
  svg+=_t(cxR+R+20,cyIQ,'I',{a:'middle',s:9,f:C_MUT});
  svg+=_t(cxR,cyIQ-R-20,'Q',{a:'middle',s:9,f:C_MUT});
  svg+='<circle cx="'+cxR+'" cy="'+cyIQ+'" r="'+R+'" fill="none" stroke="'+C_ANS+'" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>';
  svg+='<g transform="rotate('+(_rxPhase*57.3).toFixed(1)+' '+cxR+' '+cyIQ+')">';
  RX_PTS.forEach(function(p){
    svg+='<circle cx="'+(cxR+p[0]*R).toFixed(1)+'" cy="'+(cyIQ-p[1]*R).toFixed(1)+'" r="2" fill="'+C_GREY+'" opacity="0.7"/>';
  });
  svg+='</g>';
  svg+='<line x1="'+cxR+'" y1="'+cyIQ+'" x2="'+(cxR+R*0.92).toFixed(1)+'" y2="'+(cyIQ-R*0.38).toFixed(1)+'" stroke="'+C_HI+'" stroke-width="2" marker-end="url(#rxAmp)"/>';
  svg+='<defs><marker id="rxAmp" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7Z" fill="'+C_HI+'"/></marker></defs>';
  svg+=_t(cxR+R*0.52,cyIQ-R*0.40,'|x| 幅度',{a:'middle',s:9,w:700,f:C_HI});
  svg+=_t(360,cyIQ+R+22,'角度被 φ 抹掉没法用 → 只量「到原点距离」|x|（非相干）',{a:'middle',s:10.5,w:700,f:C_MAIND});

  /* ── 底：诚实点 ── */
  svg+='<rect x="44" y="404" width="632" height="62" rx="10" fill="#fff" stroke="#ddd6fe" stroke-width="1.2"/>';
  svg+=_t(360,420,'鸡生蛋：DMRS 信道估计需先知 PCI（v=PCI mod 4），而 PCI 正等 SSS 解出',{a:'middle',s:10,w:700,f:C_MAIND});
  svg+=_t(360,438,'→ 此刻无信道估计，接收序列带未知相位 φ → 改用非相干幅度检测',{a:'middle',s:10,f:C_SEC});
  svg+=_t(360,456,'R_k = |Σ r·d_k*| → |e^{jφ}·127| = 127，与 φ 无关（下一屏盲检）',{a:'middle',s:10,w:700,f:C_ANS});
  svg+='</svg>';
  return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:6px;">'+svg+'</div>';
}
function _rxAnim(){
  if(_rxTid){ clearInterval(_rxTid); _rxTid=null; }
  _rxPhase=0;
  _rxTid=setInterval(function(){
    _rxPhase=(_rxPhase+0.04)%(2*Math.PI);   // 甜甜圈整体缓慢旋转
    var vc=document.getElementById('vizContainer'); if(vc) vc.innerHTML=renderRxExtract();
  },140);
  Engine.addTimer(_rxTid);
}

/* ═══════════════════════════════════════════════════════════
   S3.3 · 336 路盲匹配（扫描揭示 + 锁定 + 错N_ID²对照）
   ═══════════════════════════════════════════════════════════ */
var _bsScan=0, _bsN2=1, _bsLocked=false, _bsTid=null;
var BS_X0=46, BS_W=628, BS_Y0=104, BS_YB=372;
function _bsX(i){ return BS_X0+i/335*BS_W; }
function _bsY(v){ return BS_YB-(Math.max(v,0)/127)*(BS_YB-BS_Y0); }

function renderBlindSearch(){
  var peaks=BS_PEAKS[_bsN2], wrong=(_bsN2!==TRUE_N2);
  var arg=wrong?-1:BS_ARG;
  var svg='<svg viewBox="0 0 720 495" width="100%" height="100%" style="display:block;flex:1;min-height:0;" xmlns="http://www.w3.org/2000/svg">';
  svg+='<defs><linearGradient id="bsbg" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0" stop-color="#faf5ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient></defs>';
  svg+='<rect x="14" y="14" width="692" height="467" rx="14" fill="url(#bsbg)" stroke="#ddd6fe" stroke-width="1.5"/>';
  svg+=_t(360,32,'336 路盲匹配：哪个 N_ID¹ 假设冲到 127，谁就是它',{a:'middle',s:12.5,w:700,f:C_MAIND});
  svg+=_t(360,50,'横轴 = N_ID¹ 假设（0~335）　纵轴 = 非相干相关幅度',{a:'middle',s:9.5,f:C_SEC});
  /* 基线 + 127/15 参考 */
  svg+='<line x1="'+BS_X0+'" y1="'+BS_YB+'" x2="'+(BS_X0+BS_W)+'" y2="'+BS_YB+'" stroke="#cbd5e1" stroke-width="1"/>';
  svg+='<line x1="'+BS_X0+'" y1="'+_bsY(127)+'" x2="'+(BS_X0+BS_W)+'" y2="'+_bsY(127)+'" stroke="'+C_ANS+'" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.55"/>';
  svg+=_t(BS_X0-6,_bsY(127),'127',{a:'end',s:9,f:C_ANS});
  svg+=_t(BS_X0-6,_bsY(15),'~15',{a:'end',s:9,f:C_MUT});
  /* 336 bars（扫描揭示）*/
  var lim=Math.min(_bsScan,336);
  for(var i=0;i<lim;i++){
    var hit=(!wrong && i===arg);
    var col=hit?C_ANS:(peaks[i]>40?C_MAIN:C_GREY);
    svg+='<line x1="'+_bsX(i).toFixed(1)+'" y1="'+BS_YB+'" x2="'+_bsX(i).toFixed(1)+'" y2="'+_bsY(peaks[i]).toFixed(1)+'" '+
         'stroke="'+col+'" stroke-width="'+(hit?2.4:1)+'" opacity="'+(hit?1:0.72)+'"/>';
  }
  /* 扫描线 */
  if(_bsScan<336){
    var sx=_bsX(Math.min(_bsScan,335));
    svg+='<line x1="'+sx.toFixed(1)+'" y1="'+BS_Y0+'" x2="'+sx.toFixed(1)+'" y2="'+BS_YB+'" stroke="'+C_HI+'" stroke-width="1" opacity="0.5"/>';
  }
  /* 锁定高光 */
  if(_bsLocked && !wrong){
    svg+='<circle cx="'+_bsX(arg).toFixed(1)+'" cy="'+_bsY(127).toFixed(1)+'" r="6" fill="none" stroke="'+C_HI+'" stroke-width="2"/>';
    svg+=_t(_bsX(arg),_bsY(127)-15,'N_ID¹='+arg+' 锁定',{a:'middle',s:10.5,w:700,f:C_HI});
  }
  svg+=_t(BS_X0,BS_YB+16,'N_ID¹ = 0',{s:9,f:C_SEC});
  svg+=_t(BS_X0+BS_W,BS_YB+16,'335',{a:'end',s:9,f:C_SEC});
  /* 结果卡 */
  if(_bsLocked){
    if(!wrong){
      svg+='<rect x="240" y="398" width="240" height="60" rx="10" fill="'+C_ANSL+'" stroke="'+C_ANS+'" stroke-width="2"/>';
      svg+=_t(360,418,'N_ID¹ = 112 解出',{a:'middle',s:12,w:800,f:C_ANS});
      svg+=_t(360,440,'PCI = 3×112 + 1 = 337',{a:'middle',s:13,w:800,f:C_MAIND});
    } else {
      svg+='<rect x="120" y="394" width="480" height="68" rx="10" fill="#fef2f2" stroke="'+C_HI+'" stroke-width="2.5"/>';
      svg+=_t(360,414,'相关失败：激光柱坍塌，336 路全趴在 ≈15',{a:'middle',s:14,w:800,f:C_HI});
      svg+=_t(360,436,'前置 N_ID²='+_bsN2+' 错误 → m₀ 整体错位 → 无任何假设能对齐',{a:'middle',s:10.5,w:700,f:'#7f1d1d'});
      svg+=_t(360,452,'（m-序列是低互相关 ≈ −1/127，不是正交；错位即全面失配）',{a:'middle',s:9,st:1,f:'#991b1b'});
    }
  }
  svg+='</svg>';
  /* 控件 */
  var n2btn=function(k,lbl,warn){
    var on=(_bsN2===k);
    var cls='case-btn'+(on?(warn?' warn-on':' on'):'');
    return '<button class="'+cls+'" onclick="bsSetN2('+k+')">'+lbl+'</button>';
  };
  var ctrl='<div class="ctrl-bar">'+
    n2btn(1,'用 N_ID²=1（正确）',false)+
    n2btn(0,'错 N_ID²=0（对照）',true)+
    '<span style="width:1px;height:18px;background:var(--border);"></span>'+
    '<button class="case-btn" onclick="bsScan()">▶ 开始扫描</button>'+
    '<button class="case-btn" onclick="bsReset()">↺ 复位</button></div>';
  return '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:16px;">'+ctrl+svg+'</div>';
}
function _bsVC(){ return document.getElementById('vizContainer'); }
function _bsRerender(){ var vc=_bsVC(); if(vc) vc.innerHTML=renderBlindSearch(); }
function bsSetN2(k){
  if(_bsTid){ clearInterval(_bsTid); _bsTid=null; }
  _bsN2=k; _bsScan=0; _bsLocked=false; _bsRerender();
}
function bsScan(){
  if(_bsTid){ clearInterval(_bsTid); _bsTid=null; }
  _bsScan=0; _bsLocked=false; _bsRerender();
  var wrong=(_bsN2!==TRUE_N2);
  _bsTid=setInterval(function(){
    _bsScan+=6;
    if(_bsScan>=336){
      _bsScan=336; _bsLocked=true;
      clearInterval(_bsTid); _bsTid=null; _bsRerender();
      if(!wrong){
        /* 先写总线两个键,再单次 ctxSet 触发一次重绘+顶栏同步(避免双重建) */
        if(window.NR_CTX){ window.NR_CTX.nid1=TRUE_N1; }
        Engine.ctxSet('pci', TRUE_PCI);
        Engine.LogEngine.inject('[PHY] ✓ SSS 锁定 N_ID¹='+TRUE_N1+'（峰=127，次高≈15）。');
        Engine.LogEngine.inject('[LOCK] 合成 PCI = 3·'+TRUE_N1+' + '+TRUE_N2+' = '+TRUE_PCI+'，写入 NR_CTX。');
      } else {
        Engine.LogEngine.inject('[WARN] 用错 N_ID²='+_bsN2+'：336 路最高相关仅 ≈15，无法检出 N_ID¹。');
      }
    } else { _bsRerender(); }
  },22);
  Engine.addTimer(_bsTid);
}
function bsReset(){
  if(_bsTid){ clearInterval(_bsTid); _bsTid=null; }
  _bsScan=0; _bsLocked=false; _bsRerender();
}

/* ─── Viz Router ─────────────────────────────────────────── */
Engine.renderVizSVG = function(subIdx){
  if(subIdx===0) return renderS3Discuss();
  if(subIdx===1) return renderDualMSeq();
  if(subIdx===2) return renderRxExtract();
  if(subIdx===3) return renderBlindSearch();
  return renderS3Discuss();
};
Engine.onAfterRender = function(subIdx){
  if(subIdx===1){ d1Set(112); }
  if(subIdx===2){ _rxAnim(); }
  if(subIdx===3){ bsReset(); bsScan(); }
};
Engine.onStageExit = function(){
  if(_d1tid){ clearInterval(_d1tid); _d1tid=null; }
  if(_rxTid){ clearInterval(_rxTid); _rxTid=null; }
  if(_bsTid){ clearInterval(_bsTid); _bsTid=null; }
};

Engine.boot({ stageIdx: 3 });
</script>

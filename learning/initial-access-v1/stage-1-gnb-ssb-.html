<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage ① · gNB 广播与 SSB</title>
<link rel="stylesheet" href="design-system.css">
</head>
<body>
<div id="app"></div>

<script src="engine.js"></script>
<script src="stage-data.js"></script>
<script>
(function() {
  'use strict';

  var VW = 720, VH = 452;
  var selectedCase = 'C';
  var selectedFR = 'FR1'; /* FR1 or FR2 toggle for bottom band */
  var ssbGridPCI = 0;    /* PCI for sub-step 2 DM-RS offset (derived from N_ID¹,N_ID²) */
  var nid2Val = 0;       /* N_ID² ∈ {0,1,2} — from PSS */
  var nid1Val = 0;       /* N_ID¹ ∈ {0~335} — from SSS */
  var pciStep = 0;        /* current step in PCI derivation card */

  window.switchPCIStep = function(n) {
    pciStep = n;
    Engine.renderAll();
  };
  window.updateNID2 = function(val) {
    nid2Val = Math.max(0, Math.min(2, parseInt(val) || 0));
    ssbGridPCI = 3 * nid1Val + nid2Val;
    Engine.renderAll();
  };
  window.updateNID1 = function(val) {
    nid1Val = Math.max(0, Math.min(335, parseInt(val) || 0));
    ssbGridPCI = 3 * nid1Val + nid2Val;
    Engine.renderAll();
  };

  /* ── FR toggle handler ──────────────────────────────────────────────── */
  window.switchFR = function(fr) {
    selectedFR = fr;
    Engine.renderAll();
  };

  /* ── PCI slider handler (sub-step 2) ─────────────────────────────────── */
  window.updateSSBGridPCI = function(val) {
    ssbGridPCI = parseInt(val) || 0;
    Engine.renderAll();
  };

  /* ── Case definitions ────────────────────────────────────────────────── */
  var CASE_DEFS = {
    A: { scs:'15kHz',  lMax:8,  fr:'FR1', label:'Case A',  sub:'15kHz · 基础型',     color:'#6366f1' },
    B: { scs:'30kHz',  lMax:8,  fr:'FR1', label:'Case B',  sub:'30kHz · 升速型',     color:'#8b5cf6' },
    C: { scs:'30kHz',  lMax:8,  fr:'FR1', label:'Case C',  sub:'30kHz · 国内主力 ★', color:'#2563eb' },
    D: { scs:'120kHz', lMax:64, fr:'FR2', label:'Case D',  sub:'120kHz · mmWave',    color:'var(--accent)' },
    E: { scs:'240kHz', lMax:64, fr:'FR2', label:'Case E',  sub:'240kHz · 极速',      color:'#ef4444' },
  };

  /* ── Beam geometry per case ──────────────────────────────────────────── */
  function getBeamCount(c) { return CASE_DEFS[c].lMax; }

  /* ── SSB bar positions on timeline (x: 40~680 for 0~20ms) ────────────── */
  function getSSBPositions(c) {
    var def = CASE_DEFS[c];
    var n = def.lMax;
    var positions = [];

    if (c === 'A') {
      /* 15kHz SCS: 1 slot = 1ms, 2 SSB per slot, 4 slots for 8 beams = 4ms */
      var slotMs = 1.0, perSlot = 2;
      for (var i = 0; i < n; i++) {
        var slot = Math.floor(i / perSlot);
        var offsetInSlot = (i % perSlot) * 0.35; /* 2nd SSB at +0.35ms */
        var t = slot * slotMs + offsetInSlot + 0.1;
        positions.push({ t: t, x: 40 + t * 32, beam: i });
      }
    } else if (c === 'B' || c === 'C') {
      /* 30kHz SCS: 1 slot = 0.5ms, 2 SSB per slot, first SSB at sym 4(Case B) or sym 2(Case C) */
      var slotMs2 = 0.5, perSlot2 = 2;
      var startOffset = (c === 'C') ? 0.07 : 0.13;
      for (var i2 = 0; i2 < n; i2++) {
        var slot2 = Math.floor(i2 / perSlot2);
        var offsetInSlot2 = (i2 % perSlot2) * 0.18;
        var t2 = slot2 * slotMs2 + offsetInSlot2 + startOffset;
        positions.push({ t: t2, x: 40 + t2 * 32, beam: i2 });
      }
    } else if (c === 'D') {
      /* 120kHz SCS: 1 slot = 0.125ms, 2 SSB per slot, 64 beams compressed */
      var slotMs3 = 0.125, perSlot3 = 2;
      for (var i3 = 0; i3 < n; i3++) {
        var slot3 = Math.floor(i3 / perSlot3);
        var offsetInSlot3 = (i3 % perSlot3) * 0.045;
        var t3 = slot3 * slotMs3 + offsetInSlot3 + 0.02;
        positions.push({ t: t3, x: 40 + t3 * 32, beam: i3 });
      }
    } else if (c === 'E') {
      /* 240kHz SCS: 1 slot = 0.0625ms, even denser */
      var slotMs4 = 0.0625, perSlot4 = 2;
      for (var i4 = 0; i4 < n; i4++) {
        var slot4 = Math.floor(i4 / perSlot4);
        var offsetInSlot4 = (i4 % perSlot4) * 0.022;
        var t4 = slot4 * slotMs4 + offsetInSlot4 + 0.01;
        positions.push({ t: t4, x: 40 + t4 * 32, beam: i4 });
      }
    }
    return positions;
  }

  /* ── Case switch handler ─────────────────────────────────────────────── */
  window.switchCase = function(c) {
    selectedCase = c;
    /* Inject case-specific logs */
    var logs = window.NR_VIZ_DATA && window.NR_VIZ_DATA.CASE_LOGS ? window.NR_VIZ_DATA.CASE_LOGS[c] : [];
    if (logs && logs.length > 0) {
      Engine.LogEngine.clear();
      logs.forEach(function(msg) {
        var level = 'info';
        if (msg.indexOf('[gNB-RRM]')===0) level = 'init';
        else if (msg.indexOf('[gNB-PHY]')===0) level = 'data';
        else if (msg.indexOf('[gNB-TX]')===0 && msg.indexOf('[SUCCESS]')>=0) level = 'ok';
        else if (msg.indexOf('[gNB-TX]')===0) level = 'data';
        Engine.LogEngine.push(level, msg);
      });
    }
    Engine.renderAll();
  };

  /* ═══════════════════════════════════════════════════════════════════════
     renderVizSVG :: Sub-step 0 — Case A~E 时域图谱 + 波束扫描
     ═══════════════════════════════════════════════════════════════════════ */
  Engine.renderVizSVG = function(subIdx, state) {

    if (subIdx === 0) {
      var cdef = CASE_DEFS[selectedCase];
      var beams = getSSBPositions(selectedCase);
      var nBeams = beams.length;
      var burstEndMs = 5;  /* TS 38.213: Burst Set 永远框定前 5ms 半帧，无论实际打多久 */
      var burstEndX = 40 + burstEndMs * 32;

      /* ── Build Case Tab buttons ───────────────────────────────────── */
      var caseKeys = ['A','B','C','D','E'];
      var tabsHTML = '';
      var tabW = 126, tabH = 32, tabGap = 10;
      var tabStartX = (VW - (tabW * 5 + tabGap * 4)) / 2;
      for (var ti = 0; ti < caseKeys.length; ti++) {
        var ck = caseKeys[ti];
        var cd = CASE_DEFS[ck];
        var tx = tabStartX + ti * (tabW + tabGap);
        var isActive = (ck === selectedCase);
        tabsHTML +=
          '<g onclick="switchCase(\'' + ck + '\')" style="cursor:pointer;">' +
            '<rect x="' + tx + '" y="20" width="' + tabW + '" height="' + tabH + '" rx="7" ' +
              'fill="' + (isActive ? cd.color : 'var(--surface)') + '" ' +
              'stroke="' + cd.color + '" stroke-width="' + (isActive ? '2' : '1.2') + '" ' +
              'opacity="' + (isActive ? '0.18' : '1') + '"/>' +
            (isActive ? '<rect x="' + tx + '" y="20" width="' + tabW + '" height="' + tabH + '" rx="7" fill="' + cd.color + '" opacity="0.12"/>' : '') +
            '<text x="' + (tx + tabW/2) + '" y="34" text-anchor="middle" font-size="10" font-weight="700" ' +
              'fill="' + (isActive ? cd.color : 'var(--text-mut)') + '" font-family="var(--font-mono)">' + cd.label + '</text>' +
            '<text x="' + (tx + tabW/2) + '" y="46" text-anchor="middle" font-size="7.5" ' +
              'fill="' + (isActive ? cd.color : 'var(--text-mut)') + '" font-family="var(--font-sans)">' + cd.sub + '</text>' +
          '</g>';
      }

      /* ── Build SSB bars on timeline ────────────────────────────────── */
      var barsHTML = '';
      var barW = nBeams <= 8 ? 5 : 0.8;
      var barH = 28;
      var barOpacity = nBeams <= 8 ? 0.75 : 0.4;
      for (var bi = 0; bi < beams.length; bi++) {
        var b = beams[bi];
        barsHTML +=
          '<rect x="' + (b.x - barW/2) + '" y="60" width="' + barW + '" height="' + barH + '" rx="0.5" ' +
            'fill="' + cdef.color + '" opacity="' + barOpacity + '">' +
            '<animate attributeName="opacity" values="' + (barOpacity*0.4) + ';' + (barOpacity*1.2) + ';' + (barOpacity*0.4) + '" dur="' + (0.6 + bi*0.08) + 's" repeatCount="indefinite"/>' +
          '</rect>';
        /* Beam label — alternate above/below to avoid crowding */
        if (nBeams <= 8) {
          var labelY = (b.beam % 2 === 0) ? 56 : 95;
          barsHTML +=
            '<text x="' + b.x + '" y="' + labelY + '" text-anchor="middle" font-size="6.5" fill="' + cdef.color + '" font-family="var(--font-mono)">#' + b.beam + '</text>';
        }
      }

      /* ── Beam sweep fan ────────────────────────────────────────────── */
      var antennaX = 360, antennaY = 215;
      var beamHTML = '';
      var totalBeams = nBeams;
      var spreadAngle = totalBeams <= 8 ? 90 : 110;
      var startAngle = -spreadAngle / 2;
      var beamLen = 155;

      for (var bi2 = 0; bi2 < totalBeams; bi2++) {
        var angleDeg = startAngle + (spreadAngle / (totalBeams - 1)) * bi2;
        if (totalBeams === 1) angleDeg = 0;
        var angleRad = angleDeg * Math.PI / 180;
        var halfSpread = totalBeams <= 8 ? 7 : 1.2;

        var cx = antennaX + beamLen * Math.sin(angleRad);
        var cy = antennaY + beamLen * Math.cos(angleRad);
        var lx = antennaX + beamLen * Math.sin((angleDeg - halfSpread) * Math.PI / 180);
        var ly = antennaY + beamLen * Math.cos((angleDeg - halfSpread) * Math.PI / 180);
        var rx = antennaX + beamLen * Math.sin((angleDeg + halfSpread) * Math.PI / 180);
        var ry = antennaY + beamLen * Math.cos((angleDeg + halfSpread) * Math.PI / 180);

        var beamAlpha = totalBeams <= 8 ? 0.12 : 0.06;
        var sweepDelay = bi2 * 0.18;
        beamHTML +=
          '<polygon points="' + antennaX + ',' + antennaY + ' ' + lx.toFixed(0) + ',' + ly.toFixed(0) + ' ' + rx.toFixed(0) + ',' + ry.toFixed(0) + '" ' +
            'fill="' + cdef.color + '" opacity="' + beamAlpha + '" stroke="' + cdef.color + '" stroke-width="0.4" stroke-opacity="0.2">' +
            '<animate attributeName="opacity" values="' + beamAlpha + ';' + (beamAlpha*2.5) + ';' + beamAlpha + '" ' +
              'dur="' + (totalBeams*0.18+0.3) + 's" begin="' + sweepDelay.toFixed(2) + 's" repeatCount="indefinite"/>' +
          '</polygon>';

        /* Beam index label at midpoint */
        if (totalBeams <= 8) {
          var mx = antennaX + (beamLen * 0.85) * Math.sin(angleRad);
          var my = antennaY + (beamLen * 0.85) * Math.cos(angleRad);
          beamHTML +=
            '<text x="' + mx.toFixed(0) + '" y="' + my.toFixed(0) + '" text-anchor="middle" font-size="7.5" ' +
              'fill="' + cdef.color + '" font-family="var(--font-mono)" font-weight="700">#' + bi2 + '</text>';
        }
      }

      /* ── gNB Tower ─────────────────────────────────────────────────── */
      var towerHTML =
        '<g transform="translate(' + (antennaX - 12) + ',' + (antennaY - 40) + ')">' +
          /* Antenna panel */
          '<rect x="4" y="0" width="16" height="30" rx="3" fill="var(--surface)" stroke="var(--text-sec)" stroke-width="1.2"/>' +
          '<line x1="8" y1="6" x2="16" y2="6" stroke="var(--text-mut)" stroke-width="0.6"/>' +
          '<line x1="8" y1="10" x2="16" y2="10" stroke="var(--text-mut)" stroke-width="0.6"/>' +
          '<line x1="8" y1="14" x2="16" y2="14" stroke="var(--text-mut)" stroke-width="0.6"/>' +
          '<line x1="8" y1="18" x2="16" y2="18" stroke="var(--text-mut)" stroke-width="0.6"/>' +
          '<line x1="8" y1="22" x2="16" y2="22" stroke="var(--text-mut)" stroke-width="0.6"/>' +
          /* Tower body */
          '<rect x="7" y="30" width="10" height="35" rx="2" fill="var(--border)" stroke="var(--text-mut)" stroke-width="0.8"/>' +
          /* Base */
          '<rect x="0" y="60" width="24" height="8" rx="2" fill="var(--text-mut)"/>' +
          '<text x="12" y="78" text-anchor="middle" font-size="7" fill="var(--text-mut)" font-family="var(--font-sans)">gNB</text>' +
        '</g>';

      /* ── UE icons ──────────────────────────────────────────────────── */
      /* UE-A: catches Beam 1 (or first quarter beam) */
      var ueABeamIdx = totalBeams <= 8 ? 1 : Math.floor(totalBeams * 0.2);
      var ueAAngle = startAngle + (spreadAngle / (totalBeams - 1)) * ueABeamIdx;
      var ueADist = beamLen + 25;
      var ueAX = antennaX + ueADist * Math.sin(ueAAngle * Math.PI / 180);
      var ueAY = antennaY + ueADist * Math.cos(ueAAngle * Math.PI / 180);

      /* UE-B: catches Beam 6 (or last quarter beam) */
      var ueBBeamIdx = totalBeams <= 8 ? 6 : Math.floor(totalBeams * 0.75);
      var ueBAngle = startAngle + (spreadAngle / (totalBeams - 1)) * ueBBeamIdx;
      var ueBDist = beamLen + 25;
      var ueBX = antennaX + ueBDist * Math.sin(ueBAngle * Math.PI / 180);
      var ueBY = antennaY + ueBDist * Math.cos(ueBAngle * Math.PI / 180);

      function drawUE(ux, uy, beamIdx, label) {
        return '<g transform="translate(' + (ux - 10) + ',' + (uy - 16) + ')">' +
          /* Body */
          '<rect x="5" y="10" width="10" height="14" rx="4" fill="var(--text-sec)"/>' +
          /* Head */
          '<circle cx="10" cy="6" r="5" fill="var(--text-main)"/>' +
          /* Signal bars */
          '<rect x="19" y="13" width="2.5" height="4" rx="0.5" fill="var(--accent)"/>' +
          '<rect x="23" y="10" width="2.5" height="7" rx="0.5" fill="var(--accent)"/>' +
          '<rect x="27" y="7" width="2.5" height="10" rx="0.5" fill="var(--accent)"/>' +
          /* Label */
          '<text x="10" y="34" text-anchor="middle" font-size="8" fill="var(--accent)" font-family="var(--font-mono)" font-weight="700">' + label + '</text>' +
          '<text x="10" y="44" text-anchor="middle" font-size="7" fill="var(--text-mut)" font-family="var(--font-sans)">捕获 SSB#' + beamIdx + '</text>' +
        '</g>';
      }

      var ueAHTML = drawUE(ueAX, ueAY, ueABeamIdx, 'UE-A');
      var ueBHTML = drawUE(ueBX, ueBY, ueBBeamIdx, 'UE-B');


      /* ── Assemble full SVG ─────────────────────────────────────────── */
      return '<svg viewBox="0 0 ' + VW + ' ' + VH + '" width="100%" height="100%" style="display:block;">' +

        /* Title */
        '<text x="360" y="8" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text-main)">SSB 时域发送图谱 · 点击 Case 切换</text>' +

        /* ── Case Tabs ────────────────────────────────────────────────── */
        tabsHTML +

        /* ── Timeline Section (y=55~210) ──────────────────────────────── */
        '<g transform="translate(0,70)">' +

          /* Section label */
          '<text x="360" y="6" text-anchor="middle" font-size="10" fill="var(--text-mut)" font-family="var(--font-sans)" font-weight="600">时域 · 20ms 无线帧</text>' +

          /* Main axis line */
          '<line x1="40" y1="40" x2="680" y2="40" stroke="var(--text-sec)" stroke-width="1.8"/>' +

          /* Tick marks */
          '<line x1="40" y1="35" x2="40" y2="45" stroke="var(--text-main)" stroke-width="2"/>' +
          '<text x="40" y="56" text-anchor="middle" font-size="8.5" fill="var(--text-main)" font-family="var(--font-mono)" font-weight="700">0 ms</text>' +

          '<line x1="200" y1="35" x2="200" y2="45" stroke="var(--brand)" stroke-width="2"/>' +
          '<text x="200" y="56" text-anchor="middle" font-size="8.5" fill="var(--brand)" font-family="var(--font-mono)" font-weight="700">5 ms</text>' +

          '<line x1="360" y1="37" x2="360" y2="43" stroke="var(--text-mut)" stroke-width="1.2"/>' +
          '<text x="360" y="56" text-anchor="middle" font-size="8" fill="var(--text-mut)" font-family="var(--font-mono)">10 ms</text>' +

          '<line x1="680" y1="35" x2="680" y2="45" stroke="var(--text-main)" stroke-width="2"/>' +
          '<text x="680" y="56" text-anchor="middle" font-size="8.5" fill="var(--text-main)" font-family="var(--font-mono)" font-weight="700">20 ms</text>' +

          /* Burst Set window (0~5ms) highlighted */
          '<rect x="40" y="18" width="' + (burstEndX - 40) + '" height="24" rx="6" fill="var(--brand-bg)" stroke="var(--brand)" stroke-width="1.2" stroke-dasharray="6 3"/>' +
          '<text x="' + ((40 + burstEndX)/2) + '" y="34" text-anchor="middle" font-size="8.5" fill="var(--brand)" font-family="var(--font-sans)" font-weight="650">SSB Burst Set · 半帧 5ms</text>' +

          /* SSB position bars */
          '<g transform="translate(0,20)">' +
            /* Bar chart baseline */
            '<line x1="40" y1="42" x2="680" y2="42" stroke="var(--border)" stroke-width="0.5"/>' +
            barsHTML +
          '</g>' +

        '</g>' +

        /* ── Beam Sweep Section ─────────────────────────────────────── */
        '<text x="360" y="167" text-anchor="middle" font-size="10" fill="var(--text-sec)" font-family="var(--font-sans)" font-weight="650">空间辐射 · 波束扫描 (Beam Sweeping)</text>' +

        /* Beams (behind tower and UEs) */
        beamHTML +

        /* Tower */
        towerHTML +

        /* UEs */
        ueAHTML +
        ueBHTML +

        /* Case info badge (right side) */
        '<g transform="translate(510,215)">' +
          '<rect x="0" y="0" width="180" height="54" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2"/>' +
          '<text x="90" y="18" text-anchor="middle" font-size="11" fill="var(--text-main)" font-family="var(--font-mono)" font-weight="700">' + cdef.label + ' · SCS=' + cdef.scs + '</text>' +
          '<text x="90" y="34" text-anchor="middle" font-size="10" fill="var(--text-sec)" font-family="var(--font-sans)">L_max=' + cdef.lMax + ' · ' + cdef.fr + ' · 20ms周期</text>' +
          '<text x="90" y="48" text-anchor="middle" font-size="9" fill="var(--text-mut)" font-family="var(--font-sans)">Burst Set 集中于前 5ms 半帧</text>' +
        '</g>' +

        /* Bottom note */
        '<g transform="translate(20,410)">' +
          '<rect x="0" y="0" width="683" height="22" rx="6" fill="var(--surface)" stroke="var(--text-mut)" stroke-width="1.2" stroke-dasharray="none"/>' +
          '<text x="340" y="14" text-anchor="middle" font-size="9" fill="var(--text-sec)" font-family="var(--font-sans)">不同波束承载相同 MIB，但时域位置与 DMRS 隐式索引不同 → UE 据此选择 RACH 上行波束方向</text>' +
        '</g>' +

      '</svg>';
    }

    /* ── Sub-step 1: 频域定位 ───────────────────────────────────────── */
    if (subIdx === 1) {

      /* ═══════════════════════════════════════════════════════════════════
         TOP BAND (y=38~128): GSCN Funnel — dense ARFCN → sparse GSCN
         ═══════════════════════════════════════════════════════════════════ */
      var funnelTopY = 45, funnelBotY = 105, funnelTopW = 600;
      var funnelCenterX = 360;
      var arfcnBarX = funnelCenterX - funnelTopW / 2; /* 60 */
      var funnelBotW = 100;
      var funnelBotL = funnelCenterX - funnelBotW / 2; /* 310 */
      var funnelBotR = funnelCenterX + funnelBotW / 2; /* 410 */

      /* Dense ARFCN ticks inside top bar */
      var arfcnTicks = '';
      for (var ti = arfcnBarX + 4; ti < arfcnBarX + funnelTopW; ti += 2.5) {
        arfcnTicks += '<line x1="' + ti.toFixed(0) + '" y1="' + funnelTopY + '" x2="' + ti.toFixed(0) + '" y2="' + (funnelTopY + 16) + '" stroke="var(--text-mut)" stroke-width="0.8" opacity="0.35"/>';
      }

      /* Sparse GSCN markers at bottom */
      var gscnMarkers = [
        { x: 130, label: '8750' },
        { x: 250, label: '8764' },
        { x: 360, label: '8778', target: true },
        { x: 500, label: '8812' },
        { x: 590, label: '8846' },
      ];
      var gscnHTML = '';
      for (var gi = 0; gi < gscnMarkers.length; gi++) {
        var gm = gscnMarkers[gi];
        gscnHTML +=
          '<polygon points="' + gm.x + ',' + (funnelBotY + 2) + ' ' + (gm.x + 5) + ',' + (funnelBotY + 10) + ' ' + (gm.x - 5) + ',' + (funnelBotY + 10) + '" ' +
            'fill="var(--brand)" opacity="' + (gm.target ? '1' : '0.35') + '"/>';
        if (gm.target) {
          gscnHTML += '<text x="' + gm.x + '" y="' + (funnelBotY - 5) + '" text-anchor="middle" font-size="7.5" fill="var(--brand)" font-family="var(--font-mono)" font-weight="700">GSCN ' + gm.label + '</text>';
        }
      }

      var topHTML =
        /* Title */
        '<text x="360" y="8" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text-main)">频域定位 · GSCN 粗对齐与 k_SSB 细对齐</text>' +

        /* ── ARFCN dense bar ── */
        '<rect x="' + arfcnBarX + '" y="' + funnelTopY + '" width="' + funnelTopW + '" height="16" rx="4" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2"/>' +
        arfcnTicks +
        /* Label badge */
        '<rect x="' + (arfcnBarX) + '" y="' + (funnelTopY - 18) + '" width="200" height="16" rx="4" fill="var(--surface)" stroke="var(--text-mut)" stroke-width="1.2" stroke-dasharray="none"/>' +
        '<text x="' + (arfcnBarX + 100) + '" y="' + (funnelTopY - 6) + '" text-anchor="middle" font-size="8" fill="var(--text-mut)" font-family="var(--font-sans)">信道栅格 ARFCN · 15kHz 步长 · >30000 频点</text>' +

        /* ── Funnel polygon ── */

        { k:56,  label:'56' },
        { k:120, label:'120' },
        { k:183, label:'183' },
        { k:192, label:'192' },
        { k:239, label:'k=239' },
      ];
      for (var ti = 0; ti < tickDefs.length; ti++) {
        var tk = tickDefs[ti];
        var ty = reY(tk.k);
        yTicks +=
          '<line x1="' + gridRight + '" y1="' + ty + '" x2="' + (gridRight + 6) + '" y2="' + ty + '" stroke="#9CA3AF" stroke-width="0.7"/>' +
          '<text x="' + (gridRight + 14) + '" y="' + (ty + 3.5) + '" text-anchor="start" font-size="8" fill="#4B5563" font-family="var(--font-mono)">' + tk.label + '</text>';
      }


      /* ── SSS center highlight ─────────────────────────────────────── */

      /* ── Legend ───────────────────────────────────────────────────── */
      var legendHTML =
        '<g transform="translate(' + (gridRight + 90) + ',' + (gridTop + 10) + ')">' +
          '<text x="0" y="0" font-size="13" font-weight="700" fill="var(--text-main)">图例</text>' +
          '<rect x="2" y="14" width="14" height="12" rx="2" fill="#FDE8E8"/>' +
          '<text x="24" y="24" font-size="11" fill="var(--text-sec)">PSS</text>' +
          '<rect x="2" y="34" width="14" height="12" rx="2" fill="#EDE5FA"/>' +
          '<text x="24" y="44" font-size="11" fill="var(--text-sec)">SSS</text>' +
          '<rect x="2" y="54" width="14" height="12" rx="2" fill="#EBF5FF" stroke="#93C5FD" stroke-width="1"/>' +
          '<text x="24" y="64" font-size="11" fill="var(--text-sec)">PBCH</text>' +
          '<rect x="2" y="74" width="14" height="12" rx="2" fill="#F3F4F6"/>' +
          '<text x="24" y="84" font-size="11" fill="var(--text-sec)">保护带(Set 0)</text>' +
          '<rect x="3" y="98" width="10" height="6" rx="1" fill="#D97706"/>' +
          '<text x="24" y="105" font-size="11" fill="var(--text-sec)">PBCH DM-RS</text>' +
        '</g>';

      /* ── PCI Card ───────────────────────────────────────────────── */
      var sliderY = gridTop + gridH + 30;
      var pciVal  = 3 * nid1Val + nid2Val;
      var vVal    = pciVal % 4;
      var pciStr  = String(pciVal);
      var vStr    = String(vVal);
      var nid1Str = String(nid1Val);
      var nid2Str = String(nid2Val);
      var cardW   = colW * 4 + 40;
      var cardX   = gridLeft - 12;

      var stepDots = '';
      for (var si = 0; si < 4; si++) {
        var isActive = (si === pciStep);
        var sx = cardW - 70 + si * 18;
        stepDots +=
          '<circle cx="' + sx + '" cy="15" r="6" fill="' + (isActive ? '#2563eb' : '#fff') + '" stroke="' + (isActive ? '#2563eb' : '#D1D5DB') + '" stroke-width="1" onclick="window.switchPCIStep(' + si + ')" style="cursor:pointer"/>' +
          '<text x="' + sx + '" y="17" text-anchor="middle" font-size="6.5" fill="' + (isActive ? '#fff' : '#6B7280') + '" font-family="var(--font-sans)" font-weight="700" onclick="window.switchPCIStep(' + si + ')" style="cursor:pointer">' + (si + 1) + '</text>';
      }

      var tips = [
        '① PSS m序列互相关：Symbol 0 粉色区域 127 RE 与 3 条 m 序列做滑动相关 → N<tspan font-size="8">ID</tspan>² = <tspan fill="#E02424" font-weight="700">' + nid2Str + '</tspan> (3选1，锁定组号)',
        '② SSS Gold序列检测：已知 N<tspan font-size="8">ID</tspan>²=<tspan fill="#E02424" font-weight="700">' + nid2Str + '</tspan>，Symbol 2 紫色区域 127 RE 与 336 条 Gold 序列相关 → N<tspan font-size="8">ID</tspan>¹ = <tspan fill="#7C3AED" font-weight="700">' + nid1Str + '</tspan> (336选1)',
        '③ 合成 PCI = 3·N<tspan font-size="8">ID</tspan>¹ + N<tspan font-size="8">ID</tspan>² = 3·<tspan fill="#7C3AED" font-weight="700">' + nid1Str + '</tspan> + <tspan fill="#E02424" font-weight="700">' + nid2Str + '</tspan> = <tspan fill="#1C64F2" font-weight="700">' + pciStr + '</tspan> (共 3×336 = 1008 个唯一 PCI)',
        '④ DM-RS 频移：v = PCI mod 4 = ' + pciStr + ' mod 4 = <tspan fill="#D97706" font-weight="700">' + vStr + '</tspan>，左侧 PBCH 区域每 4 个 RE 嵌入 1 根金色探针，频域偏移由 v 决定'
      ];

      var cardHTML =
        '<g transform="translate(' + cardX + ',' + sliderY + ')">' +
          '<rect x="0" y="0" width="' + cardW + '" height="56" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>' +
          stepDots +
          /* N_ID² */
          '<rect x="12" y="8" width="60" height="24" rx="5" fill="#fff" stroke="#D1D5DB" stroke-width="0.8"/>' +
          '<text x="18" y="25" font-size="11" fill="#4B5563" font-weight="700" font-family="var(--font-sans)">N<tspan font-size="8">ID²</tspan></text>' +
          '<foreignObject x="48" y="10" width="20" height="20">' +
            '<input type="number" min="0" max="2" value="' + nid2Str + '" onchange="window.updateNID2(this.value)" ' +
              'style="width:18px;height:18px;padding:0;font-size:13px;font-family:Consolas,monospace;font-weight:700;color:#E02424;background:#FEF2F2;border:1px solid #FCA5A5;border-radius:3px;text-align:center;outline:none;"/>' +
          '</foreignObject>' +
          /* N_ID¹ */
          '<rect x="80" y="8" width="74" height="24" rx="5" fill="#fff" stroke="#D1D5DB" stroke-width="0.8"/>' +
          '<text x="86" y="25" font-size="11" fill="#4B5563" font-weight="700" font-family="var(--font-sans)">N<tspan font-size="8">ID¹</tspan></text>' +
          '<foreignObject x="118" y="10" width="32" height="20">' +
            '<input type="number" min="0" max="335" value="' + nid1Str + '" onchange="window.updateNID1(this.value)" ' +
              'style="width:30px;height:18px;padding:0 1px;font-size:13px;font-family:Consolas,monospace;font-weight:700;color:#7C3AED;background:#F5F0FF;border:1px solid #C4B5FD;border-radius:3px;text-align:center;outline:none;"/>' +
          '</foreignObject>' +
          /* Slider */
          '<foreignObject x="158" y="10" width="72" height="20">' +
            '<input type="range" min="0" max="335" value="' + nid1Str + '" oninput="window.updateNID1(this.value)" ' +
              'style="width:70px;height:18px;margin:0;padding:0;accent-color:#7C3AED;cursor:pointer;"/>' +
          '</foreignObject>' +
          /* → PCI */
          '<text x="238" y="25" font-size="10" fill="#4B5563" font-family="var(--font-sans)">→ PCI</text>' +
          '<rect x="282" y="8" width="44" height="24" rx="5" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="0.8"/>' +
          '<text x="304" y="25" text-anchor="middle" font-size="13" fill="#059669" font-weight="700" font-family="var(--font-mono)">' + pciStr + '</text>' +
          /* v */
          '<text x="334" y="25" font-size="10" fill="#4B5563" font-family="var(--font-sans)">v =</text>' +
          '<rect x="356" y="8" width="30" height="24" rx="5" fill="#FFF8E6" stroke="#F59E0B" stroke-width="0.8"/>' +
          '<text x="371" y="25" text-anchor="middle" font-size="13" fill="#D97706" font-weight="700" font-family="var(--font-mono)">' + vStr + '</text>' +
          /* Tip */
          '<text x="14" y="47" font-size="8.5" fill="#6B7280" font-family="var(--font-sans)">' + tips[pciStep] + '</text>' +
        '</g>';

      /* ── Assemble ─────────────────────────────────────────────────── */
      return '<svg viewBox="0 0 ' + VW + ' ' + VH + '" width="100%" height="100%" style="display:block;">' +
        /* Title */
        '<text x="360" y="8" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text-main)">SSB 时频资源网格 · 20 PRB × 4 OFDM Symbol</text>' +

        /* Grid background */
        '<rect x="' + gridLeft + '" y="' + gridTop + '" width="' + (colW * 4) + '" height="' + gridH + '" fill="#F8F9FA" rx="4"/>' +

        /* Column dividers */
        '<line x1="' + colX(1) + '" y1="' + gridTop + '" x2="' + colX(1) + '" y2="' + (gridTop + gridH) + '" stroke="#D1D5DB" stroke-width="0.8"/>' +
        '<line x1="' + colX(2) + '" y1="' + gridTop + '" x2="' + colX(2) + '" y2="' + (gridTop + gridH) + '" stroke="#D1D5DB" stroke-width="0.8"/>' +
        '<line x1="' + colX(3) + '" y1="' + gridTop + '" x2="' + colX(3) + '" y2="' + (gridTop + gridH) + '" stroke="#D1D5DB" stroke-width="0.8"/>' +

        /* ── Col 0: guard + PSS + guard ───────────────────────────── */
        '<rect x="' + colX(0) + '" y="' + reY(55) + '" width="' + colW + '" height="' + (56 * reH) + '" fill="#F3F4F6"/>' +
        '<rect x="' + colX(0) + '" y="' + reY(182) + '" width="' + colW + '" height="' + (127 * reH) + '" fill="#FDE8E8"/>' +
        '<rect x="' + colX(0) + '" y="' + gridTop + '" width="' + colW + '" height="' + (57 * reH) + '" fill="#F3F4F6"/>' +

        /* ── Col 1: PBCH ──────────────────────────────────────────── */
        '<rect x="' + colX(1) + '" y="' + gridTop + '" width="' + colW + '" height="' + gridH + '" fill="#EBF5FF" stroke="#93C5FD" stroke-width="1"/>' +

        /* ── Col 2: mixed PBCH / gap / SSS / gap / PBCH ───────────── */
        /* PBCH top k=0~47 */
        '<rect x="' + colX(2) + '" y="' + reY(47) + '" width="' + colW + '" height="' + (48 * reH) + '" fill="#EBF5FF" stroke="#93C5FD" stroke-width="1"/>' +
        /* Gap k=48~55 */
        '<rect x="' + colX(2) + '" y="' + reY(55) + '" width="' + colW + '" height="' + (8 * reH) + '" fill="#F3F4F6"/>' +
        /* SSS k=56~182 (pale purple fill, no border) */
        '<rect x="' + colX(2) + '" y="' + reY(182) + '" width="' + colW + '" height="' + (127 * reH) + '" fill="#EDE5FA"/>' +
        /* Gap k=183~191 */
        '<rect x="' + colX(2) + '" y="' + reY(191) + '" width="' + colW + '" height="' + (9 * reH) + '" fill="#F3F4F6"/>' +
        /* PBCH bottom k=192~239 */
        '<rect x="' + colX(2) + '" y="' + reY(239) + '" width="' + colW + '" height="' + (48 * reH) + '" fill="#EBF5FF" stroke="#93C5FD" stroke-width="1"/>' +

        /* ── Col 3: PBCH ──────────────────────────────────────────── */
        '<rect x="' + colX(3) + '" y="' + gridTop + '" width="' + colW + '" height="' + gridH + '" fill="#EBF5FF" stroke="#93C5FD" stroke-width="1"/>' +

        /* ── DM-RS dots ── */
        dmrsHTML +

        /* ── Grid border ── */
        '<rect x="' + gridLeft + '" y="' + gridTop + '" width="' + (colW * 4) + '" height="' + gridH + '" fill="none" stroke="#D1D5DB" stroke-width="1.2" rx="4"/>' +


        /* ═════════════════════════════════════════════════════════════
           Axes
           ═════════════════════════════════════════════════════════════ */
        /* Vertical axis */
        '<line x1="' + (gridLeft - 12) + '" y1="' + (gridTop - 8) + '" x2="' + (gridLeft - 12) + '" y2="' + (gridTop + gridH + 8) + '" stroke="var(--text-sec)" stroke-width="1.4"/>' +
        '<polygon points="' + (gridLeft - 12) + ',' + (gridTop - 8) + ' ' + (gridLeft - 16) + ',' + (gridTop - 1) + ' ' + (gridLeft - 8) + ',' + (gridTop - 1) + '" fill="var(--text-sec)"/>' +
        '<text x="' + (gridLeft - 24) + '" y="' + (gridTop + gridH/2) + '" text-anchor="middle" font-size="9" fill="#4B5563" font-family="var(--font-sans)" font-weight="650" transform="rotate(-90,' + (gridLeft - 24) + ',' + (gridTop + gridH/2) + ')">Subcarrier</text>' +

        /* Horizontal axis */
        '<line x1="' + (gridLeft - 12) + '" y1="' + (gridTop + gridH + 8) + '" x2="' + (gridRight + 10) + '" y2="' + (gridTop + gridH + 8) + '" stroke="var(--text-sec)" stroke-width="1.4"/>' +
        '<polygon points="' + (gridRight + 10) + ',' + (gridTop + gridH + 8) + ' ' + (gridRight + 3) + ',' + (gridTop + gridH + 4) + ' ' + (gridRight + 3) + ',' + (gridTop + gridH + 12) + '" fill="var(--text-sec)"/>' +
        '<text x="' + (gridLeft + colW * 2) + '" y="' + (gridTop + gridH + 27) + '" text-anchor="middle" font-size="9" fill="var(--text-sec)" font-family="var(--font-sans)" font-weight="650">OFDM Symbol</text>' +
        (function() {
          var ticks = '';
          for (var s = 0; s < 4; s++) {
            var sx = colX(s) + colW / 2;
            ticks += '<line x1="' + sx + '" y1="' + (gridTop + gridH + 5) + '" x2="' + sx + '" y2="' + (gridTop + gridH + 11) + '" stroke="var(--text-sec)" stroke-width="1"/>';
            ticks += '<text x="' + sx + '" y="' + (gridTop + gridH + 20) + '" text-anchor="middle" font-size="8" fill="var(--text-sec)" font-family="var(--font-mono)" font-weight="600">' + s + '</text>';
          }
          return ticks;
        })() +

        /* Overlay labels */
        colLabels +
        yTicks +
        legendHTML +
        cardHTML +
      '</svg>';
    }

    /* ── Sub-step 3-4: placeholder ─────────────────────────────────── */
    if (subIdx >= 3 && subIdx <= 4) {
      return '<svg viewBox="0 0 ' + VW + ' ' + VH + '" width="100%" height="100%" style="display:block;">' +
        '<text x="360" y="180" text-anchor="middle" font-size="16" fill="var(--text-mut)" font-family="var(--font-mono)">此步骤正在开发中…</text>' +
        '<text x="360" y="210" text-anchor="middle" font-size="11" fill="var(--text-mut)">sub-step ' + subIdx + ' · 即将上线</text>' +
      '</svg>';
    }

    return '';
  };

  /* ── Boot ───────────────────────────────────────────────────────────── */
  Engine.boot({ stageIdx: 1 });
  /* Immediately switch to Case C to prime logs & viz (synchronous, no flicker) */
  switchCase('C');

})();
</script>
</body>
</html>

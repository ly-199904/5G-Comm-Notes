/* ── Sub 1: 时钟树动画 ─────────────────────────────────────── */
var _clkDone = 0;
var _clkTimer = null;

function replayClockAnim() {
  _clkDone = 0;
  if (_clkTimer) clearInterval(_clkTimer);

  var arrs  = ['arr1','arr2','arr3'];
  var boxes = ['box-pll1','box-pll2','box-tc'];

  // 全部置暗
  ['arr1','arr2','arr3','box-pll1','box-pll2','box-tc'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.setAttribute('opacity', '0.2');
  });

  _clkTimer = Engine.addTimer(setInterval(function() {
    _clkDone++;
    if (_clkDone <= 3) {
      var ae = document.getElementById(arrs[_clkDone - 1]);
      var be = document.getElementById(boxes[_clkDone - 1]);
      if (ae) ae.setAttribute('opacity', '1');
      if (be) be.setAttribute('opacity', '1');
      if (_clkDone === 3) {
        clearInterval(_clkTimer);
      }
    }
  }, 750));
}
